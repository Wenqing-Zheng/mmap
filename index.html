});
searchInput.addEventListener('keydown', function(e){
  var items = searchResults.querySelectorAll('.sr-item');
  if(e.key==='ArrowDown'){
    if(!items.length) return;
    e.preventDefault();
    setSearchActive(searchActiveIdx+1>=items.length ? 0 : searchActiveIdx+1);
    return;
  }
  if(e.key==='ArrowUp'){
    if(!items.length) return;
    e.preventDefault();
    setSearchActive(searchActiveIdx-1<0 ? items.length-1 : searchActiveIdx-1);
    return;
  }
  if(e.key==='Enter'){
    if(searchActiveIdx>=0 && searchActiveIdx<items.length){
      e.preventDefault();
      // must stop this Enter from also bubbling up to the document-level
      // keydown handler: the synthesized click below (via
      // commitSearchResult -> closeAllRailPanels) blurs searchInput BEFORE
      // the real event finishes bubbling, so by the time it reaches the
      // document handler the "focus is inside a rail panel, ignore" guard
      // no longer matches — and the global Enter-opens-edit-dialog rule
      // fired on the node this Enter just selected, which is exactly the
      // "选中节点然后回车时,能看到修改节点信息" bug: this Enter should only
      // ever select/activate, never edit.
      e.stopPropagation();
      // ⌥Enter / ⌃Enter mirror ⌥click / ⌃click on the highlighted result —
      // forward the modifier flags into the synthesized click so the
      // item's own click handler (which checks ev.altKey/ev.ctrlKey) picks
      // the same branch a real modified click would have.
      items[searchActiveIdx].dispatchEvent(new MouseEvent('click', {altKey:e.altKey, ctrlKey:e.ctrlKey}));
    }
    return;
  }

/* ============================================================
   tree view flyout: full structural overview, batch-friendly.
   double-click a row to make that node the visible focus root.
   press-and-drag a row onto another row to reparent that subtree
   (drop above/below a row = insert as sibling there; drop directly
   on a row's body = make it the last child of that row).
   ============================================================ */
var btnTree = document.getElementById('btnTree');
var treeFlyout = document.getElementById('treeFlyout');
var treeList = document.getElementById('treeList');
registerRailPanel(btnTree, treeFlyout, function(){
  treeFocusId = (selectedId && node(selectedId)) ? selectedId : state.rootId;
  // reverse link: opening the tree view must land on/highlight whatever
  // is currently selected on the canvas — "选中主视图的node,打开treeview
  // 会自动选中同样一个条目". renderTreeView() only walks into a subtree
  // whose n.drilled is already true, so if the selected node's own
  // ancestor chain isn't already expanded IN THE TREE'S OWN drilled
  // state, its row never gets created at all and treeFocusId's own
  // querySelector below finds nothing — expand every ancestor first so
  // the row is guaranteed to exist. Never touches drilled state on the
  // selected node itself or anything below it (only ancestors), and never
  // touches px/py/positions — purely a visibility unfold, same as
  // makeTreeSelectionVisibleOnCanvas's own direction-reversed counterpart.
  var anc = parentOf(treeFocusId);
  while(anc){ anc.drilled = true; anc = parentOf(anc.id); }
  scheduleSave();
  renderTreeView();
});
/* clicking a node in the tree view must guarantee it's actually visible on
   the canvas afterward — as if its PARENT had been selected and Shift+Enter
   pressed: the parent becomes the focus root, so the clicked node shows up
   as a first-level child alongside its siblings, with the parent visible
   too. How much of the clicked node's OWN subtree unfolds is governed by
   the default max visible depth setting, same as any other view-broadening
   action. Only meaningful for non-root nodes — the ultimate root is already
   always fully visible as the outermost frame. */
function makeTreeSelectionVisibleOnCanvas(id){
  var n = node(id);
  if(!n) return;
  var pn = parentOf(id);
  if(pn){
    state.focusId = pn.id;
    pn.drilled = true;
    collapseBeyondDepth(pn.id, appParams.maxAutoDepth);
  } else {
    state.focusId = id;
  }
  setExpandedToDepth(id, appParams.maxAutoDepth);
  scheduleSave();
}
function renderTreeView(){
  treeList.innerHTML='';
  treeDropLineEl = null; // the old element was just wiped by innerHTML=''; getTreeDropLineEl() will lazily recreate it
  (function walk(id, depth, container){
    var n = node(id);
    if(!n) return;
    var row = document.createElement('div');
    row.className='tv-row'+(selectedId===id?' tv-selected':'');
    row.style.paddingLeft = (8+depth*16)+'px';
    row.dataset.id = id;
    row.tabIndex = -1; // focusable via JS (arrow-key nav / auto-focus on panel open), not part of normal Tab order
    row.draggable = (id!==state.rootId);
    // same category-edit-mode toggle as the canvas (Shift+click either
    // view enters/exits it together, since it's the same catEditMode
    // flag) — while active, every tree row ALSO shows its category letter,
    // color-coded (A蓝色/B红色/C黄色), and for B nodes "I{importance}
    // M{masterLevel}" — "tree view每个node同时左侧也显示ABC类型...A用蓝色,
    // B用红色,C用黄色".
    if(catEditMode){
      var catTag = document.createElement('span');
      catTag.className = 'tv-cat-tag';
      catTag.dataset.cat = n.category;
      catTag.textContent = n.category + (n.category==='B' ? ('('+importanceOf(n)+','+n.masterLevel+')') : '');
      row.appendChild(catTag);
    }
    var summarySpan = document.createElement('span');
    summarySpan.className='tv-summary';
    summarySpan.textContent = richToPlain(n.summary) || '(未命名)';
    row.appendChild(summarySpan);
    var hasKids = n.children.length>0;
    var isTreeRoot = (id===state.rootId); // the ultimate root always shows its children, same as the canvas
    if(hasKids){
      var cnt = document.createElement('span');
      cnt.className='tv-vis-dim';
      cnt.textContent = '('+n.children.length+')';
      row.appendChild(cnt);
    }
    // same interaction language as the canvas: a "*" badge shows when a
    // node has children but they're collapsed (tree view always keeps
    // n.drilled in sync with the canvas, since it's the same node data) —
    // clicking it expands; double-click collapses (no-op if already
    // collapsed); ⌃click opens the color/border popover; ⌥click opens the
    // edit dialog.
    if(hasKids && !n.drilled && !isTreeRoot){
      var star = document.createElement('span');
      star.className='tv-star';
      star.textContent='＊';
      star.title='展开子节点（⌘点击：一次性展开子树，至多 '+appParams.expandCap+' 层）';
      star.addEventListener('mousedown', function(ev){
        ev.stopPropagation();
        pushUndo();
        if(ev.metaKey){
          expandSubtreeCapped(id, appParams.expandCap);
        } else {
          n.drilled = true;
        }
        selectedId = id;
        treeFocusId = id;
        scheduleSave();
        renderTreeView();
        render();
        resyncRootView();
      });
      row.appendChild(star);
    }
    row.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(ev.ctrlKey){
        openStylePopover(ev.clientX, ev.clientY, n);
        return;
      }
      if(ev.altKey){
        selectedId = id;
        treeFocusId = id;
        renderTreeView();
        openInsertDialog({mode:'edit', node:n});
        return;
      }
      // same manual double-click detection as the canvas nodes, for the
      // same reason: renderTreeView() below wipes and rebuilds treeList's
      // entire innerHTML on every click, so the browser's native dblclick
      // (which needs two mousedown+mouseup pairs on the SAME element) would
      // never fire on the second click since the row element is brand new
      // by then.
      if(isDoubleClick('tv:'+id, ev)){
        if(!isTreeRoot && n.drilled){
          pushUndo();
          n.drilled = false;
          selectedId = id;
          treeFocusId = id;
          scheduleSave();
          renderTreeView();
          render();
          resyncRootView();
        }
        return;
      }
      selectedId = id;
      treeFocusId = id;
      triggerGlow();
      makeTreeSelectionVisibleOnCanvas(id);

    row.addEventListener('contextmenu', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      openStylePopover(ev.clientX, ev.clientY, n);
    });
    row.addEventListener('keydown', function(ev){ handleTreeRowKeydown(ev, id, n, hasKids, isTreeRoot); });

    if(hasKids && (n.drilled || isTreeRoot)){

    }

    var toFocus = treeList.querySelector('.tv-row[data-id="'+treeFocusId+'"]');
    if(toFocus) toFocus.focus();
  }
}
/* keyboard nav once a tree row has focus: ↑/↓ move focus to the previous/
   next VISIBLE row (in the same top-to-bottom order the tree is rendered
   in — this naturally walks into an expanded node's children and back out
   again, matching what the user sees); ←/→ collapse/expand the focused
   row's own children; Enter selects it (same as a click) so the canvas
   updates through makeTreeSelectionVisibleOnCanvas the same way. */
var treeFocusId = null;
function getVisibleTreeRowIds(){
  return Array.prototype.map.call(treeList.querySelectorAll('.tv-row'), function(r){ return r.dataset.id; });
}
/* shared ←/→ (collapse/expand) semantics for tree-order navigation — used
   by both a focused tree row (handleTreeRowKeydown) AND the main canvas's
   own arrow-key handler while the tree panel is open (see the keydown
   listener below), so pressing ←/→ means exactly the same thing in both
   places instead of the canvas falling back to its own directional-
   sibling logic whenever the tree panel happens to be open.
   treeStepRight(id): if collapsed, expands and returns id (same node,
   just now open); if already expanded (or is the tree root, which is
   always shown expanded), returns its first child's id to jump focus/
   selection into it; returns null if there's truly nothing to do (no
   children at all).
   treeStepLeft(id): if expanded, collapses and returns id; if already
   collapsed (or has no children), returns its parent's id to jump focus/
   selection up; returns null only for the ultimate root with nothing left
   to collapse (caller decides what "nothing left" means for its context —
   the tree row handler closes the whole panel, the canvas simply does
   nothing further). */
function treeStepRight(id){
  var n = node(id);
  if(!n || !n.children.length) return null;
  var isTreeRoot = (id===state.rootId);
  if(!isTreeRoot && !n.drilled){
    pushUndo();
    n.drilled = true;
    scheduleSave();
    return id;
  }
  return n.children[0] || null;
}
function treeStepLeft(id){
  var n = node(id);
  if(!n) return null;
  var isTreeRoot = (id===state.rootId);
  if(n.children.length && !isTreeRoot && n.drilled){
    pushUndo();
    n.drilled = false;
    scheduleSave();
    return id;
  }
  if(isTreeRoot) return null;
  var pn = parentOf(id);
  return pn ? pn.id : null;
}
function handleTreeRowKeydown(ev, id, n, hasKids, isTreeRoot){
  // ⌥↓ / ⌥←/→ / ⌥⇧↓ / ⌥⇧←/→ insert children/siblings from a focused tree
  // row — identical semantics (and identical dialog config objects) to the
  // canvas shortcuts below, so the same key combo means the same thing in
  // both views. Checked before the plain arrow-key handling further down
  // so ⌥ + arrow never falls through to collapse/expand/move-focus.
  // ⌥↓ alone wraps a new sole child under the row (insertWrapChild — see its
  // own comment); ⌥⇧↓ keeps adding ordinary batch-inserted children instead,
  // since repeatedly wrapping on every batch submission would nest each new
  // node one level deeper than the last, which isn't what "insert several
  // children in a row" means.
  if(ev.altKey && !ev.metaKey && !ev.ctrlKey){
    var isBatch = ev.shiftKey;
    if(!isBatch && ev.key==='ArrowDown'){
      ev.preventDefault();
      ev.stopPropagation();
      openInsertDialog({mode:'wrapChild', anchorId:id});
      return;
    }
    if(!isBatch && ev.key==='ArrowUp'){
      // ⌥↑ wraps a new PARENT above this row — same insertParentAbove
      // semantics as the canvas's own ⌥↑ (see dirMap above). Not part of
      // the batch/no-batch ArrowDown split above since inserting several
      // parents in a row was never a requested workflow, only ⌥⇧↓/←/→ are.
      ev.preventDefault();
      ev.stopPropagation();
      openInsertDialog({mode:'parent', anchorId:id});
      return;
    }
    var treeDirMap = {ArrowDown:'child', ArrowRight:'sibling-r', ArrowLeft:'sibling-l'};
    var tm = treeDirMap[ev.key];
    // ⌥⇧B fallback for the batch-child action, same reasoning as the
    // canvas's own dirMap above (some macOS setups swallow ⌥⇧↓ at the OS
    // level before it reaches the browser at all). Checks ev.code, NOT
    // ev.key — see the canvas handler's own comment on why: Option remaps
    // which character a letter key reports in .key, so .key is never
    // literally 'b'/'B' while altKey is held.
    if(isBatch && ev.code==='KeyB') tm = 'child';
    if(tm){
      ev.preventDefault();
      ev.stopPropagation();
      if(tm==='child') openInsertDialog({mode:'child', anchorId:id, batch:isBatch});
      else if(tm==='sibling-r') openInsertDialog({mode:'sibling', anchorId:id, dir:1, batch:isBatch});
      else if(tm==='sibling-l') openInsertDialog({mode:'sibling', anchorId:id, dir:-1, batch:isBatch});
      return;
    }
  }
  // ⌘↓ expands / ⌘↑ collapses — same action and same key combo as the
  // canvas's own ⌘↓/⌘↑ (see the main keydown handler's own comment):
  // "选中节点以后展开折叠快捷键改成cmd⬇️,cmd⬆️,同时应用在主视图和tree
  // view". Checked before the plain (no-modifier) arrow handling below so
  // ⌘+arrow never falls through to the tree's own row-to-row focus walk.
  if(ev.metaKey && !ev.ctrlKey && !ev.altKey && !ev.shiftKey && ev.key==='ArrowDown'){
    ev.preventDefault();
    ev.stopPropagation();
    if(hasKids){
      pushUndo();
      n.drilled = true;
      scheduleSave();
      renderTreeView();
      render();
      resyncRootView();
    }
    return;
  }
  if(ev.metaKey && !ev.ctrlKey && !ev.altKey && !ev.shiftKey && ev.key==='ArrowUp'){
    ev.preventDefault();
    ev.stopPropagation();
    collapseNode(n);
    renderTreeView();
    return;
  }
  // ⇧↑/⇧↓ mirror the canvas's own Shift+↑/↓ exactly ("tree view单击node再
  // shift上下,需要支持和主视图一样的功能,即跳转到母节点和第一个孩子节点"):
  // ⇧↑ selects this row's PARENT (already visible — every visible row's
  // parent chain is, by construction, always expanded/visible too, since
  // renderTreeView only walks into a node's children when it's drilled),
  // never touching that parent's own drilled state; ⇧↓ selects the FIRST
  // CHILD, drilling this row open first if it wasn't already so the child
  // row exists to select. Deliberately does NOT fall through to plain
  // ArrowUp/Down's row-to-row focus walk, and never COLLAPSES anything —
  // "此时tree不折叠" — unlike plain ArrowLeft/treeStepLeft, which does.
  if(ev.shiftKey && (ev.key==='ArrowUp' || ev.key==='ArrowDown')){
    ev.preventDefault();
    ev.stopPropagation();
    if(ev.key==='ArrowUp'){
      var pn = parentOf(id);
      if(pn){
        selectedId = pn.id;
        treeFocusId = pn.id;
        triggerGlow();
        makeTreeSelectionVisibleOnCanvas(pn.id);
        renderTreeView();
        render();
      }
    } else {
      if(hasKids){
        if(!n.drilled){
          pushUndo();
          n.drilled = true;
          scheduleSave();
        }
        var firstChildId = n.children[0];
        selectedId = firstChildId;
        treeFocusId = firstChildId;
        triggerGlow();
        makeTreeSelectionVisibleOnCanvas(firstChildId);
        renderTreeView();
        render();
      }
    }
    return;
  }
  if(ev.key==='ArrowDown' || ev.key==='ArrowUp'){
    ev.preventDefault();
    ev.stopPropagation();
    var ids = getVisibleTreeRowIds();
    var idx = ids.indexOf(id);
    var nextIdx = ev.key==='ArrowDown' ? idx+1 : idx-1;
    if(nextIdx>=0 && nextIdx<ids.length){
      treeFocusId = ids[nextIdx];
      var el = treeList.querySelector('.tv-row[data-id="'+treeFocusId+'"]');
      if(el) el.focus();
    }
    return;
  }
  if(ev.key==='ArrowRight'){
    ev.preventDefault();
    ev.stopPropagation();
    var rightTarget = treeStepRight(id);
    if(!rightTarget) return;
    treeFocusId = rightTarget;
    renderTreeView();
    return;
  }
  if(ev.key==='ArrowLeft'){
    ev.preventDefault();
    ev.stopPropagation();
    var leftTarget = treeStepLeft(id);
    if(!leftTarget){
      // treeStepLeft only returns null for the ultimate root (nothing left
      // to collapse or ascend to inside the tree) — collapse the whole
      // panel instead (closeAllRailPanels() already returns focus to
      // btnTree since the tree row is inside it).
      if(isTreeRoot) closeAllRailPanels();
      return;
    }
    treeFocusId = leftTarget;
    renderTreeView();
    return;
  }
  if(ev.key==='Enter'){
    ev.preventDefault();
    ev.stopPropagation();
    // ⌥Enter / ⌃Enter mirror ⌥click / ⌃click (edit dialog / style popover)
    // on the same row — there's no real mouse position when triggered from
    // the keyboard, so the popover anchors off the focused row's own
    // on-screen rect instead of clientX/clientY.
    if(ev.altKey){
      selectedId = id;
      treeFocusId = id;
      renderTreeView();
      openInsertDialog({mode:'edit', node:n});
      return;
    }
    if(ev.ctrlKey){
      var rowEl = treeList.querySelector('.tv-row[data-id="'+id+'"]');
      var rect = rowEl ? rowEl.getBoundingClientRect() : {left:0,top:0};
      openStylePopover(rect.left+20, rect.top+8, n);
      return;
    }
    // ⌘Enter/⌘⇧Enter mirror ⌘click/⌘⇧click EXACTLY (cycleVis / batch
    // cycleVisBatch over the whole subtree) — NOT a focus/navigation
    // action. These previously fell through to the same "jump to root,
    // close the panel" behavior as plain Enter, which is wrong for the
    // same reason ⌘click on a canvas node never closes any panel or
    // changes state.focusId: "cmd enter...要改成cmd鼠标点击功能,即切换
    // 可见度。cmd shift enter...都不能让导航栏退出". The tree panel stays
    // open and the row stays exactly where it is — only n.vis changes.
    if(ev.metaKey && ev.shiftKey){
      var batchSubtree = subtreeIds(id).map(node).filter(Boolean);
      if(batchSubtree.length){
        pushUndo();
        cycleVisBatch(batchSubtree);
        selectedId = id;
        treeFocusId = id;
        scheduleSave();
        renderTreeView();
        render();
        // see the canvas ⌘⇧Enter handler's own comment on why this is
        // needed: toggling detail visibility changes the root's
        // content-driven size, and render() doesn't auto-refit unless
        // state.focusId itself changed — "由于detail展开导致画面被缩放,
        // 请在这些功能后面加一个自动重置缩放".
        resyncRootView();
      }
      return;
    }
    if(ev.metaKey){
      pushUndo();
      cycleVis(n);
      selectedId = id;
      treeFocusId = id;
      scheduleSave();
      renderTreeView();
      render();
      resyncRootView();
      return;
    }
    // plain Enter: the selected row becomes the visible-area ROOT itself
    // (state.focusId = id), NOT a first-level child under its own parent —
    // makeTreeSelectionVisibleOnCanvas's normal behavior (focus the
    // PARENT, so the picked node shows as a child) is deliberately NOT
    // used here; "被选中的节点应该作为可见区域根节点,而不是作为一级孩子
    // 节点". Mirrors the canvas's own Shift+Enter handler EXACTLY (same
    // cur.drilled=true + alreadyFocus-conditional resync, not
    // setExpandedToDepth's blanket collapse-beyond-depth) — a first
    // attempt at this used setExpandedToDepth instead, which force-
    // collapsed every node past maxAutoDepth even when the canvas's own
    // Shift+Enter wouldn't have, so the two paths landed on different
    // results and Shift+Enter had to be pressed again afterward to fix it
    // up ("再跟一个shift enter,才是我想要的"). Net effect after this
    // block matches "就好像现在版本再按两次Esc一样" pressed on TOP of the
    // focus change: Esc #1 would normally just clear selectedId (see the
    // Escape handler above), Esc #2 would then close the panel — done in
    // the opposite order here (panel closes first since it's about to be
    // left behind, selection clears last) but landing on the identical
    // end state: no panel open, nothing selected, node `id` now filling
    // the screen as the new root.
    pushUndo();
    n.drilled = true;
    var alreadyFocus = state.focusId === id;
    state.focusId = id;
    scheduleSave();
    closeAllRailPanels();
    selectedId = null;
    treeFocusId = null;
    render();
    if(alreadyFocus){ resyncRootView(); }
    return;
  }
}
var treeDragId = null;
var treeDropLineEl = null;
var lastDropRow = null;
function getTreeDropLineEl(){
  if(!treeDropLineEl){
    treeDropLineEl = document.createElement('div');
    treeDropLineEl.className='tv-drop-line';
    treeDropLineEl.id='__treeDropLine';
    treeList.appendChild(treeDropLineEl);
  }
  return treeDropLineEl;
}
var dragGhostImg = null;
function getTransparentDragImage(){
  if(!dragGhostImg){
    dragGhostImg = new Image();
    dragGhostImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7';
  }
  return dragGhostImg;
}
function attachTreeRowDrag(row, id){
  row.addEventListener('dragstart', function(ev){
    treeDragId = id;
    row.classList.add('tv-dragging');
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', id);
    // suppress the browser's native drag-preview ghost — it lags behind the
    // cursor and, combined with our own drop indicator, looked like two
    // shadows chasing the mouse at different speeds. We render only our own
    // (instant, no-lag) indicator instead.
    ev.dataTransfer.setDragImage(getTransparentDragImage(), 0, 0);
  });
  row.addEventListener('dragend', function(){
    row.classList.remove('tv-dragging');
    treeDragId = null;
    clearTreeDropIndicators();
  });
  row.addEventListener('dragover', function(ev){
    ev.preventDefault();
    if(!treeDragId || treeDragId===id) return;
    if(isDescendant(treeDragId, id)) return; // can't drop a subtree onto itself/its own descendant
    // avoid getBoundingClientRect() here — it forces a synchronous layout
    // flush on every dragover (which fires at high frequency while the
    // mouse moves), and that extra flush was what made the horizontal
    // drop-line lag a visible frame or two behind the browser-native
    // outline highlight (which doesn't need layout math, just a class
    // toggle). offsetTop/offsetHeight read from the already-computed
    // layout tree and don't force a recalc, so both indicators now move
    // in the same frame.
    if(lastDropRow && lastDropRow!==row) lastDropRow.classList.remove('tv-drop-inside');
    lastDropRow = row;
    var rowTop = row.offsetTop, rowH = row.offsetHeight;
    var localY = ev.clientY - treeList.getBoundingClientRect().top + treeList.scrollTop;
    var frac = (localY-rowTop)/rowH;
    var zone = frac<0.28 ? 'before' : (frac>0.72 ? 'after' : 'inside');
    row.dataset.dropZone = zone;
    var line = getTreeDropLineEl();
    if(zone==='inside'){
      line.classList.remove('show');
      row.classList.add('tv-drop-inside');
    } else {
      row.classList.remove('tv-drop-inside');
      line.style.top = (zone==='before' ? rowTop-1 : rowTop+rowH-1)+'px';
      line.classList.add('show');
    }
  });
  row.addEventListener('dragleave', function(ev){
    if(ev.target===row) row.classList.remove('tv-drop-inside');
  });
  row.addEventListener('drop', function(ev){
    ev.preventDefault();
    var dragId = treeDragId;
    var zone = row.dataset.dropZone;
    clearTreeDropIndicators();
    if(!dragId || dragId===id || dragId===state.rootId || isDescendant(dragId, id)) return;
    var dragNode = node(dragId);
    var targetNode = node(id);
    if(!dragNode || !targetNode) return;
    pushUndo();
    removeFromParent(dragId);
    dragNode.px = 0; dragNode.py = 0; dragNode.placed = false;
    if(zone==='inside' || id===state.rootId){
      // the root has no siblings, so before/after on it also means "make it a child"
      dragNode.parentId = id;
      targetNode.children.push(dragId);
      targetNode.drilled = true;
    } else {
      var pn = parentOf(id) || node(state.rootId);
      dragNode.parentId = pn.id;
      var idx = pn.children.indexOf(id);
      pn.children.splice(zone==='before'?idx:idx+1, 0, dragId);
    }
    selectedId = dragId;
    scheduleSave();
    renderTreeView();
    render();
  });
}
function clearTreeDropIndicators(){
  document.querySelectorAll('.tv-row').forEach(function(r){ r.classList.remove('tv-drop-inside'); delete r.dataset.dropZone; });
  if(treeDropLineEl) treeDropLineEl.classList.remove('show');
  lastDropRow = null;
}

   commitRbMaterialize) only ever needs the top-level checks — descendant
   coverage is derived at read-time by randomButtonScopeBNodes. */

function openRbMaterializeDialog(editBtn){
  rbEditingButton = editBtn || null;
  rbNameInput.value = editBtn ? (editBtn.name||'') : '';

/* true if `id` or any ancestor of it is in rbCheckedTop — that ancestor's
   check implicitly covers this node, so its own checkbox renders checked+disabled. */
function rbIsImplicitlyChecked(id){
  var cur = node(id);
  while(cur){
    if(rbCheckedTop[cur.id]) return true;
    cur = parentOf(cur.id);
  }
  return false;
}
function renderRbTreePicker(){
  rbTreePicker.innerHTML = '';
  (function walk(id, depth){
    var n = node(id);
    if(!n || n.category==='C') return; // C nodes never shown in this picker
    var row = document.createElement('div');
    row.className = 'rbt-row';
    row.style.paddingLeft = (depth*14)+'px';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    var implicit = rbIsImplicitlyChecked(id) && !rbCheckedTop[id];
    cb.checked = !!rbCheckedTop[id] || implicit;
    cb.disabled = implicit;
    cb.addEventListener('change', function(){
      if(cb.checked) rbCheckedTop[id] = true;
      else delete rbCheckedTop[id];
      renderRbTreePicker();
    });
    var label = document.createElement('span');
    label.textContent = richToPlain(n.summary) || '(未命名)';
    var cat = document.createElement('span');
    cat.className = 'rbt-cat';
    cat.textContent = n.category;
    row.appendChild(cb); row.appendChild(label); row.appendChild(cat);
    rbTreePicker.appendChild(row);
    n.children.forEach(function(cid){ walk(cid, depth+1); });
  })(state.rootId, 0);
}

/* ============================================================

var railDepthValueEl = document.getElementById('railDepthValue');

  railDepthValueEl.textContent = appParams.maxAutoDepth;

railDepthMinusEl.addEventListener('click', function(){

  // 作用于当前可见区域所有节点" — by re-running the same collapse pass
  // Shift+Up/tree-selection already use, scoped to the current focus root.
  collapseBeyondDepth(state.focusId, appParams.maxAutoDepth);
  scheduleSave(); render();
  // collapsing/expanding nodes changes the root's own content-driven size
  // (containerSize), but render() only auto-refits the camera when
  // state.focusId itself changes — it stays untouched here, so without an
  // explicit refit the root silently stops filling the screen (leftover
  // blank margin) the moment its size changes. "由于节点变大等因素,根节点
  // 没有再全屏了...需要再自动化重置一下根节点显示区域".

  // increasing the depth can't just re-run collapseBeyondDepth (that only
  // ever COLLAPSES, never re-expands) — setExpandedToDepth actively
  // expands every node within the new depth too, matching what "实时作用"
  // means when the limit is loosened rather than tightened.
  setExpandedToDepth(state.focusId, appParams.maxAutoDepth);
  scheduleSave(); render();
  resyncRootView();
});
railDepthValueEl.addEventListener('click', function(){
  // forces the SAME depth check the -/+ thirds apply, WITHOUT changing
  // appParams.maxAutoDepth itself — "执行和调节深度一样的检查功能但不改变

  // 然后进行修改和复位". setExpandedToDepth both expands within the limit

  // drilled state, so collapseBeyondDepth is still needed afterward to

  // click's expandSubtreeCapped, or nodes drilled open before the limit
  // was last tightened).
  setExpandedToDepth(state.focusId, appParams.maxAutoDepth);

  scheduleSave(); render();
  resyncRootView();
});

/* index -> unit {x,y} offset (pre-scale) for the fixed small-count
   symmetric arrangements the two size-reset buttons distribute direct
   children into — "依据一级子节点数量,将他们以空间均匀的方式分布在母节点
   正中央": 2 -> 水平两点, 3/5 -> 三角形/五角星, 4 -> 2x2正方形 (not a
   rotated diamond ring — "四个兄弟排成直线,不是很合理,应该是2x2正方形"),
   6 -> 五角星带中心节点. n>=7 falls through to the square-grid rule at the
   bottom instead of getting its own entry here. */
function symmetricUnitPositions(n){
  var TWO_PI = Math.PI*2;
  if(n<=1) return [{x:0,y:0}];
  if(n===2) return [{x:-0.5,y:0},{x:0.5,y:0}];
  if(n===3 || n===5){
    // regular n-gon, one vertex pointing straight up — a 5-pointed star's
    // own tips sit at exactly these same 5 evenly-spaced points, so a
    // regular pentagon's vertex ring already IS the "五角星" arrangement.
    var R = 0.5/Math.sin(Math.PI/n);
    var out = [];
    for(var i=0;i<n;i++){
      var ang = (i/n)*TWO_PI - Math.PI/2;
      out.push({x:Math.cos(ang)*R, y:Math.sin(ang)*R});
    }
    return out;
  }
  if(n===4){
    return [{x:-0.5,y:-0.5},{x:0.5,y:-0.5},{x:-0.5,y:0.5},{x:0.5,y:0.5}];
  }
  if(n===6){
    // same 5-point ring as n===5, plus one node pinned dead center.
    var R6 = 0.5/Math.sin(Math.PI/5);
    var out6 = [{x:0,y:0}];
    for(var j=0;j<5;j++){
      var ang6 = (j/5)*TWO_PI - Math.PI/2;
      out6.push({x:Math.cos(ang6)*R6, y:Math.sin(ang6)*R6});
    }
    return out6;
  }
  // 7+: "近似正方形排列...向上寻找平方数然后视图填满它的布局" — smallest
  // side*side grid that fits every node (7/8/9 all land on a 3x3 grid),
  // filled row-major and centered on the mother; any leftover cells in
  // the grid's last row are simply left empty.
  var side = Math.ceil(Math.sqrt(n));
  var outg = [];
  for(var k=0;k<n;k++){
    var row = Math.floor(k/side), col = k%side;
    outg.push({x:col-(side-1)/2, y:row-(side-1)/2});
  }
  return outg;
}

/* redistribute parentId's DIRECT children into the symmetricUnitPositions
   arrangement for however many there are, scaled so adjacent children
   never crowd each other — used by both size-reset buttons below so the
   exact same even-spacing rule applies at every level either button
   touches. Every child's OWN size must already be at its final (reset)
   value before this runs, since the unit grid is scaled off the resulting
   boxes' own radii — this is what makes "间距合理适配大小,没有节点被挤压"
   hold regardless of how big the reset default size turns out to be. */
function symmetrizeChildrenOf(parentId){
  var kids = children(parentId);
  var n = kids.length;
  if(!n) return;
  var boxes = kids.map(function(k){
    var b = k.drilled ? containerSize(k) : computeNodeBox(k);
    return {node:k, r:boxRadius(b.w, b.h)};
  });
  var maxD = Math.max.apply(null, boxes.map(function(b){ return b.r*2; }));
  var units = symmetricUnitPositions(n);
  // scale by the arrangement's OWN closest pairwise unit-distance, not a
  // fixed assumed spacing of 1 — the n===6 star+center layout's own
  // center-to-ring distance is ~0.85, tighter than its ring-to-ring edges,
  // so scaling off a flat "1 unit apart" assumption would let the center
  // node crowd its neighbors closer than every other pair in that same
  // arrangement.
  var minUnitDist = Infinity;
  for(var i=0;i<n;i++){
    for(var j=i+1;j<n;j++){
      var dx=units[i].x-units[j].x, dy=units[i].y-units[j].y;
      var d = Math.sqrt(dx*dx+dy*dy);
      if(d<minUnitDist) minUnitDist = d;
    }
  }
  if(!isFinite(minUnitDist) || minUnitDist<=0) minUnitDist = 1;
  var cellSize = (maxD*1.14)/minUnitDist; // same 14% gap ratio this file's other ring/grid placement math already uses
  boxes.forEach(function(b, i){
    b.node.px = units[i].x*cellSize;
    b.node.py = units[i].y*cellSize;
    b.node.placed = true;
  });
}

/* depth-first, children-before-parent: symmetrize every node's direct
   children throughout id's whole subtree. Must run bottom-up (deepest
   first) rather than top-down — a drilled child's own containerSize
   depends on ITS children's px/py already being final, so symmetrizing a
   parent before its drilled child's own subtree has been repositioned
   would size that child off stale, pre-reset positions. */
function symmetrizeAllRecursive(id){
  var kids = children(id);
  kids.forEach(function(k){ symmetrizeAllRecursive(k.id); });
  if(kids.length) symmetrizeChildrenOf(id);
}

/* reset a set of nodes' own visual scale back to the fresh-node defaults
   (SCALE_NOKIDS_DEFAULT/SCALE_KIDS_DEFAULT, both axes) — px/py are left
   untouched here; repositioning (via symmetrizeChildrenOf/
   symmetrizeAllRecursive) is each caller's own separate step below. */
function resetNodeSizes(ids){
  ids.forEach(function(id){
    var n = node(id);
    if(!n) return;
    n.scaleXNoKids = SCALE_NOKIDS_DEFAULT; n.scaleYNoKids = SCALE_NOKIDS_DEFAULT;
    n.scaleXKids = SCALE_KIDS_DEFAULT; n.scaleYKids = SCALE_KIDS_DEFAULT;
  });
}
document.getElementById('btnResetVisibleSizes').addEventListener('click', function(){
  // "局部重排": only the current focus root's own direct children — reset
  // their size AND redistribute their positions into the symmetric
  // arrangement, without touching anything one level deeper or the focus
  // root's own (currently invisible) ancestors. No confirmation dialog —
  // scope is strictly local, same as before.
  pushUndo();
  var focusId = state.focusId;
  var kidIds = children(focusId).map(function(k){ return k.id; });
  resetNodeSizes([focusId].concat(kidIds));
  symmetrizeChildrenOf(focusId);
  scheduleSave();
  render();
});
document.getElementById('btnResetAllSizes').addEventListener('click', function(){
  // "全树重排": every node in the whole tree, at every depth — reset every
  // node's own size, then redistribute EVERY parent's direct children into
  // the same symmetric arrangement. This is the one global/destructive
  // action among the three reset-position buttons, so — unlike the other
  // two — it warns before running.
  if(!confirm('将重置整棵树所有节点的大小，并把每一层的子节点重新排布为对称图形。此操作影响全树，可用 ⌘Z 撤销。是否继续？')) return;
  pushUndo();
  resetNodeSizes(subtreeIds(state.rootId));
  symmetrizeAllRecursive(state.rootId);
  scheduleSave();
  render();
});
document.getElementById('btnCenterVisibleChildren').addEventListener('click', function(){
  // "中心化": translate the current focus root's DIRECT children as a
  // RIGID GROUP so their shared bounding box becomes centered on the
  // mother — "保证所有一级孩子相对位置和相对大小都不变...让它们整体平移到
  // 他们母亲方框的居中位置". Every child's OWN scale float and its
  // position RELATIVE TO ITS SIBLINGS is untouched (a pure group
  // translation preserves both), and nothing below this level is ever
  // touched — "严格local...不影响二级孩子节点,不影响更高层母节点...即便
  // 二级节点展开了,也不影响,只处理一级节点".
  //
  // The "调节母亲方框...恰好包裹...再稍微留白一点点边缘间隙,四个方向均匀"
  // half of the request needs one extra flag: n.centeredFit, set true HERE
  // on the mother (and ONLY this one node — see containerSize's own
  // comment on why every other node's rendering is completely unaffected).
  // Without it, containerSize's shared-scalar idealR floor can still pad
  // out whichever axis is shorter even after centering — a plain
  // Math.max(idealR, actualHalfW/H) floor doesn't know "wide-but-short"
  // from "narrow-but-tall", so the short axis can end up with MORE than
  // the intended uniform margin. Setting centeredFit makes containerSize
  // use actualHalfW/actualHalfH directly (no idealR floor) for THIS node
  // only, so the margin comes out to exactly RECT_AVAIL_MARGIN on all 4
  // sides once the children are centered.
  var focusId = state.focusId;
  var mother = node(focusId);
  if(!mother) return;
  var kids = children(focusId);
  if(kids.length<2) return;
  var placedKids = kids.filter(function(k){ return k.placed; });
  if(placedKids.length<2) return;
  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  placedKids.forEach(function(k){
    var b = k.drilled ? containerSize(k) : computeNodeBox(k);
    var left = k.px - b.w/2, right = k.px + b.w/2;
    var top = k.py - b.h/2, bottom = k.py + b.h/2;
    if(left<minX) minX = left;
    if(right>maxX) maxX = right;
    if(top<minY) minY = top;
    if(bottom>maxY) maxY = bottom;
  });
  var centerX = (minX+maxX)/2, centerY = (minY+maxY)/2;
  pushUndo();
  mother.centeredFit = true;
  if(centerX!==0 || centerY!==0){
    placedKids.forEach(function(k){ k.px -= centerX; k.py -= centerY; });
  }
  scheduleSave();
  render();
  resyncRootView();
});

document.getElementById('btnFit').addEventListener('click', function(){
  // just switch focus back to the ultimate root — render()'s own
  // focus-change detection (see fitCameraToRoot) then fits the camera to
  // whatever that root's actual content-driven size is, so this button
  // doesn't need to (and shouldn't) hardcode camera.scale=1 itself. If
  // focus was already the root, force the refit explicitly (there's no
  // focus-change edge to detect, but "fit to global view" should still act
  // like a definite reset instead of a no-op).
  var alreadyAtRoot = state.focusId === state.rootId;
  state.focusId = state.rootId;
  scheduleSave();
  render();
  if(alreadyAtRoot){ resyncRootView(); }
});

/* ============================================================
   mobile toolbar: touch-friendly Shift/Ctrl/Option/Cmd/Enter + arrow
   keys + a right-click stand-in, all synthesizing REAL KeyboardEvents
   dispatched at document — "允许在手机上模拟键盘多个案件联合按下这些组合
   快捷键". Reusing the exact same document-level 'keydown' listener every
   other shortcut in this file already goes through means every existing
   handler (canvas, tree-view row, insert dialog, etc.) picks these up
   with ZERO special-casing — a synthetic event with shiftKey/ctrlKey/
   altKey/metaKey/key/code set correctly is indistinguishable from a real
   one to any of those handlers.
   Touch has no "hold this key while tapping another" gesture, so modifier
   taps use a STICKY-KEYS model instead: tapping ⇧/⌃/⌥/⌘ ARMS it (stays
   highlighted) until the NEXT arrow/Enter/right-click tap, which consumes
   and clears the whole armed set right after firing — this is what lets
   "⌘ then ↓" on a touchscreen produce the exact same ⌘+ArrowDown a real
   keyboard chord would. Tapping an already-armed modifier again disarms
   it (toggle), so combining multiple modifiers (⌥⇧ for batch-insert) or
   backing out of one by mistake both just work. */
var mobileArmedMods = {shift:false, ctrl:false, alt:false, meta:false};
function refreshMobileModUI(){
  document.querySelectorAll('#mobileToolbar .mod-key').forEach(function(el){
    el.classList.toggle('armed', !!mobileArmedMods[el.dataset.mod]);
  });
}
document.querySelectorAll('#mobileToolbar .mod-key').forEach(function(el){
  el.addEventListener('click', function(){
    var m = el.dataset.mod;
    mobileArmedMods[m] = !mobileArmedMods[m];
    refreshMobileModUI();
  });
});
/* fires one synthetic keydown built from the currently-armed modifiers
   plus whatever key/code this particular tap represents, then clears the
   armed set — every mobile key tap (Enter, an arrow, or the right-click
   stand-in) funnels through here so the "consume modifiers after one use"
   rule is enforced in exactly one place. Batch-insert (⌥⇧↓, or its ⌥⇧B
   fallback for macOS setups that swallow the arrow combo) is reachable on
   mobile by arming ⌥+⇧ then tapping ↓ — a real ArrowDown key/code, so it
   needs no e.code remapping workaround the way a literal 'B' key would. */
function dispatchMobileKey(key, code){
  var opts = {
    key: key, code: code || key, bubbles: true, cancelable: true,
    shiftKey: mobileArmedMods.shift, ctrlKey: mobileArmedMods.ctrl,
    altKey: mobileArmedMods.alt, metaKey: mobileArmedMods.meta
  };
  var target = document.activeElement && document.activeElement!==document.body
    ? document.activeElement : document;
  target.dispatchEvent(new KeyboardEvent('keydown', opts));
  mobileArmedMods.shift = mobileArmedMods.ctrl = mobileArmedMods.alt = mobileArmedMods.meta = false;
  refreshMobileModUI();
}
document.getElementById('mobileEnterKey').addEventListener('click', function(){
  dispatchMobileKey('Enter');
});
document.getElementById('mobileEscKey').addEventListener('click', function(){
  dispatchMobileKey('Escape');
});
['mobileArrowUp','mobileArrowDown','mobileArrowLeft','mobileArrowRight'].forEach(function(id){
  var el = document.getElementById(id);
  el.addEventListener('click', function(){ dispatchMobileKey(el.dataset.arrow); });
});
/* mobile drag-pickup toggle: "点击拖拽键→点节点拾取→移动→再点拖拽键放下".
   Touch taps can't hold-and-drag the way a mouse does (see nodeMousedown's
   own comment on synthetic touch mousedowns), so "移动" here means
   repeatedly tapping a destination on blank canvas — each such tap
   relocates the carried node there (see canvasWrap's mousedown listener)
   — rather than one continuous pointer-follow drag. */
var mobileDrag = { armed:false, node:null };
var mobileDragKeyEl = document.getElementById('mobileDragKey');
function mobileDragPick(n){
  pushUndo();
  mobileDrag.armed = false;
  mobileDrag.node = n;
  selectedId = n.id;
  mobileDragKeyEl.classList.remove('armed');
  mobileDragKeyEl.classList.add('carrying');
  triggerGlow(); render();
}
function mobileDragMoveTo(clientX, clientY){
  if(!mobileDrag.node) return;
  var rect = canvasWrap.getBoundingClientRect();
  var sx = clientX-rect.left, sy = clientY-rect.top;
  mobileDrag.node.px = (sx-camera.x)/camera.scale;
  mobileDrag.node.py = (sy-camera.y)/camera.scale;
  scheduleSave();
  render();
}
function mobileDragDrop(){
  mobileDrag.node = null;
  mobileDrag.armed = false;
  mobileDragKeyEl.classList.remove('armed','carrying');
}
mobileDragKeyEl.addEventListener('click', function(){
  if(mobileDrag.node){ mobileDragDrop(); return; }
  mobileDrag.armed = !mobileDrag.armed;
  mobileDragKeyEl.classList.toggle('armed', mobileDrag.armed);
});
var btnMobileMode = document.getElementById('btnMobileMode');
var mobileToolbar = document.getElementById('mobileToolbar');
function applyMobileMode(on){
  document.documentElement.classList.toggle('mobile-mode', on);
  btnMobileMode.classList.toggle('active', on);
  // shorten .param-label text under mobile mode (its own data-mobile
  // attribute holds the short form; the original full text is stashed
  // back into data-mobile itself on the way out so toggling mobile mode
  // off restores the exact desktop string byte-for-byte).
  document.querySelectorAll('#paramsFlyout .param-label[data-mobile]').forEach(function(el){
    var alt = el.dataset.mobile;
    el.dataset.mobile = el.textContent;
    el.textContent = alt;
  });
}
btnMobileMode.addEventListener('click', function(){
  appParams.mobileMode = !appParams.mobileMode;
  applyMobileMode(appParams.mobileMode);
  saveParams();
});

var themeBtn = document.getElementById('btnTheme');
var themeIconMoon = document.getElementById('themeIconMoon');
var themeIconSun = document.getElementById('themeIconSun');
var themeIconPalette = document.getElementById('themeIconPalette');
var THEME_CYCLE = ['light','dark','deepblue','graphite','vscode','hicontrast'];
var THEME_LABELS = {
  light:'浅色', dark:'深色', deepblue:'深蓝', graphite:'灰黑', vscode:'VS Code 黑', hicontrast:'高对比度黑'
};
function applyTheme(){
  if(THEME_CYCLE.indexOf(state.theme)===-1) state.theme = 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  themeIconMoon.style.display = state.theme==='dark' ? '' : 'none';
  themeIconSun.style.display = state.theme==='light' ? '' : 'none';
  themeIconPalette.style.display = (state.theme==='light'||state.theme==='dark') ? 'none' : '';
  themeBtn.title = '切换主题（当前：'+THEME_LABELS[state.theme]+'）';
}
themeBtn.addEventListener('click', function(){
  var idx = THEME_CYCLE.indexOf(state.theme);
  state.theme = THEME_CYCLE[(idx+1) % THEME_CYCLE.length];
  applyTheme();
  scheduleSave();
  render();
});

document.getElementById('btnExport').addEventListener('click', function(){
  var out = Object.assign({}, state, {schemaVersion: SCHEMA_VERSION});
  var blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'mindmap-'+state.rootId+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
});
var fileInput = document.getElementById('fileInput');
document.getElementById('btnImport').addEventListener('click', function(){ fileInput.click(); });
/* strict import-time validator: unlike loadState's sanitizeStateNodes
   (which migrates THIS session's own older-format state forward as the
   app evolves), importing a FOREIGN file must reject anything that isn't
   already in the CURRENT exact shape rather than silently coercing missing/
   stale fields through a `||` default — that silent coercion is exactly
   what let a pre-4-float-scale (or otherwise malformed) file load with no
   error and render as "形状变成很离谱的长方形,特别大,内容空洞": a node
   missing scaleXKids/etc rendered at whatever accidental fallback the
   drawing code happened to produce instead of a real, intentional size.
   Returns an error message string, or null if `s` is fully valid. */
function validateImportSchema(s){
  if(!s || typeof s!=='object') return 'not a JSON object';
  if(s.schemaVersion!==SCHEMA_VERSION) return '文件版本不匹配（需要 schemaVersion='+SCHEMA_VERSION+'，实际为 '+JSON.stringify(s.schemaVersion)+'），可能是旧版本导出或手动编辑过的文件';
  if(!s.nodes || typeof s.nodes!=='object') return 'missing nodes';
  if(typeof s.rootId!=='string' || !s.nodes[s.rootId]) return 'missing/invalid rootId';
  if(typeof s.focusId!=='string' || !s.nodes[s.focusId]) return 'missing/invalid focusId';
  var ids = Object.keys(s.nodes);
  if(!ids.length) return 'nodes is empty';
  for(var i=0;i<ids.length;i++){
    var id = ids[i];
    var n = s.nodes[id];
    if(!n || typeof n!=='object') return 'node '+id+' is not an object';
    if(n.id!==id) return 'node '+id+' has mismatched/missing id field';
    if(!Array.isArray(n.children)) return 'node '+id+' missing children array';
    for(var j=0;j<n.children.length;j++){
      if(!s.nodes[n.children[j]]) return 'node '+id+' references missing child '+n.children[j];
    }
    if(n.parentId!=null && !s.nodes[n.parentId]) return 'node '+id+' references missing parentId '+n.parentId;
    if(typeof n.summary!=='string' || typeof n.detail!=='string') return 'node '+id+' missing summary/detail strings';
    if(typeof n.drilled!=='boolean') return 'node '+id+' missing drilled boolean';
    var scaleFields = ['scaleXNoKids','scaleYNoKids','scaleXKids','scaleYKids'];
    for(var k=0;k<scaleFields.length;k++){
      if(typeof n[scaleFields[k]]!=='number' || !isFinite(n[scaleFields[k]])) return 'node '+id+' missing/invalid '+scaleFields[k];
    }
    if(typeof n.px!=='number' || typeof n.py!=='number' || typeof n.placed!=='boolean') return 'node '+id+' missing px/py/placed';
    if(n.category!=='A' && n.category!=='B' && n.category!=='C') return 'node '+id+' has invalid category';
    if(BORDER_STYLES.indexOf(n.border)===-1) return 'node '+id+' has invalid border style';
    if(typeof n.borderLines!=='number') return 'node '+id+' missing borderLines';
    if(typeof n.masterLevel!=='number') return 'node '+id+' missing masterLevel';
    if(typeof n.vis!=='number') return 'node '+id+' missing vis';
  }
  if(!Array.isArray(s.randomButtons)) return 'missing randomButtons array';
  if(typeof s.randomFormula!=='string') return 'missing randomFormula';
  return null;
}
fileInput.addEventListener('change', function(){
  var f = fileInput.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var s;
    try{
      s = JSON.parse(reader.result);
    }catch(err){
      alert('导入失败：JSON 格式不正确');
      fileInput.value='';
      return;
    }
    var validationError = validateImportSchema(s);
    if(validationError){
      alert('导入失败：文件格式与当前版本不兼容（'+validationError+'）。请使用当前版本重新导出的文件。');
      fileInput.value='';
      return;
    }
    sanitizeStateNodes(s);
    sanitizeRandomButtons(s);
    pushUndo();
    state = s;
    if(!state.theme) state.theme='light';
    selectedId = state.focusId;
    applyTheme();
    scheduleSave();
    render();
    fileInput.value='';
  };
  reader.readAsText(f);
});

document.addEventListener('mousedown', function(e){
  // the insert/edit dialog (#insertOverlay) is a DOM sibling of the rail
  // flyouts, not nested inside them — so without this exclusion, clicking
  // anywhere inside the edit box (opened via ⌥click on a tree row) looked
  // like "a click outside the tree panel" to this listener and closed the
  // whole tree view out from under the still-open edit dialog.
  if(e.target.closest('#insertOverlay')) return;
  if(e.target.closest('#rbMaterializeOverlay')) return;
  if(anyRailPanelOpen() && !e.target.closest('#searchFlyout') && !e.target.closest('#treeFlyout')
     && !e.target.closest('#paramsFlyout') && !e.target.closest('#randomFlyout') && !e.target.closest('#rail')){
    closeAllRailPanels();
  }
});

/* ============================================================
   rail width: draggable, persisted, icons scale proportionally
   via CSS calc() off the --rail-w variable set here.
   ============================================================ */
var railResizer = document.getElementById('railResizer');
function applyRailWidth(w){
  document.documentElement.style.setProperty('--rail-w', w+'px');
}
function loadRailWidth(){
  var w = RAIL_W_DEFAULT;
  try{
    var raw = localStorage.getItem(RAIL_W_STORAGE_KEY);
    if(raw){ var v = parseFloat(raw); if(!isNaN(v)) w = clamp(v, RAIL_W_MIN, RAIL_W_MAX); }
  }catch(e){}
  applyRailWidth(w);
}
function saveRailWidth(w){
  try{ localStorage.setItem(RAIL_W_STORAGE_KEY, String(w)); }catch(e){}
}
(function initRailResizer(){
  var startX=0, startW=RAIL_W_DEFAULT, dragging=false;
  railResizer.addEventListener('mousedown', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    dragging = true;
    startX = ev.clientX;
    startW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail-w')) || RAIL_W_DEFAULT;
    railResizer.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
  });
  window.addEventListener('mousemove', function(ev){
    if(!dragging) return;
    var w = clamp(startW + (ev.clientX-startX), RAIL_W_MIN, RAIL_W_MAX);
    applyRailWidth(w);
    clampCamera(); applyCamera();
  });
  window.addEventListener('mouseup', function(){
    if(!dragging) return;
    dragging = false;
    railResizer.classList.remove('dragging');
    document.body.style.cursor = '';
    var w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail-w')) || RAIL_W_DEFAULT;
    saveRailWidth(w);
  });
})();

/* ============================================================
   init
   ============================================================ */
loadRailWidth();
loadParams();
refreshRailDepthUI();
applyMobileMode(appParams.mobileMode);
applyTheme();
// pinned random-pick rail shortcuts otherwise only ever get (re)rendered
// from renderRandomPanel() (when the panel opens) or the drag-to-pin drop
// handler — neither runs on a fresh page load, so a previously-pinned
// button stayed invisible in #railPinnedZone until the user opened the
// random panel once, even though state.randomButtons already had
// pinnedToRail:true persisted — "随机选一拖拽到导航栏上的按钮,只要一刷新
// 页面就会消失,直到单击随机选一才会又出现".
renderRailPinnedZone();
render();
// on every fresh load/refresh, act as if the user pressed the global
// 随机选一 button and then immediately pressed Esc — a random B node
// becomes the focus root (filling the screen), nothing selected, no rail
// panel open and no nav button focused — "不是要打开随机选一那个panel,
// 而是什么panel都不打开,但是就好像按了一遍全局的随机选一按钮紧接着按了
// Esc一样". activateRandomButton() already leaves selectedId null and
// closeAllRailPanels()/clearSizeGauge() cover the rest of what a real Esc
// press would otherwise need to clear (nothing here, since no panel/gauge
// is active yet at page-load time, but calling them keeps this in lockstep
// with the real Esc handler instead of duplicating its assumptions).
var globalRandomBtn = (state.randomButtons||[]).filter(function(b){ return b.isGlobal; })[0];
if(globalRandomBtn) activateRandomButton(globalRandomBtn);
closeAllRailPanels();

})();
</script>
