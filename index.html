  // PARENT sees and lays siblings out against — to at most
  // GROWTH_CAP_RATIO times its own plain leaf size (own.w/own.h, i.e. what
  // it would render as if it had no children at all), regardless of how
  // large/deep its actually-drilled subtree has grown. "同级别的node,相对
  // 大小需要被优先保护...不论有没有对其中一个child进行进一步展开". Skipped
  // for the fullscreen focus root (isFullscreenRoot) — that node has no
  // visible siblings to protect parity against, and Shift+Enter's whole
  // point is to fill the screen, not stay leaf-sized.
  // Rather than shrinking the interior's OWN layout math (which would have
  // to recurse into every measurement site that calls containerSize(k) for
  // a drilled child), this returns a `scale` factor alongside the capped
  // outer w/h: buildContainerTree renders this container's real content at
  // its natural (uncapped) size, then wraps it in a single CSS
  // transform:scale(scale) — true vector scaling, so text/borders/child
  // positions all shrink together with no separate math needed. Every
  // consumer of containerSize(k) (this function's own recursive `boxes`
  // measurement, computeCrowdScale, layoutChildrenPositions) only ever
  // reads w/h, so a parent sizing its ring around a capped child sees
  // exactly the capped footprint — the cascade is automatic with no
  // special-casing needed at any call site.
  // ownDiamUncrowded (NOT own.w/h, which already has crowdScaleFor(n)
  // baked in) is what the cap must compare against — n's TRUE/intrinsic
  // leaf size, unaffected by whatever transient shrink n itself happens to
  // be under from being crowded against its OWN siblings right now. Using
  // the crowded own.w/h here was exactly what let dragging one sibling
  // (c) cascade an EXTRA shrink into a totally unrelated sibling's (b's)
  // own children (d/e) — the drag only ever legitimately shrinks b/c
  // themselves (direct siblings under a), but feeding that same shrink
  // into b's growth-cap reference squeezed d/e's rendering too, even
  // though they're two levels away and nowhere near where c was dragged —
  // "拖动c...会导致所有节点的字体严重变小...请确保碰撞机制永远只在直系
  // 兄弟之间有效,不能跨越母节点影响母节点的兄弟节点,以及关系更远的节点".
  var ownUncrowded = computeNodeBox(n, true);
  var ownDiamUncrowded = Math.max(ownUncrowded.w, ownUncrowded.h);
  var capDiam = ownDiamUncrowded * GROWTH_CAP_RATIO;
  var naturalDiam = Math.max(naturalW, naturalH);
  var scale = 1;
  if(!isFullscreenRoot && naturalDiam > capDiam){
    scale = Math.max(GROWTH_CAP_MIN_SCALE, capDiam / naturalDiam);
  }
  // exact uniform scale on both axes (no per-axis floor) — keeps the
  // capped box's aspect ratio identical to the natural box's, which is
  // what makes a single CSS transform:scale(scale) (applied by
  // buildContainerTree to the natural-size interior) map onto this w/h
  // exactly, with no stretch/distortion on either axis.
  return {w:naturalW*scale, h:naturalH*scale, shape:shape, fontPx:own.fontPx, mode:own.mode,
    sLines:own.sLines, dLines:own.dLines, sColW:own.sColW, dColW:own.dColW,
    naturalW:naturalW, naturalH:naturalH, scale:scale};
}

var glowTimer = null;

/* category-edit mode: while active, every node's hidden content is

var glowingUntilClear = true;

/* ============================================================
   rendering
   ============================================================ */
var stage = document.getElementById('stage');
var canvasWrap = document.getElementById('canvasWrap');
var railEl = document.getElementById('rail');
var camera = { x:0, y:0, scale:1 };

function applyCamera(){
  stage.style.transform = 'translate('+camera.x+'px,'+camera.y+'px) scale('+camera.scale+')';
}
function shadeColor(hex, pct){
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  var f = pct/100;
  r = Math.max(0,Math.min(255, Math.round(r + (f<0? r*f : (255-r)*f))));
  g = Math.max(0,Math.min(255, Math.round(g + (f<0? g*f : (255-g)*f))));
  b = Math.max(0,Math.min(255, Math.round(b + (f<0? b*f : (255-b)*f))));
  return '#'+[r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
}

/* ============================================================

   the actual filled shape, and lets "how many concentric lines"
   be a single shared mechanism across all four styles.

   shapeBoundary(w,h,shape,cornerR) returns {perimeter, pointAt(t)}
   where pointAt(t), t in [0,1), returns {x,y,nx,ny} — nx/ny is the
   outward unit normal, used both to inset successive lines toward
   the interior and to displace wave crests perpendicular to the
   boundary (so a wave never distorts into an ellipse/rect of a
   different aspect ratio than the fill it's tracing).
   ============================================================ */
function shapeBoundary(w, h, shape, cornerR){
  if(shape==='circle' || shape==='ellipse'){
    var rx = w/2, ry = h/2;
    // Ramanujan's ellipse-circumference approximation — exact when rx=ry
    // (the circle case), a close estimate otherwise. Angle is used directly
    // as the arc-length parameter (t*2π): not exact arc-length for a very
    // eccentric ellipse, but the curve is still perfectly closed (t=0 and
    // t=1 coincide) so there is never a visible seam, only a slightly
    // uneven wave spacing on extreme ellipses.
    var hRam = Math.pow((rx-ry)/(rx+ry||1), 2);
    var perimeter = Math.PI*(rx+ry)*(1 + 3*hRam/(10+Math.sqrt(4-3*hRam || 0)));
    return {
      perimeter: perimeter,
      pointAt: function(t){
        var ang = t*Math.PI*2;
        var cosA=Math.cos(ang), sinA=Math.sin(ang);
        var x = rx+rx*cosA, y = ry+ry*sinA;
        // true outward normal of a parametric ellipse (rx cosθ, ry sinθ):
        // proportional to (ry cosθ, rx sinθ), NOT (cosθ, sinθ) — that
        // shortcut is only correct when rx=ry (a circle) and was the root
        // cause of the wave border tracing a visibly different aspect
        // ratio than the ellipse/rect fill it was supposed to outline.
        var nlen = Math.sqrt(ry*ry*cosA*cosA + rx*rx*sinA*sinA) || 1;
        return {x:x, y:y, nx:(ry*cosA)/nlen, ny:(rx*sinA)/nlen};
      }
    };
  }
  // rounded rect: exact arc-length parametrization around the 4 straight
  // edges + 4 quarter-circle corners, so a wave stays exactly cornerR px
  // from the true rounded-rect edge everywhere, corners included.
  var r = Math.max(0, Math.min(cornerR, w/2, h/2));
  var sTop = Math.max(0, w-2*r), sSide = Math.max(0, h-2*r);
  var arc = Math.PI/2*r;
  var segs = [
    {len:sTop,  fn:function(u){ return {x:r+u,   y:0,   nx:0,  ny:-1}; }},
    {len:arc,   fn:function(u){ var a=-Math.PI/2+u/(r||1); return {x:w-r+Math.cos(a)*r, y:r+Math.sin(a)*r, nx:Math.cos(a), ny:Math.sin(a)}; }},
    {len:sSide, fn:function(u){ return {x:w,     y:r+u, nx:1,  ny:0}; }},
    {len:arc,   fn:function(u){ var a=0+u/(r||1); return {x:w-r+Math.cos(a)*r, y:h-r+Math.sin(a)*r, nx:Math.cos(a), ny:Math.sin(a)}; }},
    {len:sTop,  fn:function(u){ return {x:w-r-u, y:h,   nx:0,  ny:1}; }},
    {len:arc,   fn:function(u){ var a=Math.PI/2+u/(r||1); return {x:r+Math.cos(a)*r, y:h-r+Math.sin(a)*r, nx:Math.cos(a), ny:Math.sin(a)}; }},
    {len:sSide, fn:function(u){ return {x:0,     y:h-r-u, nx:-1, ny:0}; }},
    {len:arc,   fn:function(u){ var a=Math.PI+u/(r||1); return {x:r+Math.cos(a)*r, y:r+Math.sin(a)*r, nx:Math.cos(a), ny:Math.sin(a)}; }}
  ];
  var perimeter = segs.reduce(function(sum,s){ return sum+s.len; }, 0);
  return {
    perimeter: perimeter,
    pointAt: function(t){
      var s = t*perimeter;
      for(var i=0;i<segs.length;i++){
        if(s<=segs[i].len || i===segs.length-1) return segs[i].fn(Math.max(0,Math.min(s,segs[i].len)));
        s -= segs[i].len;
      }
    }
  };
}
/* one closed path string, inset `inset` px toward the interior along the
   boundary's own normal, with an optional wave displacement layered on
   top. wavelen is snapped to fit a whole number of cycles into the
   perimeter so the wave always closes on itself with no visible seam. */
function tracePath(geo, inset, waveAmp, waveLen){
  var steps = 200;
  var cycles = waveLen ? Math.max(1, Math.round(geo.perimeter/waveLen)) : 0;
  var pts = [];
  for(var i=0;i<=steps;i++){
    var t = i/steps;
    var p = geo.pointAt(t%1);
    var disp = -inset;
    if(waveAmp) disp += waveAmp*Math.sin(t*cycles*Math.PI*2);
    pts.push([p.x+p.nx*disp, p.y+p.ny*disp]);
  }
  var d = 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var j=1;j<pts.length;j++) d += ' L '+pts[j][0].toFixed(1)+' '+pts[j][1].toFixed(1);
  return d+' Z';
}
var BORDER_LINE_GAP = 4.2; // px between concentric lines when borderLines>1
function borderStrokeWidth(style){ return style==='wave-thick' ? 2.4 : 1.7; }
function borderWaveParams(style){
  if(style==='wave-thick') return {amp:6.5, len:32};
  if(style==='wave-thin') return {amp:2.2, len:14};
  return {amp:0, len:0};
}
function buildBorderSvg(w, h, shape, cornerR, n, borderColor){
  var svgNS='http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('class','mm-border-svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  var geo = shapeBoundary(w, h, shape, cornerR);
  var wave = borderWaveParams(n.border);
  var strokeW = borderStrokeWidth(n.border);
  var lines = clamp(n.borderLines||1, BORDER_LINES_MIN, BORDER_LINES_MAX);
  for(var i=0;i<lines;i++){
    var inset = strokeW/2 + i*BORDER_LINE_GAP;
    var path = document.createElementNS(svgNS,'path');
    path.setAttribute('d', tracePath(geo, inset, wave.amp, wave.len));
    path.setAttribute('stroke', borderColor);
    path.setAttribute('stroke-width', strokeW);
    if(n.border==='dashed') path.setAttribute('stroke-dasharray', (strokeW*2.6)+','+(strokeW*2.1));
    svg.appendChild(path);
  }
  return svg;
}

function applyFrameStyle(nodeEl, frameEl, n, w, h, shape){
  var preset = COLOR_PRESETS[n.color % COLOR_PRESETS.length];
  var dark = isDarkTheme();
  var fill = dark ? preset.fillD : preset.fillL;
  var border = dark ? preset.borderD : preset.borderL;
  if(effectiveVis(n)===0) fill = shadeColor(fill, -14);
  nodeEl.style.setProperty('--node-fill', fill);
  nodeEl.style.setProperty('--node-border', border);
  var el = frameEl;
  var radius = shape==='circle' ? '50%' : (shape==='ellipse' ? '50%' : Math.min(26, Math.min(w,h)*0.16)+'px');
  var cornerR = shape==='circle' ? Math.min(w,h)/2 : (shape==='ellipse' ? Math.min(w,h)/2 : Math.min(26, Math.min(w,h)*0.16));
  el.style.borderRadius = radius;
  el.style.border = 'none';

  var existingSvg = el.querySelector('.mm-border-svg');
  if(existingSvg) existingSvg.remove();
  if(w>0 && h>0) el.appendChild(buildBorderSvg(w, h, shape, cornerR, n, border));
}

function render(){
  stage.innerHTML='';
  autoFitScale = 1;
  crowdScaleMap = {};
  var focus = node(state.focusId) || node(state.rootId);

  for(var attempt=0; attempt<9; attempt++){
    stage.innerHTML='';
    containmentOverflow = false;
    freshlyPlacedThisPass = [];
    var rootEl = buildContainerTree(focus, true);
    if(!containmentOverflow) break;
    // the ring layout that just ran placed brand-new nodes using THIS
    // pass's (too-large) autoFitScale — their world-space px/py won't
    // magically get smaller just because the next pass shrinks fonts, so
    // retrying with the same fixed positions can never converge. Un-mark
    // them so the next (smaller) pass re-runs the actual ring placement
    // instead of treating them as already-settled.
    // Skipped on the LAST attempt: un-placing a node here with no further
    // pass left to re-place it is exactly what let a node get saved to
    // state permanently `placed:false` — every later render() (any click,
    // drag, or selection change) then re-ran ring-placement from scratch
    // using whatever a SIBLING's position happened to be at that moment,
    // silently drifting the node further outward on each save with no
    // bound. Confirmed against a real exported file where two children of
    // one node had drifted to a suspiciously exact 2-node ring radius that
    // grew every time its sibling was dragged ("这次能彻底修复吗"). Leaving
    // them placed:true (even if still slightly overflowing) means the
    // WORST case is a visible overlap for one frame, which the very next
    // render() attempt (autoFitScale already shrunk) or a subsequent drag
    // will resolve — never an unbounded runaway.
    //
    // NOTE: this loop must NEVER un-place an already-SETTLED node (only
    // freshBoxes above, i.e. brand-new/never-placed nodes) — an earlier
    // version also force-unplaced whatever was still overflowing on the
    // second-to-last attempt, which silently discarded a settled node's
    // real position (and its rough direction from its parent) just
    // because expanding some OTHER node made this one's container no
    // longer fit, with no drag or reset button involved. That violated
    // the hard rule that ONLY the two params-panel reset buttons may ever
    // move a node's px/py or change which side of its parent it sits on —
    // "只有导航栏布局参数里面的两个reset按钮可以改变节点的xy位置...其他任何
    // 操作都不能动位置". autoFitScale alone (shrinking every node's SIZE by
    // the same global factor, position untouched) is left to keep trying
    // across all 9 attempts instead; if it still doesn't converge, the
    // worst case is a visible one-frame overflow, same as the freshBoxes
    // case above, never a silent position change.
    if(attempt<8) freshlyPlacedThisPass.forEach(function(n){ n.placed = false; });
    autoFitScale *= 0.88;
  }
  rootEl.style.left = (-rootEl._boxW/2)+'px';
  rootEl.style.top = (-rootEl._boxH/2)+'px';
  stage.appendChild(rootEl);
  // the focus/root node's OWN logical size (rootEl._boxW/_boxH) is now
  // computed purely from its content and children (see containerSize),
  // never from the viewport. "Filling the screen" is achieved ENTIRELY by
  // camera.scale, a pure post-hoc visual transform applied by applyCamera()
  // to the whole #stage; it never touches any node's w/h/px/py, so it can
  // never be the cause of a sibling-layout, containment, or overlap change.
  // This is the "similarity transform" invariant: scaling world-space x/y
  // and w/h by the SAME factor preserves every overlap relationship
  // exactly, so a pure visual zoom can never create or remove a collision.
  //
  // The camera is only auto-refit when the FOCUS NODE ITSELF changes
  // (Shift+Enter, breadcrumb clicks, etc.) — deliberately NOT whenever the
  // current focus node's content-driven size merely changes (a child added,
  // a size level bumped, a drag temporarily growing the ring). Refitting on
  // every size change would silently rescale/recenter the view out from
  // under a user who is mid-drag or just adjusting a node, which is exactly
  // the instability this rewrite set out to eliminate; the user's manual
  // pan/zoom is always left alone until they deliberately switch focus.
  var focusChanged = lastFocusId !== state.focusId;
  lastRootBox = {w:rootEl._boxW, h:rootEl._boxH};
  if(focusChanged) fitCameraToRoot();
  lastFocusId = state.focusId;
  clampCamera();
  applyCamera();
  renderNav();
}

var lastRootBox = null;
var lastFocusId = null;
/* the region of #canvasWrap actually usable for drawing right now — an
   open rail flyout is an absolutely-positioned overlay OUTSIDE the flex
   layout (a sibling of #canvasWrap, not a child), so #canvasWrap's own
   getBoundingClientRect() never shrinks when a panel opens: every camera
   computation that used canvasWrap's raw rect kept centering/fitting
   against the FULL width, including the strip a flyout was visually
   covering — "导航栏展开的时候...还是会被导航栏挡住". This returns the
   rect with that covered strip subtracted (left edge moved to the open
   flyout's right edge, same top/height), or canvasWrap's own rect
   unchanged when no panel is open. */
function visibleCanvasRect(){
  var rect = canvasWrap.getBoundingClientRect();
  var openPanel = railPanels.filter(function(p){ return p.flyout.classList.contains('open'); })[0];
  if(!openPanel) return rect;
  var pr = openPanel.flyout.getBoundingClientRect();
  var coveredRight = Math.max(rect.left, Math.min(rect.right, pr.right));
  return {
    left: coveredRight, top: rect.top, right: rect.right, bottom: rect.bottom,
    width: Math.max(0, rect.right - coveredRight), height: rect.height
  };
}
/* breathing-room margin around the fitted root box — both the panel-open
   and panel-closed cases keep the SAME margin the main view already used
   (FOCUS_FIT_MARGIN) on left/right of the VISIBLE strip, but panel-open
   gets extra top/bottom margin instead of matching left/right 1:1, since
   the visible strip is narrower but just as tall, so its usable area is
   now proportionally MORE dominated by height — "两种情况都需要留白边,
   宽度至少和现在主视图一样...导航栏打开时...漏出来的部分左右各自留同等
   大小白边,上下部分留白更多（因为可以绘图的区域高度占比更高了）". Scales
   the extra top/bottom margin by how much taller-than-wide the visible
   strip has become relative to canvasWrap's own full aspect ratio, so a
   barely-narrower strip (a thin flyout) gets barely more vertical margin,
   while a much-narrower one gets proportionally more. */
function focusFitMargins(){
  var full = canvasWrap.getBoundingClientRect();
  var vis = visibleCanvasRect();
  if(vis.width>=full.width-0.5) return {x:FOCUS_FIT_MARGIN, y:FOCUS_FIT_MARGIN};
  var fullAspect = full.width / full.height;
  var visAspect = vis.width / vis.height;
  var extraRatio = fullAspect>0 ? Math.max(1, fullAspect/visAspect) : 1;
  return {x:FOCUS_FIT_MARGIN, y:FOCUS_FIT_MARGIN*extraRatio};
}
/* recompute camera.scale/x/y so the current root box exactly fills the
   viewport (minus a comfortable margin) — this is the ONLY place "focus
   fills the screen" is implemented, and it only ever adjusts the camera,
   never any node's logical geometry. Only called when the focus node
   itself changes (see render()), so re-centering unconditionally is safe:
   this never fires mid-drag or from an incidental content-size change. */
function fitCameraToRoot(){
  var full = canvasWrap.getBoundingClientRect();
  var vis = visibleCanvasRect();
  var margin = focusFitMargins();
  var fitScale = Math.min(
    (vis.width - margin.x*2) / lastRootBox.w,
    (vis.height - margin.y*2) / lastRootBox.h
  );
  camera.scale = clamp(fitScale, MIN_SCALE, MAX_SCALE);
  // camera.x/y are offsets in #canvasWrap's OWN local coordinate space
  // (that's what applyCamera's translate() ultimately positions #stage
  // against, since #stage is a plain absolutely-positioned child of
  // #canvasWrap) — #canvasWrap's rect itself never actually changes size
  // when a flyout opens (flyouts are absolute-positioned overlays OUTSIDE
  // the flex flow, so #canvasWrap keeps its full flex:1 width regardless),
  // only the VISIBLE (uncovered) strip does. So the root must be centered
  // on the visible strip's own midpoint, expressed as an offset from
  // #canvasWrap's left/top edge, not simply vis.width/2 (which would
  // recenter on the covered strip's own left edge instead of the real
  // visible area whenever a panel is open).
  camera.x = (vis.left - full.left) + vis.width/2;
  camera.y = (vis.top - full.top) + vis.height/2;
}

function clampCamera(){
  var full = canvasWrap.getBoundingClientRect();
  var vis = visibleCanvasRect();
  camera.scale = clamp(camera.scale, minScaleForFit(), MAX_SCALE);
  var halfW = lastRootBox.w/2*camera.scale, halfH = lastRootBox.h/2*camera.scale;
  var visLeft = vis.left - full.left, visRight = visLeft + vis.width;
  var visTop = vis.top - full.top, visBottom = visTop + vis.height;
  if(halfW*2 <= vis.width){
    camera.x = visLeft + vis.width/2;
  } else {
    camera.x = clamp(camera.x, visRight - halfW, visLeft + halfW);
  }
  if(halfH*2 <= vis.height){
    camera.y = visTop + vis.height/2;
  } else {
    camera.y = clamp(camera.y, visBottom - halfH, visTop + halfH);
  }
}
/* the single shared "make the current focus root fill the screen again"
   action — every place that changes how much CONTENT the root has to fit
   (expanding/collapsing a descendant, changing the max-visible-depth
   param, an Esc press with nothing left to deselect) calls this same
   function, since render() itself only auto-refits when state.focusId
   ITSELF changes value, never when the root's content-driven size merely
   changes underneath the same focusId. */
function resyncRootView(){
  fitCameraToRoot();
  clampCamera();
  applyCamera();
}

/* build DOM for `n` as the top-level (isRoot) container, recursively placing children
   that are drilled as sub-containers. Returns the root element with ._boxW/._boxH set. */
function buildContainerTree(n, isRoot){
  var kids = children(n.id);
  var showChildren = (isRoot || n.drilled) && kids.length>0;
  // the focus/root node always shows its direct children (isRoot implies
  // showChildren whenever it has any), so it must size itself by the exact
  // same content-driven "fit my children's ring" rule as any other drilled
  // container — passing isRoot as containerSize's forceShow makes that
  // happen even on the rare frame where n.drilled is still false for the
  // node that just became focus. There is no more viewport-driven sizing
  // branch: how big the focus node LOOKS on screen is purely a camera.scale
  // concern (see fitCameraToRoot), never a box.w/box.h concern.
  var box = (isRoot || n.drilled) ? containerSize(n, isRoot, isRoot) : computeNodeBox(n);
  // growth-capped containers (box.scale<1, see containerSize) build their
  // ENTIRE interior — frame, chip, children ring, everything below — at
  // its natural (uncapped) size in `inner`, then that whole inner element
  // gets a single CSS transform:scale(box.scale) so it visually shrinks
  // into the capped outer footprint `el` reports to ITS OWN parent. This
  // is a true vector rescale (text, borders, child positions all shrink
  // together) — the "矢量图...更微缩尺度" behavior — and it needs no
  // special-casing anywhere else: every other function in this file only
  // ever reads box.w/box.h (the capped, parent-facing size), never
  // box.naturalW/H, so nothing but this one wrapper needs to know scaling
  // happened at all.
  var natW = box.naturalW==null ? box.w : box.naturalW;
  var natH = box.naturalH==null ? box.h : box.naturalH;
  var scale = box.scale==null ? 1 : box.scale;

  var el = document.createElement('div');
  el.className = 'mm-node'+(showChildren ? ' is-container':'')+(isRoot ? ' is-root':'');
  el.dataset.id = n.id;
  el.style.width = box.w+'px';
  el.style.height = box.h+'px';
  if(selectedId===n.id) el.classList.add('mm-selected');
  if(selectedId===n.id && glowingUntilClear) el.classList.add('mm-glow');

  var inner = el;
  if(scale < 1){
    inner = document.createElement('div');
    inner.className = 'mm-miniature-inner';
    inner.style.width = natW+'px';
    inner.style.height = natH+'px';
    inner.style.transform = 'scale('+scale+')';
    el.appendChild(inner);
  }

  var frame = document.createElement('div');
  frame.className = 'mm-frame';
  applyFrameStyle(inner===el ? el : inner, frame, n, natW, natH, box.shape);
  inner.appendChild(frame);

  if(showChildren){
    var chip = document.createElement('div');
    chip.className='mm-chip';
    // match the chip's type size to its children's — previously it used a
    // single small fixed CSS font-size (11.5px) regardless of how big the
    // actual node content was rendering at, which made the label look
    // tiny and disproportionate next to large child nodes. Average the
    // children's own font sizes (they can each have a different
    // sizeLevel) and back off slightly (0.88x) so the chip still reads as
    // a label rather than a same-size sibling of the content it names.
    if(kids.length){
      var kidFontSum = 0;
      kids.forEach(function(k){ kidFontSum += fontSizeFor(k); });
      chip.style.fontSize = Math.max(11, (kidFontSum/kids.length)*0.88)+'px';
    }
    if(effectiveVis(n)>0){
      var chipS = document.createElement('span');
      chipS.className='mm-chip-summary';
      chipS.textContent = richToPlain(n.summary) || '(未命名)';
      chip.appendChild(chipS);
      if(effectiveVis(n)>=2 && hasDetail(n)){
        var chipDiv = document.createElement('span'); chipDiv.className='mm-chip-divider';
        var chipD = document.createElement('span'); chipD.className='mm-chip-detail';
        chipD.textContent = richToPlain(n.detail);
        chip.appendChild(chipDiv); chip.appendChild(chipD);
      }
    } else {
      chip.classList.add('mm-chip-hidden');
    }
    chip.addEventListener('mousedown', function(ev){ nodeMousedown(ev, null, n); });
    chip.addEventListener('contextmenu', function(ev){ ev.preventDefault(); ev.stopPropagation(); openStylePopover(ev.clientX, ev.clientY, n); });
    inner.appendChild(chip);

    var natBox = {w:natW, h:natH, shape:box.shape};
    var childAvail = availForContainer(natBox);
    if(childAvail.shape==='rect'){
      childAvail.halfW = Math.max(childAvail.halfW, 80);
      childAvail.halfH = Math.max(childAvail.halfH, 80);
    } else {
      childAvail.r = Math.max(childAvail.r, 80);
    }
    layoutChildrenPositions(n.id, childAvail);

    var layer = document.createElement('div');
    layer.className='mm-children-layer';
    kids.forEach(function(k){
      var childEl = buildContainerTree(k, false);
      var cx = natW/2 + k.px - childEl._boxW/2;
      var cy = natH/2 + k.py - childEl._boxH/2;
      childEl.style.left = cx+'px';
      childEl.style.top = cy+'px';
      layer.appendChild(childEl);
    });
    inner.appendChild(layer);
  } else {
    frame.appendChild(buildNodeContent(n, box));
    if(kids.length) inner.appendChild(buildExpandStar(n));
  }

  attachNodeEvents(el, n);
  if(catEditMode){
    inner.appendChild(buildCategoryBadge(n));
    if(n.category==='B') inner.appendChild(buildMasterBadge(n));
  }
  if(sizeGaugeVisible) inner.appendChild(buildSizeGauge(n));
  if(draggingNodeId && n.parentId && children(n.parentId).some(function(k){ return k.id===draggingNodeId; })){
    var hitbox = document.createElement('div');
    hitbox.className = 'mm-hitbox-debug';
    inner.appendChild(hitbox);
  }
  el._boxW = box.w; el._boxH = box.h;
  return el;
}

/* size-gauge ("thermometer"): a thin filled bar just outside the node's own
   right edge showing where its scale currently sits on a log scale between
   SCALE_GAUGE_MIN and SCALE_GAUGE_MAX — rendered on EVERY visible node
   (container or leaf) whenever sizeGaugeVisible is true, not just the one
   node actually being resized, so the user can see at a glance how the
   node they're adjusting compares to its siblings. */
function buildSizeGauge(n){
  var gauge = document.createElement('div');
  gauge.className = 'mm-size-gauge';
  // log-scale fill: SCALE_GAUGE_MIN (0.1) at the bottom, SCALE_GAUGE_MAX
  // (10.0) at the top — a log scale is what makes "1.0" (the no-kids
  // default) sit visually in the MIDDLE of the gauge instead of near the
  // bottom, since 0.1..10 spans two orders of magnitude on either side of
  // 1. Uses the isotropic (geometric-mean) scale since a single fill bar
  // can only show one number — X/Y individually are visible via the
  // node's own aspect ratio on screen.
  var scale = scalarScaleFor(n);
  var logMin = Math.log(SCALE_GAUGE_MIN), logMax = Math.log(SCALE_GAUGE_MAX);
  var frac = (Math.log(Math.max(scale, 1e-6)) - logMin) / (logMax - logMin);
  var fill = document.createElement('div');
  fill.className = 'mm-size-gauge-fill';
  fill.style.height = (clamp(frac,0,1)*100)+'%';
  gauge.appendChild(fill);
  gauge.title = '大小 '+scale.toFixed(2)+'×（'+SCALE_GAUGE_MIN+'–'+SCALE_GAUGE_MAX+' 刻度范围，可超出）';
  return gauge;
}

/* top-left ABC badge, only rendered while catEditMode is active. Clicking it
   cycles A->B->C->A through setNodeCategory (applying the hierarchy
   constraint fixups), WITHOUT toggling/exiting edit mode itself — that's a
   separate shift-click gesture on the node/canvas (see toggleCategoryEditMode). */
function buildCategoryBadge(n){
  var badge = document.createElement('div');
  badge.className = 'mm-cat-badge';
  badge.dataset.cat = n.category;
  badge.textContent = n.category;
  badge.title = '点击切换节点分类（当前：'+n.category+'）';
  badge.addEventListener('mousedown', function(ev){
    ev.stopPropagation();
    pushUndo();
    var next = n.category==='A' ? 'B' : (n.category==='B' ? 'C' : 'A');
    setNodeCategory(n.id, next);
    scheduleSave();
    render();
  });
  return badge;
}
/* "M1".."M5" badge, immediately right of the ABC badge, ONLY for
   category==='B' nodes while catEditMode is active — "所有B类型节点的B符号
   右边额外出现一个M_符号". Clicking cycles masterLevel 1->2->3->4->5->1;
   masterLevel has no other editing surface (the popover only displays it,
   see openStylePopover) since this in-place badge IS the edit control. */
function buildMasterBadge(n){
  var badge = document.createElement('div');
  badge.className = 'mm-master-badge';
  badge.textContent = 'M'+n.masterLevel;
  badge.title = '点击切换熟练度（当前：M'+n.masterLevel+'）';
  badge.addEventListener('mousedown', function(ev){
    ev.stopPropagation();
    pushUndo();
    n.masterLevel = n.masterLevel>=5 ? 1 : n.masterLevel+1;
    scheduleSave();
    render();
  });
  return badge;
}
/* right-corner "*" badge shown on any node that has direct children but is
   not currently drilled open; clicking it expands direct children (does not
   affect deeper descendants' own expand/collapse state). */
function buildExpandStar(n){
  var star = document.createElement('div');
  star.className = 'mm-expand-star';
  star.textContent = '＊';
  star.title = '展开子节点（⌘点击：一次性展开子树，至多 '+appParams.expandCap+' 层）';
  star.addEventListener('mousedown', function(ev){
    ev.stopPropagation();
    pushUndo();
    if(ev.metaKey){
      expandSubtreeCapped(n.id, appParams.expandCap);
    } else {
      n.drilled = true;
    }
    selectedId = n.id;
    scheduleSave();
    render();
    // expanding a descendant changes how much content the current focus
    // root has to fit (containerSize is content-driven), but render() only
    // auto-refits the camera when state.focusId itself changes — which it
    // doesn't here, so without this the root silently stops filling the
    // screen the moment its size grows/shrinks from the newly-revealed
    // subtree. "折叠的节点被手动按*展开时,此时也要加一个自动化重置一下
    // 根节点显示区域动作".
    resyncRootView();
  });
  return star;
}
/* double-click collapses direct children; a no-op if already collapsed. */
function collapseNode(n){
  if(!n.drilled) return;
  pushUndo();
  n.drilled = false;
  selectedId = n.id;
  scheduleSave();
  render();
  resyncRootView();
}
/* manual double-click detection: every mousedown handler on a node calls
   render(), which replaces the ENTIRE #stage subtree (stage.innerHTML='')
   with freshly-created elements. The browser's native dblclick requires
   two mousedown+mouseup pairs on the SAME element — but by the time the
   second mousedown fires, the first mousedown's render() has already
   swapped in a brand-new element, so the browser never recognizes it as a
   double-click and dblclick silently never fires. Tracking clicks
   ourselves (by node id + timestamp + position) sidesteps that entirely. */
var lastClickInfo = null; // {id, time, x, y}
var DBLCLICK_MS = 400, DBLCLICK_PX = 6;
function isDoubleClick(id, ev){
  var now = Date.now ? Date.now() : new Date().getTime();
  var isDbl = !!(lastClickInfo && lastClickInfo.id===id
    && (now-lastClickInfo.time)<DBLCLICK_MS
    && Math.abs(ev.clientX-lastClickInfo.x)<DBLCLICK_PX
    && Math.abs(ev.clientY-lastClickInfo.y)<DBLCLICK_PX);
  lastClickInfo = isDbl ? null : {id:id, time:now, x:ev.clientX, y:ev.clientY};
  return isDbl;
}

function buildNodeContent(n, box){
  var wrap = document.createElement('div');
  wrap.className='mm-content';
  if(effectiveVis(n)===0){
    return wrap; // hidden: fill-only, no text rendered
  }
  // CSS percentage padding is always resolved against the container's WIDTH
  // for both padding-top/bottom AND padding-left/right (this is a real CSS
  // spec rule, not a bug in this codebase) — so a horizontal padding of "7%"
  // on a wide, short split-mode box ate up way more vertical space than the
  // sizing math in computeNodeBox() accounted for, clipping the top/bottom
  // of multi-line detail text. Setting padding in px, computed separately
  // from box.w and box.h, sidesteps that entirely.
  var padX = box.w*(1-CONTENT_PAD)/2, padY = box.h*(1-CONTENT_PAD)/2;
  wrap.style.padding = padY+'px '+padX+'px';
  if(box.mode==='split'){
    var split = document.createElement('div');
    split.className='mm-split';
    var sEl = document.createElement('div');
    sEl.className='mm-summary';
    sEl.style.width = box.sColW+'px';
    sEl.style.fontSize = box.fontPx+'px';
    sEl.innerHTML = n.summary||'';
    var div = document.createElement('div');
    div.className='mm-divider';
    var dEl = document.createElement('div');
    dEl.className='mm-detail';
    dEl.style.fontSize=(box.fontPx*0.94)+'px';
    dEl.innerHTML = n.detail||'';
    split.appendChild(sEl); split.appendChild(div); split.appendChild(dEl);
    wrap.appendChild(split);
  } else {
    var only = document.createElement('div');
    only.className='mm-summary-only';
    only.style.fontSize = box.fontPx+'px';
    if(!n.summary){ only.classList.add('mm-empty-ph'); only.textContent='(空)'; }
    else only.innerHTML = n.summary;
    wrap.appendChild(only);
  }
  return wrap;
}

/* ============================================================
   node interaction: click/dblclick/drag/cmd-click/option-click/contextmenu
   ============================================================ */
function nodeMousedown(ev, el, n){
  if(ev.target.closest('.pop') || ev.target.closest('.mm-expand-star')) return;
  ev.stopPropagation();
  // canvas nodes are never themselves focusable (no tabindex), so clicking
  // one never moves document.activeElement away from wherever it was
  // before — e.g. a rail button, or an <input>/<textarea> inside a still-
  // open flyout panel (the random-pick panel now opens by default on
  // load, so its formula textarea is a very likely candidate). The global
  // keydown handler's own guards ("ignore keys while typing in an input",
  // "ignore keys while focus is inside #rail/a flyout") then silently
  // swallow EVERY keyboard shortcut aimed at the canvas — including
  // ⌥⇧↓ batch-insert — even though a node is visibly selected, which is
  // almost certainly the real reason that shortcut kept appearing to do
  // nothing across many past attempts to fix it. Blurring here makes
  // clicking any canvas node unconditionally return keyboard focus to the
  // canvas/document, matching what a user visually expects "I just
  // clicked a node" to mean.
  if(document.activeElement && document.activeElement !== document.body && document.activeElement.blur){
    document.activeElement.blur();
  }
  // mobile drag-pickup toggle armed via #mobileDragKey — "点击拖拽键→点节点
  // 拾取→移动→再点拖拽键放下" — a tap on any node while armed picks it up
  // instead of running the normal click/select/drag logic below; every
  // other gesture (double-click, ⌥/⌘/⇧ branches, plain drag) stays
  // reachable exactly as before once nothing is armed/carried.
  if(mobileDrag.armed && !mobileDrag.node){ mobileDragPick(n, ev); return; }
  if(mobileDrag.node) return;
  if(isDoubleClick(n.id, ev)){
    collapseNode(n);
    return;
  }
  // touch-originated mousedowns never carry real shiftKey/ctrlKey/altKey/
  // metaKey (there's no physical modifier key in a tap), so the mobile
  // toolbar's armed modifiers (mobileArmedMods) are overlaid here — arming
  // ⇧ then tapping a node now behaves exactly like a real Shift+click.
  // Consumed (cleared) right after this one tap, same "use once" rule as
  // dispatchMobileKey's keyboard path.
  var effAlt = ev.altKey || mobileArmedMods.alt;
  var effMeta = ev.metaKey || mobileArmedMods.meta;
  var effShift = ev.shiftKey || mobileArmedMods.shift;
  if(mobileArmedMods.shift || mobileArmedMods.ctrl || mobileArmedMods.alt || mobileArmedMods.meta){
    mobileArmedMods.shift = mobileArmedMods.ctrl = mobileArmedMods.alt = mobileArmedMods.meta = false;
    refreshMobileModUI();
  }
  if(effAlt){
    selectedId = n.id;
    triggerGlow(); render();
    openInsertDialog({mode:'edit', node:n});
    return;
  }
  if(effMeta && effShift){
    // batch-cycle visibility of this node AND its entire subtree (every
    // descendant at every depth) together, not just its direct children —
    // previously this only reached one level down, so the node itself and
    // any grandchildren+ never changed. subtreeIds(n.id) already includes
    // n.id itself, so no separate call is needed to fold the node in.
    var subtree = subtreeIds(n.id).map(node).filter(Boolean);
    if(subtree.length){
      pushUndo();
      cycleVisBatch(subtree);
      selectedId = n.id;
      scheduleSave();
      render();
    }
    return;
  }
  if(effShift && !effAlt){
    // plain Shift+click (no ⌘) toggles category-edit mode on/off — see
    // toggleCategoryEditMode. Which node was clicked doesn't matter for
    // entering/exiting the mode itself; per-node category cycling only
    // happens via the ABC badge (buildCategoryBadge), which stops
    // propagation before this handler ever runs.
    toggleCategoryEditMode();
    return;
  }
  if(effMeta){
    // ⌘+click cycles this one node's visibility (hidden/summary/summary+detail).
    pushUndo();
    cycleVis(n);
    selectedId = n.id;
    scheduleSave();
    render();
    return;
  }
  if(n.id!==state.focusId && el){
    startNodeDrag(ev, el, n);
    selectedId = n.id;
    triggerGlow();
    render();
    return;
  }
  // n IS the current focus root — it's never draggable (it always fills
  // the whole screen with its own fixed margin, see fitCameraToRoot), but
  // a plain click on it must still SELECT it like any other node ("母节点
  // 也要支持选中") — only the drag-start above is skipped, not selection.
  selectedId = n.id;
  triggerGlow();
  render();
}
function attachNodeEvents(el, n){
  el.addEventListener('mousedown', function(ev){ nodeMousedown(ev, el, n); });
  el.addEventListener('contextmenu', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    openStylePopover(ev.clientX, ev.clientY, n);
  });
}

function startNodeDrag(ev, el, n){
  var startX=ev.clientX, startY=ev.clientY;
  var startPx=n.px, startPy=n.py;
  var moved=false;
  function onMove(e){
    var dx=(e.clientX-startX)/camera.scale, dy=(e.clientY-startY)/camera.scale;
    if(!moved && Math.abs(dx)+Math.abs(dy)<4/camera.scale) return;
    if(!moved){ moved=true; pushUndo(); el.classList.add('dragging'); draggingNodeId=n.id; }
    n.px = startPx+dx; n.py = startPy+dy;
    render();
  }
  function onUp(){
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    draggingNodeId = null;
    if(moved){
      scheduleSave();
      render();
    }
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

/* ============================================================
   insert dialog (single + batch)
   ============================================================ */
var insertOverlay = document.getElementById('insertOverlay');
var insertSummaryEl = document.getElementById('insertSummary');
var insertDetailEl = document.getElementById('insertDetail');
var insertHintTxt = document.getElementById('insertHintTxt');
var insertBatchBadge = document.getElementById('insertBatchBadge');
var insertCatRow = document.getElementById('insertCatRow');
var pendingInsert = null; // {kind, anchorId, dir, batch, editNode}
var focusBeforeInsertDialog = null;
var pendingInsertCategory = 'A'; // selected category for a NEW node being created in this dialog; ignored in edit mode (see insertCatRow click handler)

function refreshInsertCatUI(cat){
  Array.prototype.forEach.call(insertCatRow.querySelectorAll('.id-cat-btn'), function(b){
    b.classList.toggle('sel', b.dataset.cat===cat);
  });
}
insertCatRow.addEventListener('mousedown', function(ev){
  var btn = ev.target.closest('.id-cat-btn');
  if(!btn || !pendingInsert) return;
  ev.preventDefault();
  var cat = btn.dataset.cat;
  if(pendingInsert.mode==='edit'){
    pushUndo();
    setNodeCategory(pendingInsert.node.id, cat);
    scheduleSave();
    refreshInsertCatUI(pendingInsert.node.category);
    render();
  } else {
    pendingInsertCategory = cat;
    refreshInsertCatUI(cat);
  }
});

function openInsertDialog(cfg){
  pendingInsert = cfg;
  focusBeforeInsertDialog = document.activeElement;
  insertSummaryEl.innerHTML = cfg.node ? (cfg.node.summary||'') : '';
  insertDetailEl.innerHTML = cfg.node ? (cfg.node.detail||'') : '';
  // 预设: A的孩子默认A，B或C的孩子默认C — same rule as defaultCategoryForParent,
  // reused here for whichever anchor node the new node would be inserted
  // relative to (child/sibling both derive from the SAME parent).
  if(cfg.node){
    refreshInsertCatUI(cfg.node.category);
  } else {
    var parentIdForDefault = (cfg.mode==='child' || cfg.mode==='wrapChild') ? cfg.anchorId : (parentOf(cfg.anchorId)||{}).id;
    pendingInsertCategory = parentIdForDefault ? defaultCategoryForParent(parentIdForDefault) : 'A';
    refreshInsertCatUI(pendingInsertCategory);
  }
  insertOverlay.classList.add('show');
  insertBatchBadge.classList.toggle('show', !!cfg.batch);
  setTimeout(function(){ insertSummaryEl.focus(); }, 0);
}
function closeInsertDialog(){
  insertOverlay.classList.remove('show');
  pendingInsert = null;
  // restore focus to whatever had it before the dialog opened (e.g. a tree
  // row, so arrow-key nav there keeps working) instead of letting the
  // browser drop focus to <body> once the focused input hides.
  if(focusBeforeInsertDialog && document.body.contains(focusBeforeInsertDialog)){
    focusBeforeInsertDialog.focus();
  }
  focusBeforeInsertDialog = null;
}
function commitInsertDialog(){
  if(!pendingInsert) return;
  var summary = sanitizeRich(insertSummaryEl.innerHTML);
  var detail = sanitizeRich(insertDetailEl.innerHTML);
  var summaryPlain = richToPlain(summary).trim();
  var detailPlain = richToPlain(detail).trim();
  if(pendingInsert.mode==='edit'){
    pushUndo();
    pendingInsert.node.summary = summaryPlain ? summary : '';
    pendingInsert.node.detail = detailPlain ? detail : '';
    scheduleSave();
  } else if(!summaryPlain && !detailPlain){
    // ignore empty submits
  } else {
    pushUndo();
    var newId = null;
    var cfg = pendingInsert;
    var sVal = summaryPlain ? summary : '', dVal = detailPlain ? detail : '';
    if(cfg.mode==='child'){
      var anchor = node(cfg.anchorId);
      newId = addChild(cfg.anchorId, sVal, dVal);
      anchor.drilled = true;
    } else if(cfg.mode==='wrapChild'){
      var wrapAnchor = node(cfg.anchorId);
      newId = insertWrapChild(cfg.anchorId, sVal, dVal);
      wrapAnchor.drilled = true;
    } else if(cfg.mode==='parent'){
      newId = insertParentAbove(cfg.anchorId);
      state.nodes[newId].summary = sVal;
      state.nodes[newId].detail = dVal;
    } else if(cfg.mode==='sibling'){
      newId = insertSibling(cfg.anchorId, cfg.dir, sVal, dVal);
    }
    // the category picker's selection overrides whatever default the
    // insert helper (addChild/insertSibling) already applied — this is the
    // ONE spot a brand-new node's category can differ from the automatic
    // "A unless parent is B/C" default, and it still runs through
    // setNodeCategory so the hierarchy-constraint propagation applies.
    if(newId) setNodeCategory(newId, pendingInsertCategory);
    if(newId){ selectedId = newId; triggerGlow(); }
    scheduleSave();
  }
  render();
  if(pendingInsert && pendingInsert.batch){
    var batchCfg = pendingInsert;
    openInsertDialog(batchCfg);
  } else {
    closeInsertDialog();
  }
}
document.getElementById('insertOkBtn').addEventListener('click', commitInsertDialog);
document.getElementById('insertCancelBtn').addEventListener('click', closeInsertDialog);
insertOverlay.addEventListener('mousedown', function(e){ if(e.target===insertOverlay) closeInsertDialog(); });
[insertSummaryEl, insertDetailEl].forEach(function(elx){
  elx.addEventListener('keydown', function(e){
    // while an IME composition is in progress (e.g. typing Chinese pinyin and
    // pressing Enter to commit the candidate), the browser also fires a
    // regular keydown with key==='Enter' — without this guard that Enter was
    // being treated as "submit the whole dialog" before the user had even
    // finished composing the text.
    if(e.isComposing || e.keyCode===229) return;
    if((e.metaKey||e.ctrlKey) && (e.key==='b'||e.key==='B')){ e.preventDefault(); document.execCommand('bold'); return; }
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); commitInsertDialog(); return; }
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeInsertDialog(); return; }
    // plain Enter (with or without Shift) always inserts a line break within
    // the same textbox in both Summary and Detail — only ⌘Enter saves+closes.
    if(e.key==='Enter'){ e.preventDefault(); document.execCommand('insertLineBreak'); return; }
  });
});

/* ============================================================
   keyboard: navigation, insert shortcuts, zoom, bold
   ============================================================ */
function currentSelectedNode(){ return node(selectedId) || node(state.focusId); }

function directionalNeighbor(n, dir){
  var pn = parentOf(n.id);
  if(!pn) return null;
  var sibs = children(pn.id).filter(function(s){ return s.id!==n.id; });
  if(!sibs.length) return null;
  var best=null, bestScore=Infinity;
  var dvx = dir==='left'?-1:dir==='right'?1:0;
  var dvy = dir==='up'?-1:dir==='down'?1:0;
  sibs.forEach(function(s){
    var dx=s.px-n.px, dy=s.py-n.py;
    var dist=Math.sqrt(dx*dx+dy*dy)||0.001;
    var dot = (dx/dist)*dvx + (dy/dist)*dvy;
    if(dot<=0.15) return;
    var score = dist / dot;
    if(score<bestScore){ bestScore=score; best=s; }
  });
  return best;
}
function pickChildInDirection(parentId, dir){
  var kids = children(parentId);
  if(!kids.length) return null;
  var dvx = dir==='left'?-1:dir==='right'?1:0;
  var dvy = dir==='up'?-1:dir==='down'?1:0;
  var best=null, bestScore=Infinity;
  kids.forEach(function(k){
    var dist = Math.sqrt(k.px*k.px+k.py*k.py)||0.001;
    var dot = (k.px/dist)*dvx + (k.py/dist)*dvy;
    if(dot<=0.15) return;
    var score = dist / dot;
    if(score<bestScore){ bestScore=score; best=k; }
  });
  return best || kids[0];
}

document.addEventListener('keydown', function(e){
  // Esc must always be able to close an open rail panel (search/tree/params)
  // and clear node selection, even while focus is sitting inside that
  // panel's own <input> (e.g. the user just typed a search query) — so this
  // check runs BEFORE the "ignore keys while typing in an input" guard
  // below, which only applies to every other shortcut. The insert/edit
  // dialog is excluded here since it has its own Escape handling (which
  // only closes the dialog, and deliberately must NOT also clear canvas
  // selection — that would surprise the user mid-edit).
  //
  // Each Esc press clears exactly ONE layer of state, in this priority
  // order, so two presses are needed to get all the way back to a
  // completely blank state (no panel, no selection, no rail focus) —
  // mirroring "Tab to focus a rail icon, Enter to activate, Esc to
  // deactivate, Esc again to fully deselect" and matching the
  // just-jumped-from-search-result case (Esc #1 only clears the newly
  // selected/glowing node while leaving focus on the search icon so Enter
  // immediately re-opens it for the next search; Esc #2 then blurs the
  // icon to reach the blank state).
  //   1. an open rail panel -> close it. For the search/tree panels the
  //      whole point of pressing Enter inside them was to pick a node to
  //      act on, so closing the panel must NEVER also drop that selection —
  //      only the panel/nav focus goes away, the selected+glowing node
  //      stays exactly as it was. Every other panel (params, etc.) has no
  //      such "I came here to pick a node" intent, so Esc clears selection
  //      too, matching the plain "nothing selected, blank nav" reset.
  //   2. a selected/glowing node -> clear just that
  //   3. focus resting on a rail button -> blur it
  if(e.key==='Escape' && !insertOverlay.classList.contains('show') && !rbMaterializeOverlay.classList.contains('show')){
    // the size gauge has its own independent lifetime (see triggerSizeGauge)
    // and Esc always dismisses it immediately regardless of which OTHER
    // layer this same Escape press goes on to clear below.
    clearSizeGauge();
    // the color/border style popover (⌃click / ⌃Enter) is its OWN layer,
    // one step ABOVE even the rail panel it might be sitting on top of
    // (e.g. ⌃Enter on a tree row while the tree panel is open) — closing
    // it must be a dedicated Esc press on its own, not silently bundled
    // into whatever the next tier down happens to close. Previously this
    // popover-close only ran as a side-effect line inside the branches
    // below, so "打开树视图,⌃Enter打开颜色面板,按Esc" closed the popover
    // AND the whole tree panel in one press instead of two ("第一次Esc
    // 关闭颜色控制面板,第二次才是退出导航").
    if(document.querySelector('.pop')){
      closePopover(); render();
      return;
    }
    if(anyRailPanelOpen()){
      var keepSelectionOnEsc = (treeFlyout && treeFlyout.classList.contains('open'))
        || (searchFlyout && searchFlyout.classList.contains('open'));
      closeAllRailPanels();
      if(!keepSelectionOnEsc) selectedId=null;
      render();
      return;
    }
    if(selectedId){
      selectedId=null; render();
      return;
    }
    // nothing left to deselect and no panel open — this Esc has nothing
    // further to "back out of", so it instead resets the current focus
    // root's view to fill the screen at its natural fit scale/position —
    // "在没有任何focus时如果还继续Esc,则自动对齐可见区域根节点大小到默认
    // 大小". Same shared action as expanding/collapsing a node or changing
    // the max-visible-depth param (see resyncRootView).
    if(document.activeElement && document.activeElement.blur &&
       (document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA'
        || (document.activeElement.closest && document.activeElement.closest('#rail')))){
      document.activeElement.blur();
    }
    render();
    resyncRootView();
    return;
  }

  // ⌘=/⌘+/⌘- are this app's own shape-size / global-font-scale shortcut
  // and must NEVER fall through to the browser's native page zoom — that
  // native zoom scales literally everything together (canvas, the open
  // tree/search/params flyout, and the rail itself), which is exactly
  // what happened when focus happened to be resting on a rail button (via
  // Tab) or inside the open tree view (a focused row): this check used to
  // run AFTER the "ignore while typing in an input" and "a rail button/
  // flyout has focus" early-returns further below, so in those cases
  // preventDefault() was never reached and the keystroke hit the browser
  // unblocked. Running it here, right after Escape handling and before
  // those guards, makes the app's own zoom behavior apply no matter where
  // focus happens to be — except inside the insert/edit dialog, which
  // keeps its own separate scope (⌘B / ⌘Enter) and is left untouched.
  if((e.metaKey||e.ctrlKey) && (e.key==='='||e.key==='+'||e.key==='-') && !insertOverlay.classList.contains('show')){
    e.preventDefault();
    var curForZoom = currentSelectedNode();
    triggerSizeGauge();
    if(selectedId && curForZoom){
      pushUndo();
      // ⌘+/⌘- adjusts BOTH axes of whichever pair is currently active
      // (no-kids or kids) together — a pure isotropic zoom. No upper/lower
      // clamp here — "此时已经允许超过这个范围（理论上缩放比例不限）" —
      // the SCALE_GAUGE_MIN/MAX constants only bound the gauge's fill display.
      // Step is a plain 1.1x/0.9x multiplier of the CURRENT value each
      // press — "每次cmd+都是放大1.1倍,cmd-缩小为0.9倍横竖半径,都是针对
      // 当前值" — not the old ~1.259x log-step (100^(1/10)) inherited from
      // the discrete sizeLevel system.
      var factor = e.key==='-' ? 0.9 : 1.1;
      if(curForZoom.drilled){
        curForZoom.scaleXKids *= factor; curForZoom.scaleYKids *= factor;
      } else {
        curForZoom.scaleXNoKids *= factor; curForZoom.scaleYNoKids *= factor;
      }
      scheduleSave(); triggerGlow(); render();
    } else {
      var fontDelta = e.key==='-' ? -0.2 : 0.2;
      appParams.globalFontScale = clamp(Math.round((appParams.globalFontScale+fontDelta)*10)/10, GLOBAL_FONT_SCALE_MIN, GLOBAL_FONT_SCALE_MAX);
      saveParams(); render();
    }
    return;
  }

  if(document.activeElement && (document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA')) return;
  if(insertOverlay.classList.contains('show')) return;

  // ⌘Z undoes the last change, regardless of whether focus is on the canvas,
  // a tree-view row, or nowhere in particular — undo() itself already
  // re-points focusId/selectedId at whatever still exists after the
  // rollback, so this doesn't need any per-view special-casing.
  if((e.metaKey||e.ctrlKey) && !e.shiftKey && (e.key==='z'||e.key==='Z')){
    e.preventDefault();
    undo();
    return;
  }
  // ⌘Delete / ⌘Backspace deletes the currently selected node (with a
  // confirmation prompt, since this removes the ENTIRE subtree) — works the
  // same from the main canvas and from a focused tree-view row, since both
  // just operate on selectedId/currentSelectedNode(). The ultimate root
  // can't be deleted (deleteSubtree() already no-ops for it), so the
  // confirm is skipped entirely in that case rather than asking a question
  // whose "yes" would silently do nothing.
  if((e.metaKey||e.ctrlKey) && (e.key==='Delete'||e.key==='Backspace')){
    var delTarget = currentSelectedNode();
    if(delTarget && delTarget.id!==state.rootId){
      e.preventDefault();
      var delSummary = richToPlain(delTarget.summary) || '(未命名)';
      if(confirm('删除节点"'+delSummary+'"及其全部子节点？此操作可用 ⌘Z 撤销。')){
        pushUndo();
        deleteSubtree(delTarget.id);
        scheduleSave();
        if(treeFlyout && treeFlyout.classList.contains('open')) renderTreeView();
        render();
      }
    }
    return;
  }

  // a rail button (or any element inside the rail/flyout panels) is
  // currently focused via Tab — let it handle its own Enter/Space
  // (native button activation, or the per-button keydown listener
  // registered in registerRailPanel) instead of hijacking Enter to open
  // the node-edit dialog. This is what makes "Tab to the search icon,
  // then Enter" actually open the panel instead of doing nothing.
  if(document.activeElement && document.activeElement.closest && document.activeElement.closest('#rail, #searchFlyout, #treeFlyout, #paramsFlyout, #randomFlyout')) return;

  var cur = currentSelectedNode();
  if(!cur) return;

  // ⌥Enter edits the selected node's own content, mirroring ⌥click on a
  // canvas node (see nodeMousedown's own altKey branch) and ⌥Enter on a
  // focused tree row (see handleTreeRowKeydown). Plain Enter with no
  // modifiers is intentionally a NO-OP here — it mirrors a plain click,
  // which only selects a node (nodeMousedown's fallthrough case) and does
  // nothing else, so Enter shouldn't either: "主面板选中node,直接回车,
  // 应该没有任何功能,因为模拟的是鼠标单击,而不应该像现在这样等同于option
  // enter的功能". Previously this branch didn't check e.altKey at all, so
  // plain Enter fell through to the SAME edit-dialog behavior as ⌥Enter.
  if(e.key==='Enter' && e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey){
    e.preventDefault();
    openInsertDialog({mode:'edit', node:cur});
    return;
  }

  // ⌘Enter/⌘⇧Enter/⌘←/⌘→ mirror the exact mouse gestures they're named
  // after (⌘click / double-click / the "*" star), just reachable without a
  // mouse: "cmd enter要等效于cmd单击...cmd shift enter批量切换可见性...
  // cmd⬅️表示折叠,等效于双击。cmd➡️表示展开,等效于单击右上角*号". All four
  // skip when the selected node IS the current focus root, same as their
  // mouse-driven equivalents (cycleVis/collapseNode/expand-star are never
  // invoked on the root either — nodeMousedown's own metaKey branch runs
  // unconditionally of focusId, but the root has no visible chip/star to
  // click in the first place, so mirroring "no-op on the root" here keeps
  // the keyboard path consistent with what's actually reachable by mouse).
  if(e.metaKey && !e.ctrlKey && !e.altKey && e.key==='Enter'){
    e.preventDefault();
    if(e.shiftKey){
      var batchSubtree = subtreeIds(cur.id).map(node).filter(Boolean);
      if(batchSubtree.length){
        pushUndo();
        cycleVisBatch(batchSubtree);
        scheduleSave(); triggerGlow(); render();
        // toggling detail visibility across a subtree changes the root's
        // own content-driven size (containerSize), but render() only
        // auto-refits the camera when state.focusId itself changes — it
        // doesn't here, so without an explicit resync the view can end up
        // showing leftover blank margin or a partially-cut-off root —
        // "由于detail展开导致画面被缩放...请在这些功能后面加一个自动重置
        // 缩放". Runs on canvas AND tree view, both ⌘Enter and ⌘⇧Enter.
        resyncRootView();
      }
    } else {
      pushUndo();
      cycleVis(cur);
      scheduleSave(); triggerGlow(); render();
      resyncRootView();
    }
    return;
  }
  // ⌘↓ expands, ⌘↑ collapses — "选中节点以后展开折叠快捷键改成cmd⬇️,
  // cmd⬆️,同时应用在主视图和tree view". ⌘←/→ on the canvas is intentionally
  // gone (moved to ⌘↓/↑) — "取消主视图里面的cmd左右的功能" — but plain
  // ←/→ with no ⌘ still needs to keep working for tree-panel step-through
  // (see the "treeFlyout is open" branch further below), so this only
  // checks for the ArrowDown/ArrowUp keys, never touching Left/Right.
  if(e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && e.key==='ArrowDown'){
    e.preventDefault();
    if(cur.children.length){
      pushUndo();
      cur.drilled = true;
      triggerGlow();
      scheduleSave();
      render();
      resyncRootView();
    }
    return;
  }
  if(e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && e.key==='ArrowUp'){
    e.preventDefault();
    collapseNode(cur);
    return;
  }

  // ⌃Enter mirrors ⌃click on a canvas node (opens the color/border style
  // popover) — the same equivalence tree-view rows already have via their
  // own ⌃Enter handler (see handleTreeRowKeydown), just missing here on
  // the canvas side. No real mouse position when triggered from the
  // keyboard, so the popover anchors off the selected node's own
  // on-screen DOM rect instead of clientX/clientY.
  if(e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && e.key==='Enter'){
    e.preventDefault();
    var curEl = stage.querySelector('[data-id="'+cur.id+'"]');
    var curRect = curEl ? curEl.getBoundingClientRect() : {left:0,top:0,width:0,height:0};
    openStylePopover(curRect.left+curRect.width/2, curRect.top+curRect.height/2, cur);
    return;
  }

  if(e.altKey && !e.metaKey && !e.ctrlKey && e.shiftKey){
    var batchDirMap = {ArrowDown:'child', ArrowRight:'sibling-r', ArrowLeft:'sibling-l'};
    // ⌥⇧B is a fallback for the batch-child action specifically — some
    // macOS setups (trackpad gestures, Spaces navigation, certain input
    // methods) can swallow ⌥⇧↓ at the OS level before it ever reaches the
    // browser, while ⌥⇧←/→ go through fine (confirmed: "opt shift ➡️都是
    // 好的...只有opt shift ⬇️是两边都没有效果的"). The keyboard code is
    // otherwise byte-for-byte identical between the working and
    // non-working directions, which points at an OS/browser-level
    // interception rather than a logic bug — this gives a reliable way in
    // regardless of which system shortcut turns out to be the culprit.
    // MUST check e.code (physical key position), NOT e.key: holding Option
    // on macOS remaps which CHARACTER a letter key reports in e.key (e.g.
    // Option+B types '∫', Option+Shift+B types 'ı' on the standard US
    // layout) — e.key is NEVER literally 'b'/'B' while altKey is true, on
    // any layout where Option remaps that key. That's exactly why the
    // ⌥⇧B fallback itself silently never fired ("新加的option shift b也
    // 没效果") — e.code is the physical key position and is unaffected by
    // any modifier-driven character remapping, so it's the only reliable
    // way to detect "the B key was pressed" while Option is held.
    if(batchDirMap[e.key] || e.code==='KeyB'){
      e.preventDefault();
      var bm = batchDirMap[e.key] || 'child';
      if(bm==='child') openInsertDialog({mode:'child', anchorId:cur.id, batch:true});
      else if(bm==='sibling-r') openInsertDialog({mode:'sibling', anchorId:cur.id, dir:1, batch:true});
      else if(bm==='sibling-l') openInsertDialog({mode:'sibling', anchorId:cur.id, dir:-1, batch:true});
      return;
    }
  }

  if(e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey){
    var dirMap = {ArrowDown:'wrapChild', ArrowUp:'parent', ArrowRight:'sibling-r', ArrowLeft:'sibling-l'};
    if(dirMap[e.key]){
      e.preventDefault();
      var m = dirMap[e.key];
      if(m==='wrapChild') openInsertDialog({mode:'wrapChild', anchorId:cur.id});
      else if(m==='parent') openInsertDialog({mode:'parent', anchorId:cur.id});
      else if(m==='sibling-r') openInsertDialog({mode:'sibling', anchorId:cur.id, dir:1});
      else if(m==='sibling-l') openInsertDialog({mode:'sibling', anchorId:cur.id, dir:-1});
      return;
    }
  }

  if(e.shiftKey && (e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    if(e.key==='ArrowUp'){
      if(cur.id === state.focusId){
        // cur IS the current visible-area root (currentSelectedNode()
        // already falls back to the root when nothing is selected, so this
        // also covers that case) — its own parent is genuinely INVISIBLE
        // right now, so this is the ONE case Shift+Up is allowed to
        // broaden the view itself: the visible root moves up one level and
        // the newly-revealed parent becomes selected. Every other case
        // below only ever changes SELECTION, never the view.
        var pn = parentOf(state.focusId);
        if(pn){
          pushUndo();
          state.focusId = pn.id;
          selectedId = pn.id;
          collapseBeyondDepth(pn.id, appParams.maxAutoDepth);
          scheduleSave(); triggerGlow(); render();
        }
      } else {
        // cur is strictly inside the current visible root's subtree, so its
        // parent is ALREADY on screen — Shift+Up here only ever moves the
        // selection to that parent, exactly one tree level up, and never
        // touches focusId/camera. This is what makes "select a direct child
        // of the visible root, then Shift+Up" land on the root itself
        // without the root's own position/view changing.
        var pnSel = parentOf(cur.id);
        if(pnSel){
          selectedId = pnSel.id;
          triggerGlow(); render();
        }
      }
    } else {
      var kids = children(cur.id);
      if(kids.length){
        cur.drilled = true;
        selectedId = kids[0].id;
        scheduleSave(); triggerGlow(); render();
      }
    }
    return;
  }

  if(e.shiftKey && e.key==='Enter'){
    e.preventDefault();
    pushUndo();
    cur.drilled = true;
    // render()'s own focus-change detection (see fitCameraToRoot) only
    // auto-refits the camera when state.focusId actually CHANGES value —
    // but if nothing was explicitly selected, cur already IS the current
    // focus root (currentSelectedNode() falls back to it), so pressing
    // Shift+Enter here leaves focusId unchanged and the refit never fires.
    // That's exactly the case where a leftover pinch-zoom scale (or any
    // other manual zoom) needs to be corrected — "如果曾经使用过双指捏合，
    // 再选中任何节点shift enter的时候要有一个自动缩放机制" — so force it
    // explicitly whenever the node becoming focus was ALREADY the focus,
    // instead of relying on the implicit focusChanged path.
    var alreadyFocus = state.focusId === cur.id;
    state.focusId = cur.id;
    // becoming the new visible root deselects it — same "nothing selected"
    // state as clicking blank canvas, instead of leaving it looking picked.
    selectedId = null;
    scheduleSave(); render();
    if(alreadyFocus){ resyncRootView(); }
    return;
  }

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)!==-1){
    e.preventDefault();
    // while the tree view panel is open, arrow keys follow the TREE's own
    // navigation rules instead of the canvas's spatial direction-based
    // rules: ↑/↓ step to the previous/next node in strict tree order
    // (same order the tree view renders top-to-bottom — this naturally
    // walks into/out of expanded subtrees), and ←/→ collapse/expand the
    // selected node (jumping to its parent/first-child once there's
    // nothing left to collapse/expand) via the exact same treeStepLeft/
    // treeStepRight helpers a focused tree row itself uses. This restores
    // behavior from an earlier version that later regressed into always
    // using the spatial rules even with the tree panel open.
    if(treeFlyout && treeFlyout.classList.contains('open')){
      var tid = selectedId || treeFocusId || state.rootId;
      var stepTarget = null;
      if(e.key==='ArrowUp' || e.key==='ArrowDown'){
        var vids = getVisibleTreeRowIds();
        var vidx = vids.indexOf(tid);
        if(vidx===-1) vidx = 0;
        var vNext = e.key==='ArrowDown' ? vidx+1 : vidx-1;
        if(vNext>=0 && vNext<vids.length) stepTarget = vids[vNext];
      } else if(e.key==='ArrowRight'){
        stepTarget = treeStepRight(tid);
      } else {
        stepTarget = treeStepLeft(tid);
      }
      if(stepTarget){
        selectedId = stepTarget;
        treeFocusId = stepTarget;
        triggerGlow();
        makeTreeSelectionVisibleOnCanvas(stepTarget);
        scheduleSave();
        renderTreeView();
        render();
      }
      return;
    }
    var dirName = e.key==='ArrowUp'?'up':e.key==='ArrowDown'?'down':e.key==='ArrowLeft'?'left':'right';
    if(!selectedId){
      var child = pickChildInDirection(state.focusId, dirName);
      if(child){ selectedId = child.id; triggerGlow(); render(); }
      return;
    }
    if(cur.id===state.focusId){
      // the selected node IS the current visible-area root — plain arrow
      // keys are completely inert here (no selection change, no view
      // change): the visible area is a hard boundary that can only be
      // widened deliberately via Shift+Up, never nudged open by a plain
      // arrow press. This replaces the old "broaden the view on ←/→"
      // fallback, which is exactly the unwanted side effect being removed.
      return;
    }
    var nb = directionalNeighbor(cur, dirName);
    if(nb){ selectedId = nb.id; triggerGlow(); render(); }
  }
});

/* ============================================================
   pan & zoom (wheel + trackpad)
   ============================================================ */
function minScaleForFit(){
  // never allow zooming out past "the current root box exactly fits the
  // viewport" — beyond that there's nothing more to see, just empty canvas.
  // Uses the same margin AND the same visible (panel-aware) rect as
  // fitCameraToRoot() so the two agree: without this, clampCamera()'s
  // floor here would be a *larger* scale than what fitCameraToRoot() just
  // set (no margin > with margin, or full width > visible width when a
  // panel is open), and immediately override the margin back to zero on
  // every focus change — exactly the "双指捏合到极限,还是会被导航栏挡住"
  // symptom, since pinch-zoom-out used to be allowed to shrink the root
  // well past the visible strip's own real boundary.
  var vis = visibleCanvasRect();
  var margin = focusFitMargins();
  var fitScale = Math.min((vis.width-margin.x*2)/lastRootBox.w, (vis.height-margin.y*2)/lastRootBox.h);
  return Math.max(MIN_SCALE, fitScale);
}
canvasWrap.addEventListener('mousedown', function(e){
  if(mobileDrag.node){ mobileDragMoveTo(e.clientX, e.clientY); return; }
  if(e.target.closest('.mm-node')) return;
  if(e.shiftKey){ toggleCategoryEditMode(); return; }
  if(e.metaKey) return; // ⌘+click on blank canvas is a no-op (nothing under the cursor to act on)
  selectedId = null;
  render();
});

canvasWrap.addEventListener('wheel', function(e){
  e.preventDefault();
  var rect = canvasWrap.getBoundingClientRect();
  var sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  if(e.ctrlKey){
    var before = { x:(sx-camera.x)/camera.scale, y:(sy-camera.y)/camera.scale };
    var factor = Math.exp(-e.deltaY*0.012);
    camera.scale = clamp(camera.scale*factor, minScaleForFit(), MAX_SCALE);
    camera.x = sx - before.x*camera.scale;
    camera.y = sy - before.y*camera.scale;
  } else {
    camera.x -= e.deltaX;
    camera.y -= e.deltaY;
  }
  clampCamera();
  applyCamera();
}, {passive:false});
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
/* every theme except "light" uses the dark half of each color preset — the
   four dark-ish themes (dark/deepblue/graphite/vscode/hicontrast) only
   change surrounding chrome colors via CSS variables; node fill/border
   presets stay a single shared "light vs dark" pair rather than needing a
   full palette per theme. */
function isDarkTheme(){ return state.theme!=='light'; }

/* ============================================================
   unified rail-panel manager: search / tree / params flyouts.
   Opening one closes any other (mutual exclusivity), Esc closes
   whichever is open (and only THEN falls through to deselecting a
   node), and clicking a panel's rail icon while focused + Enter
   opens it (so Tab -> Enter works, not just mouse clicks).
   ============================================================ */
var railPanels = []; // [{btn, flyout, onOpen?}]
function registerRailPanel(btn, flyout, onOpen){
  railPanels.push({btn:btn, flyout:flyout, onOpen:onOpen});
  // flyouts are hidden via a CSS transform (so the slide-in animation has
  // something to animate), NOT display:none — which means their inputs/
  // buttons stay in the normal Tab order even while off-screen. `inert`
  // (native, no polyfill needed in any current browser) is what actually
  // removes a closed panel's contents from Tab/focus entirely; without it,
  // pressing Esc twice after a tree-row or search-result selection would
  // blur the row and Tab would silently walk into the NEXT (also
  // technically-focusable-but-invisible) flyout's controls instead of
  // landing back on the rail — reported as "Tab不起作用" after Esc twice.
  flyout.inert = true;
  btn.addEventListener('click', function(){ toggleRailPanel(btn, flyout, onOpen); });
  btn.addEventListener('keydown', function(e){
    // → behaves like Enter/Space here (open the panel) — this is what lets
    // "Tab to the tree-view icon, then →" open the tree flyout and land
    // focus on its root row, matching the request that → should act like
    // Enter once focus is sitting on a rail toggle button.
    if(e.key==='Enter' || e.key===' ' || e.key==='ArrowRight'){
      e.preventDefault();
      toggleRailPanel(btn, flyout, onOpen);
    }
  });
}
function toggleRailPanel(btn, flyout, onOpen){
  var wasOpen = flyout.classList.contains('open');
  closeAllRailPanels();
  if(!wasOpen){
    flyout.classList.add('open');
    flyout.inert = false;
    btn.classList.add('active');
    if(onOpen) onOpen();
    // opening a panel changes how much of #canvasWrap is actually visible
    // (see visibleCanvasRect) — the root's fit/center must be recomputed
    // against that new, narrower visible strip — "导航栏展开和折起都要
    // 动态适配一次根节点显示区域". Deferred past the flyout's own .16s
    // slide transition (see "transition:transform .16s ease" on every
    // flyout) so getBoundingClientRect() measures it at its FINAL resting
    // position, not mid-slide. The CLOSING case is covered symmetrically
    // by closeAllRailPanels() itself (see its own comment), since that's
    // also the path Esc and every other "leave this panel" action funnels
    // through, not just this toggle button.
    setTimeout(resyncRootView, 170);
  }
}
function closeAllRailPanels(){
  // Esc-driven panel close (see the keydown handler) always wants nav focus
  // to fully clear afterward — not land back on the panel's rail button —
  // so that a subsequent Tab/arrow-key press starts fresh instead of
  // resuming mid-rail. If the panel currently had focus somewhere inside
  // itself (e.g. the search input auto-focuses when the panel opens), blur
  // it explicitly rather than letting focus drop implicitly, since some
  // browsers leave a stale focus ring on a hidden element otherwise.
  var wasAnyOpen = anyRailPanelOpen();
  railPanels.forEach(function(p){
    if(p.flyout.classList.contains('open') && document.activeElement && p.flyout.contains(document.activeElement)){
      document.activeElement.blur();
    }
    if(document.activeElement===p.btn) p.btn.blur();
    p.flyout.classList.remove('open');
    p.flyout.inert = true;
    p.btn.classList.remove('active');
  });
  // closing a panel widens #canvasWrap's visible strip back out (see
  // visibleCanvasRect) — the root's fit/center must be recomputed against
  // that, symmetric with toggleRailPanel's own resync on the opening side
  // — "导航栏展开和折起都要动态适配一次根节点显示区域". Every "leave this
  // panel" action (Esc, a tree-row Enter, a search-result pick, etc.)
  // funnels through this one function, so handling it centrally here
  // covers all of them instead of needing a resync call at each site.
  // Guarded on wasAnyOpen so an Esc press with nothing open (already a
  // no-op for the panel state itself) doesn't also force a needless
  // resync. Same .16s slide-transition deferral as the opening side.
  if(wasAnyOpen) setTimeout(resyncRootView, 170);
}
function anyRailPanelOpen(){
  return railPanels.some(function(p){ return p.flyout.classList.contains('open'); });
}
/* full list of every rail button in visual (DOM) order, including ones that
   aren't panel-toggles (import/export/fit/theme) — used for ↑↓ navigation
   across the whole rail once focus lands on any one of them. */
function getAllRailButtons(){
  return Array.prototype.slice.call(document.querySelectorAll('#rail .rail-btn'));
}
/* wraps focus past either end of the rail button list back to the other
   side instead of clamping — used for ↑/↓ and Tab/⇧Tab navigation across
   the rail buttons, where "past the last button" should cycle back to the
   first (and vice versa) rather than getting stuck. */
function focusRailButtonByIndexWrapped(idx){
  var btns = getAllRailButtons();
  if(!btns.length) return;
  idx = ((idx % btns.length) + btns.length) % btns.length;
  btns[idx].focus();
}
/* ↑/↓ while any rail button has focus moves focus to the previous/next rail
   button (Tab/Shift+Tab-like), regardless of whether a panel is currently
   open — this only fires when the event bubbles up from a focused
   .rail-btn, so it never hijacks arrow keys typed inside a flyout's own
   <input> (those live outside #rail in the DOM). Tab/⇧Tab are intercepted
   here too so they cycle within the rail the same way ↑/↓ do, instead of
   the browser's native Tab order carrying focus out of the rail entirely
   once it reaches the first/last button. */
railEl.addEventListener('keydown', function(e){
  var isArrow = e.key==='ArrowDown' || e.key==='ArrowUp';
  var isTab = e.key==='Tab';
  if(!isArrow && !isTab) return;
  var btns = getAllRailButtons();
  var idx = btns.indexOf(document.activeElement);
  if(idx===-1) return;
  var forward = isTab ? !e.shiftKey : e.key==='ArrowDown';
  e.preventDefault();
  focusRailButtonByIndexWrapped(idx + (forward?1:-1));
});

/* ============================================================
   nav rail: search / import / export / theme / fit
   ============================================================ */
function renderNav(){
  if(treeFlyout && treeFlyout.classList.contains('open')) renderTreeView();

  // must track live category/masterLevel edits — "B节点的数目...能随着B
  // 节点定义实时更新" — so refresh it on every render() pass the panel is
  // open for, the same pattern treeFlyout already uses above, instead of
  // only refreshing when the panel is freshly opened.
  if(randomFlyout && randomFlyout.classList.contains('open')) renderRandomPanel();
}

var btnSearch = document.getElementById('btnSearch');
var searchFlyout = document.getElementById('searchFlyout');
var searchInput = document.getElementById('searchInput');
var searchResults = document.getElementById('searchResults');
registerRailPanel(btnSearch, searchFlyout, function(){
  // always start a fresh search — clear whatever query/results were left
  // over from the previous time this panel was opened.
  searchInput.value = '';
  searchResults.innerHTML = '';
  searchActiveIdx = -1;

});
function escHtml(s){ return s.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function highlight(text, q){
  if(!q) return escHtml(text);
  var idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return escHtml(text);
  return escHtml(text.slice(0,idx))+'<span class="sr-hit">'+escHtml(text.slice(idx,idx+q.length))+'</span>'+escHtml(text.slice(idx+q.length));
}
var searchActiveIdx = -1;
function commitSearchResult(n){
  // the picked result becomes the visible-area ROOT itself
  // (state.focusId = n.id), NOT a first-level child under its own parent —
  // same fix as tree view's own Enter handler (see handleTreeRowKeydown):
  // "搜出来节点,然后回车,应该要让选中的节点位于可见区域根节点,而不是像现在
  // 这样位于一级子节点". Becoming the new focus root deselects it, same as
  // canvas Shift+Enter and the tree view's own Enter — "nothing selected"
  // is the consistent end state whenever a node newly becomes the root.
  var alreadyFocus = state.focusId === n.id;

  render();
  closeAllRailPanels();
  if(alreadyFocus){ resyncRootView(); }
}
/* ⌥click on a search result opens the edit dialog for that node — the same

function altActivateSearchResult(n){

}
/* ⌃click on a search result opens the color/border style popover for that

function ctrlActivateSearchResult(n, x, y){

}
function setSearchActive(idx){
  var items = searchResults.querySelectorAll('.sr-item');
  items.forEach(function(it){ it.classList.remove('sr-active'); });
  if(idx>=0 && idx<items.length){

searchInput.addEventListener('input', function(){
  var q = searchInput.value.trim();

  var ql = q.toLowerCase();
  var hits = Object.keys(state.nodes).map(node).filter(function(n){
    return richToPlain(n.summary||'').toLowerCase().indexOf(ql)!==-1 || richToPlain(n.detail||'').toLowerCase().indexOf(ql)!==-1;
  });

    var d = document.createElement('div'); d.className='sr-detail'; d.innerHTML=highlight(richToPlain(n.detail), q);
    item.appendChild(s); item.appendChild(d);

      if(ev.altKey){ altActivateSearchResult(n); return; }
      if(ev.ctrlKey){

        // 0,0 since there's no real cursor position — anchor the popover
        // off the item's own on-screen rect in that case instead.
        var cx = ev.clientX, cy = ev.clientY;
