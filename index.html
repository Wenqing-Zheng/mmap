<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空间思维导图</title>
<style>
  :root{
    --rail-w:64px;
    --bg:#f3f4f7;
    --canvas-bg:#f3f4f7;
    --panel-bg:#ffffff;
    --panel-border:#e3e5ea;
    --text-main:#20222b;
    --text-dim:#7a7f8c;
    --accent:#4361ee;
    --accent-glow:rgba(67,97,238,.35);
    --divider:#c7cbd6;
    --shadow:0 10px 30px rgba(20,20,30,.10);
    --node-shadow:0 1px 3px rgba(20,20,30,.08);
  }
  html[data-theme="dark"]{
    --bg:#181a20;
    --canvas-bg:#181a20;
    --panel-bg:#20222a;
    --panel-border:#33363f;
    --text-main:#e7e9ee;
    --text-dim:#8b8f9c;
    --accent:#6c8dfb;
    --accent-glow:rgba(108,141,251,.4);
    --divider:#454955;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --node-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  html[data-theme="deepblue"]{
    --bg:#0b1226;
    --canvas-bg:#0b1226;
    --panel-bg:#121b38;
    --panel-border:#22305c;
    --text-main:#dce4f7;
    --text-dim:#8496c4;
    --accent:#5b8dff;
    --accent-glow:rgba(91,141,255,.4);
    --divider:#2c3c6b;
    --shadow:0 10px 30px rgba(0,0,10,.55);
    --node-shadow:0 1px 4px rgba(0,0,10,.5);
  }
  html[data-theme="graphite"]{
    --bg:#1c1c1e;
    --canvas-bg:#1c1c1e;
    --panel-bg:#262628;
    --panel-border:#3a3a3d;
    --text-main:#eaeaec;
    --text-dim:#9a9a9e;
    --accent:#9a9aa5;
    --accent-glow:rgba(154,154,165,.4);
    --divider:#48484b;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --node-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  html[data-theme="vscode"]{
    --bg:#1e1e1e;
    --canvas-bg:#1e1e1e;
    --panel-bg:#252526;
    --panel-border:#3c3c3c;
    --text-main:#d4d4d4;
    --text-dim:#858585;
    --accent:#569cd6;
    --accent-glow:rgba(86,156,214,.4);
    --divider:#3c3c3c;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --node-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  html[data-theme="hicontrast"]{
    --bg:#000000;
    --canvas-bg:#000000;
    --panel-bg:#0a0a0a;
    --panel-border:#ffffff;
    --text-main:#ffffff;
    --text-dim:#c8c8c8;
    --accent:#ffd60a;
    --accent-glow:rgba(255,214,10,.5);
    --divider:#ffffff;
    --shadow:0 0 0 rgba(0,0,0,0);
    --node-shadow:0 0 0 1px rgba(255,255,255,.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text-main);}
  #app{position:absolute;inset:0;display:flex;}

  /* ---------- side rail ---------- */
  #rail{
    width:var(--rail-w);flex-shrink:0;height:100%;background:var(--panel-bg);border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;align-items:center;padding:calc(var(--rail-w)*0.22) 0;gap:calc(var(--rail-w)*0.125);
    z-index:500;user-select:none;position:relative;
  }
  .rail-btn{
    width:calc(var(--rail-w)*0.625);height:calc(var(--rail-w)*0.625);border-radius:calc(var(--rail-w)*0.1875);
    border:1px solid transparent;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-main);
    font-size:calc(var(--rail-w)*0.266);transition:background .12s,border-color .12s;flex-shrink:0;
  }
  .rail-btn svg{display:block;flex-shrink:0;width:calc(var(--rail-w)*0.3125);height:calc(var(--rail-w)*0.3125);}
  .rail-btn:hover{background:rgba(120,130,160,.12);}
  .rail-btn.active{background:var(--accent);color:#fff;}
  /* one-tier <N> depth control, replacing the old params-panel ＋/－/♻️
     trio — "默认最大可视深度变成一级控制板...用类似<|>的符号,按钮左侧表示
     -1,中间表示刷新,右侧表示+1". Same overall footprint as a .rail-btn so
     it sits naturally at slot 3 of the rail, but internally split into 3
     independently-clickable thirds (< / number / >) instead of one single
     button target. */
  #railDepthCtl{
    width:calc(var(--rail-w)*0.625);height:calc(var(--rail-w)*0.625);border-radius:calc(var(--rail-w)*0.1875);
    display:flex;align-items:stretch;justify-content:center;overflow:hidden;
    border:1px solid var(--panel-border);flex-shrink:0;user-select:none;
  }
  #railDepthCtl > div{
    flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-main);transition:background .1s;font-size:calc(var(--rail-w)*0.2);
  }
  #railDepthCtl > div:hover{background:rgba(120,130,160,.12);}
  /* pressed-state shadow feedback — "用阴影指示按在哪里" — an inset shadow
     reads as "this exact third is currently being pressed" without
     depending on :active alone (added/removed explicitly on mousedown/up
     in JS so a mouse that drags off the button before releasing doesn't
     leave a stuck-looking shadow behind). */
  #railDepthCtl > div.pressed{box-shadow:inset 0 0 0 2px var(--accent), inset 0 2px 5px rgba(0,0,0,.25);background:rgba(120,130,160,.18);}
  #railDepthMinus{font-size:calc(var(--rail-w)*0.28);font-weight:700;}
  #railDepthPlus{font-size:calc(var(--rail-w)*0.28);font-weight:700;}
  #railDepthValue{font-size:calc(var(--rail-w)*0.19);font-weight:700;}
  /* mobile toolbar: Shift/Ctrl/Option/Cmd modifier toggles + Enter + Esc +
     4 arrow keys + a drag-pickup toggle, all as touch-sized buttons —
     "手机模式...允许在手机上模拟键盘多个案件联合按下这些组合快捷键". A flat
     row (not a column grid) since mobile mode moves the whole rail to the
     BOTTOM of the screen and wraps it onto multiple rows so every icon is
     visible at once — see the html.mobile-mode block near the end of this
     stylesheet for the bottom-bar layout itself; this block only styles
     the individual keys so they look right inside that wrapping row.
     Entirely inert on desktop: #mobileToolbar only renders (display:flex)
     under html.mobile-mode, so none of this competes with #rail's normal
     vertical layout. */
  #mobileToolbar{display:none;}
  html.mobile-mode #mobileToolbar{
    display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:6px;width:100%;padding:6px 4px;
  }
  .mobile-key{
    display:flex;align-items:center;justify-content:center;user-select:none;
    border-radius:8px;border:1px solid var(--panel-border);background:var(--bg);
    color:var(--text-main);cursor:pointer;transition:background .1s;
    width:38px;height:38px;font-size:16px;flex-shrink:0;
  }
  .mobile-key:hover{background:rgba(120,130,160,.12);}
  /* a modifier toggle STAYS pressed/highlighted after being tapped (unlike
     a real keyboard's momentary hold) — since touch has no "hold this key
     down while tapping another" gesture, tapping a modifier instead ARMS
     it for the NEXT key/arrow/click/node-tap, then the modifier set is
     consumed and cleared right after that tap fires — see
     dispatchMobileKey's own comment. */
  .mod-key.armed{background:var(--accent);color:#fff;border-color:var(--accent);}
  /* drag-pickup toggle: tap once to arm ("拖拽" mode active, highlighted),
     tap a node to pick it up (armed state now means "carrying a node"),
     tap again (or tap blank canvas) to drop it at the current position —
     "点击拖拽键→点节点拾取→移动→再点拖拽键放下". The stronger inset ring
     (.carrying) distinguishes "armed, waiting for a node" from "actively
     carrying one" — see startMobileDragPickup. */
  #mobileDragKey.armed{background:var(--accent);color:#fff;border-color:var(--accent);}
  #mobileDragKey.carrying{box-shadow:inset 0 0 0 2px #fff;}
  .rail-sep{width:calc(var(--rail-w)*0.5);height:1px;background:var(--panel-border);margin:6px 0;flex-shrink:0;}
  .rail-spacer{flex:1;}
  #railPinnedZone{
    display:flex;flex-direction:column;align-items:center;gap:calc(var(--rail-w)*0.125);
    width:100%;min-height:8px;
  }
  #railPinnedZone.drag-over{background:rgba(67,97,238,.12);border-radius:8px;}
  .rail-btn.rail-pinned{
    font-size:calc(var(--rail-w)*0.13);font-weight:700;letter-spacing:-.2px;
    white-space:normal;word-break:break-all;line-height:1.15;text-align:center;
    padding:2px;overflow:hidden;
  }
  #fileInput{display:none;}
  #railResizer{
    position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:ew-resize;z-index:520;
  }
  #railResizer:hover, #railResizer.dragging{background:rgba(67,97,238,.25);}

  /* ---------- search flyout ---------- */
  #searchFlyout{
    position:absolute;left:var(--rail-w);top:0;height:100%;width:280px;background:var(--panel-bg);
    border-right:1px solid var(--panel-border);box-shadow:var(--shadow);z-index:600;
    transform:translateX(calc(-1*(var(--rail-w) + 280px)));transition:transform .16s ease;display:flex;flex-direction:column;
  }
  #searchFlyout.open{transform:translateX(0);}
  #searchFlyout .sf-head{padding:16px 14px 10px;}
  #searchInput{
    width:100%;height:34px;border-radius:10px;border:1px solid var(--panel-border);background:var(--bg);
    color:var(--text-main);padding:0 12px;font-size:13px;outline:none;
  }
  #searchInput:focus{border-color:var(--accent);}
  #searchResults{flex:1;overflow:auto;padding:6px 8px;}
  .sr-item{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--text-main);margin-bottom:2px;}
  .sr-item:hover, .sr-item.sr-active{background:rgba(120,130,160,.14);}
  .sr-item .sr-summary{font-weight:600;margin-bottom:2px;}
  .sr-item .sr-detail{color:var(--text-dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-hit{background:rgba(67,97,238,.25);border-radius:2px;}

  /* ---------- tree flyout ---------- */
  #treeFlyout{
    position:absolute;left:var(--rail-w);top:0;height:100%;width:340px;background:var(--panel-bg);
    border-right:1px solid var(--panel-border);box-shadow:var(--shadow);z-index:600;
    transform:translateX(calc(-1*(var(--rail-w) + 340px)));transition:transform .16s ease;display:flex;flex-direction:column;
  }
  #treeFlyout.open{transform:translateX(0);}
  #treeFlyout .tf-head{padding:14px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--panel-border);}
  #treeList{position:relative;flex:1;overflow:auto;padding:8px;}
  .tv-row{
    display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;
    font-size:12.5px;color:var(--text-main);white-space:nowrap;position:relative;
  }
  .tv-row:hover{background:rgba(120,130,160,.14);}
  .tv-row.tv-selected{background:rgba(67,97,238,.16);}
  .tv-row:focus{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(67,97,238,.1);}
  .tv-row .tv-summary{overflow:hidden;text-overflow:ellipsis;}
  .tv-row .tv-vis-dim{color:var(--text-dim);font-size:10.5px;flex-shrink:0;}
  .tv-row .tv-cat-tag{
    color:#fff;font-size:9.5px;font-weight:700;flex-shrink:0;
    padding:1px 5px;border-radius:5px;letter-spacing:.2px;
  }
  .tv-row .tv-cat-tag[data-cat="A"]{background:#4361ee;}
  .tv-row .tv-cat-tag[data-cat="B"]{background:#d1495b;}
  .tv-row .tv-cat-tag[data-cat="C"]{background:#e0a734;color:#3a2e08;}
  .tv-row .tv-star{
    color:var(--accent);font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;margin-left:2px;
  }
  .tv-row .tv-star:hover{opacity:.7;}
  .tv-drop-line{
    position:absolute;left:8px;right:8px;height:0;border-top:2px dashed var(--accent);
    display:none;pointer-events:none;
  }
  .tv-drop-line.show{display:block;}
  .tv-row.tv-drop-inside{outline:1.5px dashed var(--accent);background:rgba(67,97,238,.1);}
  .tv-row.tv-dragging{opacity:.4;}

  /* ---------- params flyout ---------- */
  #paramsFlyout{
    position:absolute;left:var(--rail-w);top:0;height:100%;width:280px;background:var(--panel-bg);
    border-right:1px solid var(--panel-border);box-shadow:var(--shadow);z-index:600;
    transform:translateX(calc(-1*(var(--rail-w) + 280px)));transition:transform .16s ease;display:flex;flex-direction:column;overflow-y:auto;
  }
  #paramsFlyout.open{transform:translateX(0);}
  .param-block{padding:16px 14px;border-bottom:1px solid var(--panel-border);}
  .param-label{font-size:12.5px;color:var(--text-main);font-weight:600;margin-bottom:10px;}
  .param-stepper{display:flex;align-items:center;gap:10px;}
  .param-stepper span{font-size:13px;color:var(--text-main);font-weight:600;min-width:36px;text-align:center;}
  .mini-btn{
    width:26px;height:26px;border-radius:8px;border:1px solid var(--panel-border);background:var(--bg);
    color:var(--text-main);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .mini-btn:hover{background:rgba(120,130,160,.14);}
  .mini-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #relaxSlider{width:100%;accent-color:var(--accent);}
  /* small per-button caption under each "重置位置" icon, so what each of
     the three visually-identical-looking mini-btns actually does doesn't
     rely on hovering for a title tooltip alone. */
  .reset-btn-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .reset-btn-caption{font-size:9px;line-height:1.15;color:var(--text-dim);text-align:center;white-space:nowrap;}

  /* ---------- random-pick flyout ---------- */
  #randomFlyout{
    position:absolute;left:var(--rail-w);top:0;height:100%;width:300px;background:var(--panel-bg);
    border-right:1px solid var(--panel-border);box-shadow:var(--shadow);z-index:600;
    transform:translateX(calc(-1*(var(--rail-w) + 300px)));transition:transform .16s ease;display:flex;flex-direction:column;overflow-y:auto;
  }
  #randomFlyout.open{transform:translateX(0);}
  #randomFormulaInput{
    width:100%;border:1px solid var(--panel-border);border-radius:8px;background:var(--bg);color:var(--text-main);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;padding:8px;resize:vertical;outline:none;
    box-sizing:border-box;
  }
  #randomFormulaInput:focus{border-color:var(--accent);}
  #randomFormulaWrap{position:relative;}
  /* small status dot, bottom-right corner of the formula textarea — real-time
     syntax/runtime validity indicator: yellow = current text throws or
     returns something that isn't a usable non-negative number (the LAST
     valid formula stays active in state.randomFormula, untouched); green =
     current text is valid AND has already been applied to state. Updated
     on every keystroke (not just on blur), plus once more on blur/change
     to also cover non-keystroke edits (paste, etc.) — "输入框右下角有一个
     小圆圈,黄色表示有问题,绿色表示正确并已经应用...失焦时候也要实时更新
     小圆圈状态". */
  #randomFormulaDot{
    position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;
    box-shadow:0 0 0 2px var(--panel-bg);pointer-events:none;
  }
  #randomFormulaDot.valid{background:#2ea88a;}
  #randomFormulaDot.invalid{background:#e0a734;}
  #randomButtonList{padding:8px 10px;display:flex;flex-direction:column;gap:8px;}
  .rb-item{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--panel-border);
    background:var(--bg);
  }
  .rb-item.rb-ghost{border-style:dashed;opacity:.7;}
  .rb-item .rb-name{flex:1;font-size:12.5px;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .rb-item .rb-count{font-size:10.5px;color:var(--text-dim);flex-shrink:0;}
  .rb-plus{
    width:24px;height:24px;border-radius:7px;border:1px dashed var(--panel-border);background:transparent;
    color:var(--text-dim);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .rb-plus:hover{background:rgba(120,130,160,.14);}

  /* ---------- random-button materialize dialog (name + tree picker) ---------- */
  #rbMaterializeOverlay{
    position:fixed;inset:0;background:rgba(20,22,30,.28);z-index:3000;display:none;align-items:center;justify-content:center;
  }
  #rbMaterializeOverlay.show{display:flex;}
  #rbMaterializeDialog{
    width:380px;max-height:70vh;display:flex;flex-direction:column;background:var(--panel-bg);border-radius:16px;
    box-shadow:var(--shadow);padding:18px;
  }
  #rbNameInput{
    width:100%;border:1px solid var(--panel-border);border-radius:10px;padding:8px 11px;font-size:13px;
    background:var(--bg);color:var(--text-main);outline:none;margin-bottom:10px;font-family:inherit;
  }
  #rbNameInput:focus{border-color:var(--accent);}
  #rbTreePicker{flex:1;overflow:auto;border:1px solid var(--panel-border);border-radius:10px;padding:6px;margin-bottom:12px;}
  .rbt-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:12px;color:var(--text-main);}
  .rbt-row:hover{background:rgba(120,130,160,.1);}
  .rbt-row input{margin:0;flex-shrink:0;}
  .rbt-row .rbt-cat{font-size:10px;color:var(--text-dim);flex-shrink:0;}
  #rbMaterializeDialog .id-row{display:flex;justify-content:space-between;align-items:center;}

  /* ---------- canvas ---------- */
  #canvasWrap{position:relative;flex:1;overflow:hidden;background:var(--canvas-bg);cursor:grab;}
  #canvasWrap.panning{cursor:grabbing;}
  #stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

  /* size-gauge ("thermometer"): shown briefly to the right of every visible
     node while ⌘+/⌘- is actively adjusting size (single-node sizeLevel or
     the global font scale) — see triggerSizeGauge(). Sits just outside the
     node's own right edge, unaffected by camera.scale since it's a fixed
     on-screen width regardless of node size. */
  .mm-size-gauge{
    position:absolute;top:50%;left:100%;transform:translate(6px,-50%);width:7px;height:64px;
    border-radius:4px;background:rgba(120,130,160,.22);overflow:hidden;pointer-events:none;z-index:15;
  }
  .mm-size-gauge .mm-size-gauge-fill{
    position:absolute;bottom:0;left:0;width:100%;background:var(--accent);border-radius:4px;
    transition:height .12s ease;
  }

  /* ---------- node containers ---------- */
  .mm-node{
    position:absolute;display:flex;flex-direction:column;align-items:center;
    transition:box-shadow .18s ease;
  }
  .mm-node.dragging{transition:none;z-index:80;}
  /* real-boundary debug outline: shown on EVERY sibling in a container while
     any one of its children is being dragged — a plain dashed rect at each
     node's ACTUAL bounding box (the exact box computeCrowdScale operates
     on), so it's visible how close two nodes really are irrespective of
     their visual circle/ellipse shape. See buildContainerTree's
     sizeGaugeVisible-style wiring. */
  .mm-hitbox-debug{
    position:absolute;inset:0;border:1.5px dashed rgba(220,50,50,.65);
    pointer-events:none;box-sizing:border-box;z-index:14;
  }
  /* growth-capped container interior — see buildContainerTree. Built and
     laid out at its natural (uncapped) size, then scaled down as a single
     unit via inline transform:scale() so every descendant (frame, chip,
     children ring, borders, text) shrinks together as true vector
     content, never stretched/distorted since scaleX===scaleY always. */
  .mm-miniature-inner{position:absolute;top:0;left:0;transform-origin:0 0;}
  .mm-frame{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--node-fill,var(--panel-bg));box-shadow:var(--node-shadow);
  }
  .mm-node.is-container .mm-miniature-inner > .mm-frame,
  .mm-node.is-container > .mm-frame{align-items:flex-start;justify-content:flex-start;}
  .mm-border-svg{position:absolute;inset:0;overflow:visible;pointer-events:none;}
  .mm-border-svg path{fill:none;}

  .mm-selected > .mm-frame, .mm-selected > .mm-miniature-inner > .mm-frame{outline:2.5px solid var(--accent);outline-offset:1px;}
  .mm-glow > .mm-frame, .mm-glow > .mm-miniature-inner > .mm-frame{box-shadow:0 0 0 6px var(--accent-glow),var(--node-shadow);}

  .mm-chip{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);max-width:88%;min-width:60px;
    background:var(--node-border,var(--accent));color:#fff;font-size:11.5px;font-weight:600;
    padding:0.35em 1.05em;border-radius:0.87em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 2px 5px rgba(0,0,0,.18);letter-spacing:.2px;cursor:pointer;
    display:flex;align-items:center;gap:0.7em;
  }
  /* previously the visible-area root had its own ROOT_MARGIN inset frame and
     needed a special chip offset to match; now the root is sized and framed
     exactly like any other drilled container (see containerSize()), so its
     chip uses the same top:-14px rule as every other container — no
     override needed here. */
  .mm-chip .mm-chip-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mm-chip .mm-chip-divider{width:1px;align-self:stretch;background:rgba(255,255,255,.55);flex-shrink:0;}
  .mm-chip .mm-chip-detail{
    font-weight:400;color:rgba(255,255,255,.92);white-space:normal;max-width:280px;
    text-align:left;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .mm-chip.mm-chip-hidden{min-width:34px;height:12px;padding:4px;opacity:.55;}

  .mm-expand-star{
    position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
    background:var(--node-border,var(--accent));color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;
    box-shadow:0 2px 5px rgba(0,0,0,.22);user-select:none;
  }
  .mm-expand-star:hover{filter:brightness(1.12);}

  /* top-left category badge, symmetric with the top-right expand star —
     only rendered while category-edit mode is active (see toggleCategoryEditMode) */
  .mm-cat-badge{
    position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;
    background:#555;color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:11;
    box-shadow:0 2px 5px rgba(0,0,0,.22);user-select:none;
  }
  .mm-cat-badge[data-cat="A"]{background:#4361ee;}
  .mm-cat-badge[data-cat="B"]{background:#2ea88a;}
  .mm-cat-badge[data-cat="C"]{background:#e0895c;}
  .mm-cat-badge:hover{filter:brightness(1.12);}

  /* masterLevel ("M1".."M5") badge, immediately to the right of the ABC
     badge — same size/shape, only rendered for category==='B' nodes while
     category-edit mode is active (see buildMasterBadge). */
  .mm-master-badge{
    position:absolute;top:-8px;left:18px;width:22px;height:22px;border-radius:50%;
    background:#8e44ad;color:#fff;font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:11;
    box-shadow:0 2px 5px rgba(0,0,0,.22);user-select:none;
  }
  .mm-master-badge:hover{filter:brightness(1.12);}
  html.cat-edit-mode #canvasWrap{cursor:pointer;}

  .mm-content{
    display:flex;align-items:stretch;justify-content:center;width:100%;height:100%;overflow:hidden;box-sizing:border-box;
  }
  .mm-summary-only{
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    text-align:center;color:var(--text-main);word-break:break-word;line-height:1.28;overflow:hidden;
  }
  .mm-split{display:flex;align-items:stretch;width:100%;height:100%;}
  .mm-summary{
    display:flex;align-items:center;justify-content:center;text-align:center;
    white-space:nowrap;overflow:hidden;color:var(--text-main);line-height:1.25;padding-right:4px;
  }
  .mm-divider{width:1px;background:var(--divider);flex-shrink:0;margin:2px 0;}
  .mm-detail{
    flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    overflow:hidden;color:var(--text-dim);line-height:1.3;padding:0 8px;word-break:break-word;
  }
  .mm-editing{outline:none;background:rgba(67,97,238,.06);border-radius:4px;}

  .mm-children-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .mm-children-layer > .mm-node{pointer-events:auto;}

  /* placeholder empty text */
  .mm-empty-ph{color:#b6bac4;}

  /* ---------- style popover ---------- */
  .pop{
    position:fixed;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;
    box-shadow:var(--shadow);padding:14px;z-index:2000;min-width:236px;font-size:12.5px;color:var(--text-main);
  }
  .pop h5{margin:0 0 8px;font-size:11px;color:var(--text-dim);font-weight:600;letter-spacing:.4px;}
  .pop-section{margin-bottom:12px;}
  .pop-section:last-of-type{margin-bottom:0;}
  .pop .row{display:flex;gap:7px;margin-bottom:0;flex-wrap:wrap;align-items:center;}
  .swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
  .swatch.sel{border-color:var(--text-main);}
  .bstyle-btn{
    width:44px;height:28px;border-radius:7px;border:1px solid var(--panel-border);background:var(--bg);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .bstyle-btn.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .bstyle-btn svg{width:36px;height:18px;}
  .pop-lines-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .pop-lines-row .param-stepper{display:flex;align-items:center;gap:8px;}
  .pop-lines-row .param-stepper span{font-size:12.5px;color:var(--text-main);font-weight:600;min-width:14px;text-align:center;}
  .pop-lines-label{font-size:11px;color:var(--text-dim);}
  .pop-del{
    width:100%;text-align:left;border:none;background:transparent;color:#d1495b;font-size:12px;
    padding:7px 6px;border-radius:7px;cursor:pointer;margin-top:10px;
  }
  .pop-del:hover{background:rgba(209,73,91,.12);}

  /* small context menu (right-click on a materialized random-pick button) */
  .ctx-menu{
    position:fixed;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:10px;
    box-shadow:var(--shadow);padding:5px;z-index:2000;min-width:150px;font-size:12.5px;color:var(--text-main);
  }
  .ctx-menu-item{
    width:100%;text-align:left;border:none;background:transparent;color:var(--text-main);font-size:12.5px;
    padding:7px 9px;border-radius:7px;cursor:pointer;display:block;
  }
  .ctx-menu-item:hover{background:rgba(120,130,160,.14);}
  .ctx-menu-item.danger{color:#d1495b;}
  .ctx-menu-item.danger:hover{background:rgba(209,73,91,.12);}

  /* ---------- insert dialog ---------- */
  #insertOverlay{
    position:fixed;inset:0;background:rgba(20,22,30,.28);z-index:3000;display:none;
    align-items:center;justify-content:center;
  }
  #insertOverlay.show{display:flex;}
  #insertDialog{
    width:420px;background:var(--panel-bg);border-radius:16px;box-shadow:var(--shadow);padding:18px;
    position:relative;
  }
  /* batch-insert indicator: only shown while pendingInsert.batch is true —
     ⌘Enter keeps this dialog cycling open for the next sibling/child
     instead of closing, and without SOME visible marker that was
     otherwise indistinguishable from a plain single-insert dialog (once
     the old keyboard-hint text was removed), repeatedly pressing ⌘Enter
     looked like "nothing is happening" even though each press WAS
     inserting a node. */
  #insertBatchBadge{
    position:absolute;top:-11px;left:18px;background:var(--accent);color:#fff;font-size:10.5px;
    font-weight:700;padding:3px 10px;border-radius:9px;display:none;letter-spacing:.3px;
  }
  #insertBatchBadge.show{display:block;}
  #insertDialog .id-label{font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:6px;letter-spacing:.4px;}
  #insertSummary{
    width:100%;border:1px solid var(--panel-border);border-radius:10px;padding:9px 11px;font-size:14px;
    background:var(--bg);color:var(--text-main);outline:none;margin-bottom:12px;font-family:inherit;
    white-space:nowrap;overflow-x:auto;
  }
  #insertSummary:empty::before{content:attr(data-ph);color:#b6bac4;}
  #insertSummary:focus{border-color:var(--accent);}
  #insertDetail{
    width:100%;min-height:74px;max-height:220px;overflow-y:auto;border:1px solid var(--panel-border);border-radius:10px;
    padding:9px 11px;font-size:13px;background:var(--bg);color:var(--text-main);outline:none;font-family:inherit;
    margin-bottom:12px;white-space:pre-wrap;
  }
  #insertDetail:empty::before{content:attr(data-ph);color:#b6bac4;}
  #insertDetail:focus{border-color:var(--accent);}
  .id-cat-row{display:flex;gap:8px;margin-bottom:12px;}
  .id-cat-btn{
    width:36px;height:30px;border-radius:8px;border:1px solid var(--panel-border);background:var(--bg);
    color:var(--text-main);cursor:pointer;font-size:13px;font-weight:700;
  }
  .id-cat-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  #insertDialog .id-row{display:flex;justify-content:space-between;align-items:center;}
  #insertHintTxt{font-size:11px;color:var(--text-dim);}
  #insertDialog .id-actions{display:flex;gap:8px;}
  .id-btn{border:none;border-radius:9px;padding:7px 15px;font-size:12.5px;cursor:pointer;}
  .id-btn.primary{background:var(--accent);color:#fff;}
  .id-btn.plain{background:rgba(120,130,160,.14);color:var(--text-main);}

  /* ---------- mobile mode: bottom nav bar + bottom-sheet flyouts ----------
     Everything below is gated under html.mobile-mode (toggled by
     applyMobileMode, see the "手机模式" params-panel button) so desktop's
     left-rail / left-sliding-flyout layout is completely untouched when
     the class is absent — same scoping precedent as html.cat-edit-mode
     elsewhere in this file. "导航栏从左侧变成底部...多排展开导航栏图标，
     可以一次看见全部...搜索框/tree view/布局设置都改成从下面往上弹出一个
     固定长度的区域". */
  html.mobile-mode #app{flex-direction:column;}
  html.mobile-mode #canvasWrap{order:1;}
  html.mobile-mode #rail{
    order:2;width:100%;height:auto;max-height:38vh;flex-direction:row;flex-wrap:wrap;
    align-items:center;justify-content:center;gap:6px;padding:8px;
    border-right:none;border-top:1px solid var(--panel-border);overflow-y:auto;
  }
  html.mobile-mode #rail .rail-btn{width:40px;height:40px;border-radius:9px;font-size:15px;}
  html.mobile-mode #rail .rail-btn svg{width:19px;height:19px;}
  html.mobile-mode .rail-sep{width:1px;height:26px;margin:0 4px;}
  /* .rail-spacer only exists to push the theme button to the bottom of a
     vertical column — meaningless (and would eat a whole flex-wrap row)
     once the rail is a horizontal wrapping bar, so it's simply hidden. */
  html.mobile-mode .rail-spacer{display:none;}
  html.mobile-mode #railResizer{display:none;}
  html.mobile-mode #railPinnedZone{flex-direction:row;flex-wrap:wrap;width:auto;min-height:0;}

  /* fixed-height bottom sheets sliding up from the bottom, instead of the
     desktop panels' left-slide-in — "照顾手机竖屏". Sheets sit above the
     bottom nav bar (z-index already 600 on all four) so opening one just
     covers the bar, matching common mobile bottom-sheet conventions. Each
     flyout's own scrollable inner list (#searchResults/#treeList/
     #paramsFlyout itself all already have flex:1 or overflow-y:auto from
     their desktop rules) keeps working unchanged inside the new fixed
     height — "如果列表太长，滚动显示". */
  html.mobile-mode #searchFlyout, html.mobile-mode #treeFlyout,
  html.mobile-mode #paramsFlyout, html.mobile-mode #randomFlyout{
    left:0;right:0;top:auto;bottom:0;width:100%;height:56vh;max-height:56vh;
    border-right:none;border-top:1px solid var(--panel-border);border-radius:14px 14px 0 0;
    transform:translateY(100%);
  }
  html.mobile-mode #searchFlyout.open, html.mobile-mode #treeFlyout.open,
  html.mobile-mode #paramsFlyout.open, html.mobile-mode #randomFlyout.open{
    transform:translateY(0);
  }

  /* params-panel re-layout: tighter padding + smaller type so the same
     content fits comfortably in the shorter bottom-sheet height —
     "布局设置区域重新排版（文字可以进一步精简和字体变小）". Label text
     itself is swapped for a shortened string at runtime (see
     applyMobileMode's data-mobile/data-full swap) rather than duplicated
     here, so the underlying desktop text is preserved byte-for-byte when
     mobile mode is off. */
  html.mobile-mode #paramsFlyout .param-block{padding:10px 12px;}
  html.mobile-mode #paramsFlyout .param-label{font-size:11px;margin-bottom:6px;}
  html.mobile-mode #paramsFlyout .param-stepper{gap:6px;}
  html.mobile-mode #paramsFlyout .param-stepper span{font-size:11px;min-width:28px;}
  html.mobile-mode #paramsFlyout .mini-btn{width:24px;height:24px;font-size:12px;border-radius:7px;}
  html.mobile-mode .reset-btn-caption{font-size:8px;}
</style>
</head>
<body>

<div id="app">
  <div id="rail">
    <button class="rail-btn" id="btnSearch" title="搜索">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
    </button>
    <button class="rail-btn" id="btnTree" title="树状视图">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M7 6h6a3 3 0 0 1 3 3v0"/><path d="M7 18h6a3 3 0 0 0 3-3v0"/></svg>
    </button>
    <div id="mobileToolbar">
      <div class="mobile-key mod-key" data-mod="shift" title="Shift">⇧</div>
      <div class="mobile-key mod-key" data-mod="ctrl" title="Control">⌃</div>
      <div class="mobile-key mod-key" data-mod="alt" title="Option">⌥</div>
      <div class="mobile-key mod-key" data-mod="meta" title="Command">⌘</div>
      <div class="mobile-key" id="mobileEnterKey" title="Enter">⏎</div>
      <div class="mobile-key" id="mobileArrowUp" data-arrow="ArrowUp" title="↑">▲</div>
      <div class="mobile-key" id="mobileArrowDown" data-arrow="ArrowDown" title="↓">▼</div>
      <div class="mobile-key" id="mobileArrowLeft" data-arrow="ArrowLeft" title="←">◀</div>
      <div class="mobile-key" id="mobileArrowRight" data-arrow="ArrowRight" title="→">▶</div>
      <div class="mobile-key" id="mobileDragKey" title="拖拽：点一下拾取节点，再点一下放下">✋</div>
      <div class="mobile-key" id="mobileEscKey" title="Esc">⎋</div>
    </div>
    <div id="railDepthCtl" title="默认最大可视深度">
      <div id="railDepthMinus">‹</div>
      <div id="railDepthValue">2</div>
      <div id="railDepthPlus">›</div>
    </div>
    <button class="rail-btn" id="btnParams" title="布局参数">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M20 18h0"/><circle cx="16" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="btnRandom" title="随机选一">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
    <div id="railPinnedZone"></div>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="btnTheme" title="切换主题">
      <svg id="themeIconMoon" viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M20.5 14.4a8.5 8.5 0 1 1-9.9-13 9 9 0 1 0 9.9 13z"/></svg>
      <svg id="themeIconSun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg id="themeIconPalette" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M12 3a9 8.5 0 1 0 0 17c1 0 1.2-1 .6-1.6-.6-.6-.4-1.6.6-1.6h2A4.8 4.8 0 0 0 20 12 9 9 0 0 0 12 3z"/>
        <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="7.8" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="16.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div id="railResizer" title="拖拽调整导航栏宽度"></div>
  </div>

  <div id="searchFlyout">
    <div class="sf-head"><input id="searchInput" type="text" placeholder="搜索节点 summary / detail…"></div>
    <div id="searchResults"></div>
  </div>

  <div id="treeFlyout">
    <div class="tf-head">树状视图 · 双击节点以其为根显示子树 · 拖拽移动子树</div>
    <div id="treeList"></div>
  </div>

  <div id="randomFlyout">
    <div class="param-block">
      <div class="param-label">概率公式</div>
      <div id="randomFormulaWrap">
        <textarea id="randomFormulaInput" rows="2" spellcheck="false"></textarea>
        <div id="randomFormulaDot"></div>
      </div>
    </div>
    <div id="randomButtonList"></div>
  </div>

  <div id="paramsFlyout">
    <div class="param-block">
      <div class="param-label">重置位置</div>
      <div class="param-stepper" style="flex-wrap:wrap;align-items:flex-start;">
        <div class="reset-btn-col">
          <button class="mini-btn" id="btnResetVisibleSizes" title="重置当前可见区域根节点的直接子节点的大小和位置，按数量分布为对称图形（不影响更深层子节点，也不影响其自身不可见的祖先）">⭕️</button>
          <div class="reset-btn-caption">局部重排<br>大小+位置</div>
        </div>
        <div class="reset-btn-col">
          <button class="mini-btn" id="btnResetAllSizes" title="重置整棵树所有节点的大小，并把每一层子节点按数量重新分布为对称图形（弹窗确认）">💣</button>
          <div class="reset-btn-caption">全树重排<br>大小+位置</div>
        </div>
        <div class="reset-btn-col">
          <button class="mini-btn" id="btnCenterVisibleChildren" title="把当前可见区域根节点的一级孩子整体平移到居中位置，母节点边框收紧到刚好包裹所有孩子并留一圈均匀间隙（不改变孩子之间的相对位置和相对大小，不影响二级及更深层节点）">🎯</button>
          <div class="reset-btn-caption">仅居中<br>不改大小</div>
        </div>
      </div>
    </div>
    <div class="param-block">
      <div class="param-label" data-mobile="重叠避免度">同级节点避免覆盖程度</div>
      <input type="range" id="relaxSlider" min="0" max="100" step="1">
    </div>
    <div class="param-block">
      <div class="param-label" data-mobile="字体大小">全局默认字体大小（相对形状）</div>
      <div class="param-stepper">
        <button class="mini-btn" id="fontScaleMinus">－</button>
        <span id="fontScaleValue">3.0×</span>
        <button class="mini-btn" id="fontScalePlus">＋</button>
      </div>
    </div>
    <div class="param-block">
      <div class="param-label" data-mobile="⌘＊展开层数">⌘点击＊一次性展开子树的最大层数</div>
      <div class="param-stepper">
        <button class="mini-btn" id="expandCapMinus">－</button>
        <span id="expandCapValue">5</span>
        <button class="mini-btn" id="expandCapPlus">＋</button>
      </div>
    </div>
    <div class="param-block">
      <div class="param-label">导入导出</div>
      <div class="param-stepper" style="flex-wrap:wrap;">
        <button class="mini-btn" id="btnImport" title="导入 JSON">🚢</button>
        <button class="mini-btn" id="btnExport" title="导出 JSON">🚁</button>
      </div>
      <input type="file" id="fileInput" accept="application/json">
    </div>
    <div class="param-block">
      <div class="param-label">全局视野</div>
      <div class="param-stepper" style="flex-wrap:wrap;">
        <button class="mini-btn" id="btnFit" title="回到全局">⛩</button>
      </div>
    </div>
    <div class="param-block">
      <div class="param-label">手机模式</div>
      <div class="param-stepper" style="flex-wrap:wrap;">
        <button class="mini-btn" id="btnMobileMode" title="导航栏移到底部，加入 Shift/Ctrl/Option/Cmd/Enter/Esc/方向键/拖拽 触屏按钮，面板改为从底部弹出">📱</button>
      </div>
    </div>
  </div>

  <div id="canvasWrap">
    <div id="stage"></div>
  </div>
</div>

<div id="insertOverlay">
  <div id="insertDialog">
    <span id="insertBatchBadge">连续插入中 · ⌘Enter 插入下一个 · Esc 结束</span>
    <div class="id-label">Summary</div>
    <div id="insertSummary" contenteditable="true" data-ph="节点摘要…"></div>
    <div class="id-label">Detail</div>
    <div id="insertDetail" contenteditable="true" data-ph="节点详情…"></div>
    <div class="id-label">分类</div>
    <div class="id-cat-row" id="insertCatRow">
      <button class="id-cat-btn" data-cat="A">A</button>
      <button class="id-cat-btn" data-cat="B">B</button>
      <button class="id-cat-btn" data-cat="C">C</button>
    </div>
    <div class="id-row">
      <span id="insertHintTxt"></span>
      <div class="id-actions">
        <button class="id-btn plain" id="insertCancelBtn">取消</button>
        <button class="id-btn primary" id="insertOkBtn">确定</button>

</div>

<div id="rbMaterializeOverlay">
  <div id="rbMaterializeDialog">
    <div class="id-label">按钮名称</div>
    <input id="rbNameInput" type="text" placeholder="按钮名称…">
    <div class="id-label">选择范围（A/B 类节点，勾选后其子树自动全选）</div>
    <div id="rbTreePicker"></div>
    <div class="id-row">
      <span></span>
      <div class="id-actions">
        <button class="id-btn plain" id="rbCancelBtn">取消</button>
        <button class="id-btn primary" id="rbOkBtn">确定</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   constants
   ============================================================ */
var STORAGE_KEY = 'spatial_mindmap_v1';
var PARAMS_STORAGE_KEY = 'spatial_mindmap_params_v1';
var RAIL_W_STORAGE_KEY = 'spatial_mindmap_railw_v1';
// bumped whenever the STATE shape changes in a way old exported JSON can't
// satisfy (e.g. the sizeLevel->4-float scale migration) — IMPORT (not
// localStorage load) now requires an EXACT match rather than silently
// coercing an old/foreign file through sanitizeStateNodes' migration path,
// per "import校验严格一点,不允许import过期或错误格式": a stale-format file
// used to load with every node defaulting through the sizeLevel migration
// (or, for a node missing fields entirely, straight to whatever `||`
// fallback happened to apply), which is exactly what produced the "形状
// 变成很离谱的长方形,特别大,内容空洞" result — no error, just silently
// wrong geometry. localStorage's OWN state (loadState) still migrates
// forward normally, since that's this same session's data evolving across
// code updates, not a foreign file the user is explicitly importing.
var SCHEMA_VERSION = 2;
var RAIL_W_MIN = 48, RAIL_W_MAX = 160, RAIL_W_DEFAULT = 64;
var MIN_SCALE = 0.02, MAX_SCALE = 4;
var GLOW_MS = 30000;
var FOCUS_FIT_MARGIN = 64; // px of breathing room around the focus root when it's auto-fit to the viewport (fitCameraToRoot/minScaleForFit)
/* per-node visual scale, replacing the old single sizeLevel: every node now
   stores FOUR independent floats — scaleXNoKids/scaleYNoKids (used while
   the node is a leaf/collapsed) and scaleXKids/scaleYKids (used once it's
   drilled open, since a container's "natural" size is content-driven and
   traditionally defaulted larger). ⌘+/⌘- adjusts BOTH axes of whichever
   pair is currently active together (an isotropic zoom). SCALE_MIN/MAX
   bound the size-gauge display range ("温度计上下两端分别表示10.0和0.1")
   but the values themselves are NOT clamped to this range elsewhere —
   ⌘+/- can push a node's scale past it, per "此时已经允许超过这个范围
   （理论上缩放比例不限）". */
var SCALE_NOKIDS_DEFAULT = 1.0, SCALE_KIDS_DEFAULT = 2.0;
var SCALE_GAUGE_MIN = 0.1, SCALE_GAUGE_MAX = 10.0;
function scaleXFor(n){ return (n.drilled ? n.scaleXKids : n.scaleXNoKids); }
function scaleYFor(n){ return (n.drilled ? n.scaleYKids : n.scaleYNoKids); }

// ---- user-adjustable layout params (persisted, editable from the left rail) ----
var MAX_AUTO_DEPTH_MIN = 1, MAX_AUTO_DEPTH_MAX = 6, MAX_AUTO_DEPTH_DEFAULT = 2;
var RELAX_MIN = 0, RELAX_MAX = 1; // 0 = shrink only enough to avoid visual overlap ("避免覆盖"), 1 = shrink until nearest pair's center distance ~= 3x avg radius (see computeCrowdScale)
var GLOBAL_FONT_SCALE_DEFAULT = 3; // "3x the old default" per spec — relative font-vs-shape ratio, independent of camera zoom
var GLOBAL_FONT_SCALE_MIN = 0.5, GLOBAL_FONT_SCALE_MAX = 6;
var EXPAND_CAP_MIN = 1, EXPAND_CAP_MAX = 12, EXPAND_CAP_DEFAULT = 5;
var appParams = {
  maxAutoDepth: MAX_AUTO_DEPTH_DEFAULT,
  relaxStrength: RELAX_MIN,
  globalFontScale: GLOBAL_FONT_SCALE_DEFAULT,
  expandCap: EXPAND_CAP_DEFAULT,
  mobileMode: false
};
function loadParams(){
  try{
    var raw = localStorage.getItem(PARAMS_STORAGE_KEY);
    if(!raw) return;
    var p = JSON.parse(raw);
    if(typeof p.maxAutoDepth==='number') appParams.maxAutoDepth = clamp(p.maxAutoDepth, MAX_AUTO_DEPTH_MIN, MAX_AUTO_DEPTH_MAX);
    if(typeof p.relaxStrength==='number') appParams.relaxStrength = clamp(p.relaxStrength, RELAX_MIN, RELAX_MAX);
    if(typeof p.globalFontScale==='number') appParams.globalFontScale = clamp(p.globalFontScale, GLOBAL_FONT_SCALE_MIN, GLOBAL_FONT_SCALE_MAX);
    if(typeof p.expandCap==='number') appParams.expandCap = clamp(p.expandCap, EXPAND_CAP_MIN, EXPAND_CAP_MAX);
    if(typeof p.mobileMode==='boolean') appParams.mobileMode = p.mobileMode;
  }catch(e){}
}
function saveParams(){
  try{ localStorage.setItem(PARAMS_STORAGE_KEY, JSON.stringify(appParams)); }catch(e){}
}

var COLOR_PRESETS = [
  { name:'indigo', fillL:'#eef1fd', borderL:'#4361ee', fillD:'#252c47', borderD:'#7d97fb' },
  { name:'teal',   fillL:'#e8f7f3', borderL:'#2ea88a', fillD:'#1f3a34', borderD:'#4fd9b6' },
  { name:'amber',  fillL:'#fdf3e7', borderL:'#e0895c', fillD:'#3c2c20', borderD:'#f0a879' },
  { name:'rose',   fillL:'#fdecf0', borderL:'#d1495b', fillD:'#3a2027', borderD:'#ed7b8a' },
  { name:'violet', fillL:'#f3ecfa', borderL:'#8e44ad', fillD:'#2f2438', borderD:'#bb7fd6' },
  { name:'slate',  fillL:'#eef0f3', borderL:'#5a6b8c', fillD:'#282c34', borderD:'#9aabc9' }
];
var BORDER_STYLES = ['solid','dashed','wave-thin','wave-thick'];
var BORDER_LINES_MIN = 1, BORDER_LINES_MAX = 5, BORDER_LINES_DEFAULT = 1;

var BASE_FONT = 30;        // baseline font size at sizeLevel=5 (default) — ~2x the old 14.5px
var BASE_DIAM = 190;       // baseline circular diameter at sizeLevel=5 — ~2x the old 92px
var CONTENT_PAD = 0.80;    // fraction of frame usable for text content

/* random-pick ("随机选一") panel: weighting formula, expressed as plain JS
   so the user can rewrite it from the panel itself. Inputs: importance
   (1-5, ＝该节点的边框线条数 — see importanceOf), masterLevel (1-5). Must
   return a non-negative weight; nodes are then picked with probability
   proportional to their weight (see pickRandomBNode). Below-threshold
   mastery gets a large bonus — "master小于阈值则大幅增大概率" — with the
   threshold written directly into the formula text as a literal number
   (no separate Th stepper control anymore — "Th也删掉,直接从公式里面编辑
   文本就能支持"). */
var DEFAULT_RANDOM_FORMULA = 'importance * (6 - masterLevel) + (masterLevel < 2 ? 20 : 0)';

var sanitizeScratch = document.createElement('div');
function sanitizeRich(html){
  sanitizeScratch.innerHTML = html;
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(c){
      if(c.nodeType===1){
        var tag = c.tagName.toLowerCase();
        if(tag==='b' || tag==='strong'){
          walk(c);
          if(tag==='strong'){
            var b = document.createElement('b');
            while(c.firstChild) b.appendChild(c.firstChild);
            c.replaceWith(b);
          }
        } else if(tag==='br'){
          // keep
        } else if(tag==='div' || tag==='p'){
          walk(c);
          var br = document.createElement('br');
          c.replaceWith.apply(c, Array.prototype.slice.call(c.childNodes).concat([br]));
        } else {
          walk(c);
          while(c.firstChild) c.parentNode.insertBefore(c.firstChild, c);
          c.remove();
        }
      } else if(c.nodeType!==3){
        c.remove();
      }
    });
  })(sanitizeScratch);
  return sanitizeScratch.innerHTML;
}
function richToPlain(html){
  sanitizeScratch.innerHTML = html;
  sanitizeScratch.querySelectorAll('br').forEach(function(br){ br.replaceWith('\n'); });
  return sanitizeScratch.textContent||'';
}

/* ============================================================
   state / persistence
   ============================================================ */
var state = loadState() || freshState();

function uid(p){ return p+'_'+Math.floor(Math.random()*1e9).toString(36)+Math.floor(Math.random()*1e9).toString(36); }

function freshState(){
  var rootId = uid('n');
  var nodes = {};
  nodes[rootId] = makeNode(rootId, null, '我的思维导图', 'Enter 编辑，⌥↓ 添加子节点');
  return {
    theme:'light',
    rootId: rootId,
    focusId: rootId,
    nodes: nodes,
    randomButtons: [defaultRandomButton(rootId)],
    randomFormula: DEFAULT_RANDOM_FORMULA
  };
}
/* the always-present, never-deletable button representing the global root's
   full B-node pool — "初始化的时候有一个虚拟按钮被实体化，也就是全局根节点".
   checkedIds holds the set of EXPLICITLY checked tree-view nodes; a
   button's effective scope is the union of those nodes' own subtrees (see
   randomButtonScopeBNodes) — checking one node implicitly checks its whole
   subtree, so checkedIds only needs to remember the top-level picks. */
function defaultRandomButton(rootId){
  return {id: uid('rb'), name:'全局', checkedIds: [rootId], isGlobal:true};
}
function makeNode(id, parentId, summary, detail){
  return {
    id:id, parentId: parentId||null, children: [],
    summary: summary||'', detail: detail||'',
    drilled:false,
    // four independent visual-scale floats — see scaleXFor/scaleYFor and
    // the big comment on SCALE_NOKIDS_DEFAULT/SCALE_KIDS_DEFAULT above.
    scaleXNoKids: SCALE_NOKIDS_DEFAULT, scaleYNoKids: SCALE_NOKIDS_DEFAULT,
    scaleXKids: SCALE_KIDS_DEFAULT, scaleYKids: SCALE_KIDS_DEFAULT,
    color:0, border:'solid', borderLines:BORDER_LINES_DEFAULT,
    vis:2, // 0=hidden(dimmed fill only) 1=summary-only 2=summary+detail
    px:0, py:0, placed:false,
    // centeredFit: OFF by default for every node — only ever flipped true
    // by the "中心化" button (see its own handler), and ONLY on the one
    // node that was the current focus root at the moment the button was
    // pressed. containerSize() reads this per-node flag to decide whether
    // to skip idealR's shared-scalar floor (see its own comment) — every
    // OTHER node, having this flag false, renders through the EXACT same
    // code path as before the button existed, so nothing about their
    // on-screen appearance can change just because centeredFit exists —
    // "别的节点不管怎么影响,我没有让它们中心化的时候,给我看到的效果必须
    // 不能变".
    centeredFit: false,
    // node classification: 'A' (abstract/high-level), 'B' (boundary/facet),
    // 'C' (content/leaf-level) — see classifyNode() for the constraint rules.
    category: 'A',
    // masterLevel is only meaningful for category==='B' nodes, but stored on
    // every node so it survives a category round-trip. Importance has NO
    // separate field — it is DEFINED as borderLines (see importanceOf()),
    // so editing the border-lines stepper IS editing importance, 1:1 and
    // in real time; there is nothing else to keep in sync.
    masterLevel: 3
  };
}
/* importance is not its own stored field — it's identically the node's
   border-line count ("Importance严格对齐该B节点的边框线条数...线条数就是I值").
   Reading it through this helper (rather than n.borderLines directly)
   documents the semantic meaning at each call site. */
function importanceOf(n){ return n.borderLines||1; }
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !s.nodes || !s.rootId) return null;
    if(!s.focusId || !s.nodes[s.focusId]) s.focusId = s.rootId;
    if(!s.theme) s.theme='light';
    sanitizeStateNodes(s);
    sanitizeRandomButtons(s);
    return s;
  }catch(e){ return null; }
}
/* migrate/validate the random-pick button list on load/import: guarantees
   the permanent global button exists exactly once, drops references to
   node ids that no longer exist (deleted subtrees), and fills in formula/N
   defaults for state saved before this feature existed. */
function sanitizeRandomButtons(s){
  if(!Array.isArray(s.randomButtons)) s.randomButtons = [];
  s.randomButtons.forEach(function(b){
    if(!Array.isArray(b.checkedIds)) b.checkedIds = [];
    b.checkedIds = b.checkedIds.filter(function(id){ return !!s.nodes[id]; });
    if(typeof b.name!=='string') b.name = '未命名';
  });
  var hasGlobal = s.randomButtons.some(function(b){ return b.isGlobal; });
  if(!hasGlobal) s.randomButtons.unshift(defaultRandomButton(s.rootId));
  // a formula referencing the removed showCount/N variables is a leftover
  // from before that feature was replaced by Th-based weighting (see
  // DEFAULT_RANDOM_FORMULA's own comment) — evalRandomWeight would just
  // silently fail on it every time (ReferenceError -> caught -> weight 1),
  // so migrate it forward to the current default instead of leaving a
  // formula that can never actually reference what it names. A formula
  // referencing `Th` is the SAME situation one generation later — Th was
  // removed as a separate stepper-controlled variable ("Th也删掉,直接从
  // 公式里面编辑文本就能支持"), so any saved formula that still names it
  // would now throw on every evaluation for the exact same reason.
  if(typeof s.randomFormula!=='string' || /\bshowCount\b|\bN\b|\bTh\b/.test(s.randomFormula)){
    s.randomFormula = DEFAULT_RANDOM_FORMULA;
  }
  delete s.randomN;
  delete s.randomTh;
}
function sanitizeStateNodes(s){
  Object.keys(s.nodes).forEach(function(id){
    var n = s.nodes[id];
    n.summary = sanitizeRich(n.summary||'');
    n.detail = sanitizeRich(n.detail||'');
    // migrate from the old single sizeLevel (or even older sizeMult)
    // system to the new 4-float scale model — an old sizeLevel applied
    // uniformly to BOTH the no-kids and kids size, so the migrated value
    // seeds all four fields equally; a node that had never been resized
    // (sizeLevel===5, the old default) just falls through to the new
    // system's own defaults instead.
    if(n.scaleXNoKids==null || n.scaleYNoKids==null || n.scaleXKids==null || n.scaleYKids==null){
      var legacyMult = null;
      if(n.sizeLevel!=null){
        var SIZE_LEVEL_RATIO_MIGRATE = Math.pow(100, 1/10); // matches the removed SIZE_LEVEL_RATIO (max-min=10) at their shared default level=5
        legacyMult = Math.pow(SIZE_LEVEL_RATIO_MIGRATE, n.sizeLevel-5);
      } else if(n.sizeMult!=null){
        legacyMult = n.sizeMult;
      }
      if(n.scaleXNoKids==null) n.scaleXNoKids = legacyMult!=null ? legacyMult : SCALE_NOKIDS_DEFAULT;
      if(n.scaleYNoKids==null) n.scaleYNoKids = legacyMult!=null ? legacyMult : SCALE_NOKIDS_DEFAULT;
      if(n.scaleXKids==null) n.scaleXKids = legacyMult!=null ? legacyMult*2 : SCALE_KIDS_DEFAULT;
      if(n.scaleYKids==null) n.scaleYKids = legacyMult!=null ? legacyMult*2 : SCALE_KIDS_DEFAULT;
    }
    delete n.sizeLevel;
    delete n.sizeMult;
    if(n.vis==null) n.vis = 2;
    if(n.placed==null) n.placed = !(n.px===0 && n.py===0);
    if(n.centeredFit==null) n.centeredFit = false;
    if(n.borderLines==null) n.borderLines = BORDER_LINES_DEFAULT;
    if(n.border==='double'){ n.border='solid'; n.borderLines=Math.max(n.borderLines,2); }
    if(n.border==='cloud') n.border='wave-thick';
    if(BORDER_STYLES.indexOf(n.border)===-1) n.border='solid';
    n.borderLines = clamp(n.borderLines, BORDER_LINES_MIN, BORDER_LINES_MAX);
    delete n.containerShape; // the circle-vs-rect container shape distinction (and its corner-triggered lock) is gone — every expanded container always renders as a rect now
    delete n.childScaleLock;
    if(n.category!=='A' && n.category!=='B' && n.category!=='C') n.category = 'A';
    delete n.importance; // importance is now derived from borderLines — see importanceOf()
    if(n.masterLevel==null) n.masterLevel = 3;
    delete n.showCount; // showCount tracking was removed entirely — see task on Th-based weighting
  });
  fixupCategoryConstraints(s);
}
/* enforce the A>B>C hierarchy constraint on load/import, in case the JSON
   was hand-edited or came from an older version with no categories at all
   (where sanitizeStateNodes just defaulted everyone to 'A', which already
   satisfies the constraint trivially — this pass is a no-op then). Walks
   top-down: a parent's category caps what its children are allowed to be
   (A children may be A/B/C, B children may be B/C, C children must be C). */
function fixupCategoryConstraints(s){
  var rank = {A:0, B:1, C:2};
  (function walk(id, minRank){
    var n = s.nodes[id];
    if(!n) return;
    if(rank[n.category] < minRank){
      n.category = minRank===1 ? 'B' : 'C';
    }
    var childMinRank = Math.max(minRank, rank[n.category]);
    n.children.forEach(function(cid){ walk(cid, childMinRank); });
  })(s.rootId, 0);
}
var saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }, 350);
}

/* ---- undo ---- */
var undoStack=[], MAX_UNDO=80;
function pushUndo(){
  try{
    undoStack.push(JSON.stringify({nodes:state.nodes, rootId:state.rootId}));
    if(undoStack.length>MAX_UNDO) undoStack.shift();
  }catch(e){}
}
function undo(){
  if(!undoStack.length) return;
  var snap = JSON.parse(undoStack.pop());
  state.nodes = snap.nodes;
  state.rootId = snap.rootId;
  if(!state.nodes[state.focusId]) state.focusId = state.rootId;
  if(selectedId && !state.nodes[selectedId]) selectedId = state.focusId;
  scheduleSave();
  if(typeof treeFlyout!=='undefined' && treeFlyout && treeFlyout.classList.contains('open')) renderTreeView();
  render();
}

/* ============================================================
   tree helpers
   ============================================================ */
function node(id){ return state.nodes[id]; }
function children(id){ var n=node(id); return n? n.children.map(node).filter(Boolean) : []; }
function parentOf(id){ var n=node(id); return n && n.parentId ? node(n.parentId) : null; }
function hasDetail(n){ return richToPlain(n.detail||'').length>0; }
/* while category-edit mode is active, every node's hidden content becomes
   temporarily visible as SUMMARY ONLY (never detail — "所有节点都可见
   summary，而不是summary+detail") — rendering only; n.vis itself is
   untouched, so exiting the mode restores exactly what was visible before.
   Every render()-time read of a node's visibility for DISPLAY purposes goes
   through this helper instead of raw n.vis. */
var catEditMode = false;
function effectiveVis(n){ return catEditMode ? 1 : n.vis; }
/* cycle a node's visibility toward higher visibility: 0(hidden)->1(summary)->2(summary+detail)->0.
   if the node has no detail text, skip level 2 (hidden<->summary only, 2-step cycle). */
function cycleVis(n){
  var maxVis = hasDetail(n) ? 2 : 1;
  n.vis = (n.vis>=maxVis) ? 0 : n.vis+1;
}
/* batch-cycle a group of nodes together: if ANY of them has detail text, the
   whole group cycles through the 3-step scheme in lockstep; otherwise (nobody
   in the group has detail) everyone uses the 2-step scheme. Nodes without
   detail simply render the same at level 1 and level 2. */
function cycleVisBatch(nodes){
  if(!nodes.length) return;
  var maxVis = nodes.some(hasDetail) ? 2 : 1;
  var next = (nodes[0].vis>=maxVis) ? 0 : nodes[0].vis+1;
  nodes.forEach(function(n){ n.vis = next; });
}
function isDescendant(ancestorId, id){
  var n = node(id);
  while(n && n.parentId){
    if(n.parentId===ancestorId) return true;
    n = node(n.parentId);
  }
  return false;
}
function subtreeIds(id, out){
  out = out||[];
  var n = node(id); if(!n) return out;
  out.push(id);
  n.children.forEach(function(cid){ subtreeIds(cid, out); });
  return out;
}

/* ============================================================
   random-pick ("随机选一") panel: pure data-layer helpers.
   ============================================================ */
/* the set of B-category nodes a button's checked selection covers — the
   union of every checked node's own subtree (checking a node implicitly
   checks its whole subtree, so this expands each checkedId out and filters
   to category==='B'), deduplicated. The global button's checkedIds is just
   [rootId], so this naturally covers "every B node anywhere" for it. */
function randomButtonScopeBNodes(btn){
  var seen = {}, out = [];
  (btn.checkedIds||[]).forEach(function(id){
    subtreeIds(id).forEach(function(cid){
      if(seen[cid]) return;
      seen[cid] = true;
      var n = node(cid);
      if(n && n.category==='B') out.push(n);
    });
  });
  return out;
}
/* evaluate the user-editable weighting formula for one B node. Wrapped in
   try/catch since the formula is free-text JS the user can edit from the
   panel — a syntax error or runtime throw must fall back to a neutral
   weight (1) rather than breaking the whole picker. */
function evalRandomWeight(formula, n){
  try{
    var fn = new Function('importance','masterLevel', 'return ('+formula+');');
    var w = fn(importanceOf(n), n.masterLevel);
    return (typeof w==='number' && isFinite(w) && w>=0) ? w : 0;
  }catch(e){ return 1; }
}
/* strict pass/fail check for the formula-status dot (green/yellow) — unlike
   evalRandomWeight (which always falls back to a safe neutral weight so a
   bad formula never breaks actual picking), this must be able to say
   "no, this text is currently broken" so the UI can refuse to apply it.
   Tests against every combination of importance(1-5) x masterLevel(1-5),
   not just one sample point, since a formula can throw only for particular
   inputs (e.g. dividing by masterLevel-3) and still compile/run fine for
   others — real B nodes span the whole 1-5 range on both axes, so anything
   that fails even one combination WOULD eventually throw or misbehave for
   some real node. */
function formulaIsValid(formula){
  try{
    var fn = new Function('importance','masterLevel', 'return ('+formula+');');
    for(var imp=1; imp<=5; imp++){
      for(var ml=1; ml<=5; ml++){
        var w = fn(imp, ml);
        if(!(typeof w==='number' && isFinite(w) && w>=0)) return false;
      }
    }
    return true;
  }catch(e){ return false; }
}
/* weighted-random pick among a button's B-node scope. Returns null if the
   scope is empty. */
function pickRandomBNode(btn){
  var pool = randomButtonScopeBNodes(btn);
  if(!pool.length) return null;
  var formula = state.randomFormula || DEFAULT_RANDOM_FORMULA;
  var weights = pool.map(function(n){ return evalRandomWeight(formula, n); });
  var total = weights.reduce(function(a,b){ return a+b; }, 0);
  if(total<=0){
    // every weight came out 0/invalid — fall back to uniform so the button
    // still does SOMETHING rather than silently picking nothing.
    return pool[Math.floor(Math.random()*pool.length)];
  }
  var r = Math.random()*total;
  for(var i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return pool[i];
  }
  return pool[pool.length-1];
}
/* expand EVERY descendant of `id` regardless of appParams.maxAutoDepth —
   "展开下面所有的C类节点（默认最大可视深度此时失效，除非手动再次变更它）".
   Unlike setExpandedToDepth (bounded by maxAutoDepth), this drills the
   entire subtree unconditionally; the max-depth setting only re-applies if
   the user manually collapses/re-expands something afterward through the
   normal UI, since those paths still call the bounded helpers. */
function expandEntireSubtree(id){
  var n = node(id);
  if(!n) return;
  n.children.forEach(function(cid){
    var c = node(cid);
    if(c && c.children.length){ c.drilled = true; expandEntireSubtree(cid); }
  });
}

/* collapse (set drilled=false) any descendant more than maxDepth levels below

   subtree doesn't stay fully expanded at the new, wider vantage point. */

    if(!n) return;

      n.drilled = false;
      n.children.forEach(function(cid){ walk(cid, depth+1); });

    }
    n.children.forEach(function(cid){ walk(cid, depth+1); });

   happened to have before. */

function addChild(parentId, summary, detail){
  var pn = node(parentId); if(!pn) return null;
  var id = uid('n');

  state.nodes[id].category = defaultCategoryForParent(parentId);
  pn.children.push(id);
  return id;
}

  var ids = subtreeIds(id);
  removeFromParent(id);
  ids.forEach(function(cid){ delete state.nodes[cid]; });
  if(state.focusId && ids.indexOf(state.focusId)!==-1) state.focusId = n.parentId || state.rootId;

  // keeps the persisted JSON honest.

    state.nodes[newRootId] = makeNode(newRootId, null, '新母节点', '');
    state.nodes[newRootId].children = [id];
    n.parentId = newRootId;
    state.rootId = newRootId;
    if(state.focusId===id) state.focusId = newRootId;
    return newRootId;
  }
  var gp = node(n.parentId);
  var newId = uid('n');
  state.nodes[newId] = makeNode(newId, gp.id, '新母节点', '');
  var idx = gp.children.indexOf(id);

    // new sibling can be placed alongside it as a child of that new parent.
    var newParentId = insertParentAbove(id);

  state.nodes[newId] = makeNode(newId, pn.id, summary, detail);

  var n = node(id); if(!n) return null;
  var newId = uid('n');

var mCanvas = document.createElement('canvas');

  tokens.forEach(function(tok){
    var tw = mCtx.measureText(tok).width;
    if(/^\s+$/.test(tok)){
      if(cur==='') return;
      if(curW+tw>maxWidth){ lines.push(cur); cur=''; curW=0; return; }
      cur+=tok; curW+=tw; return;
    }
    if(tw>maxWidth){
      if(cur){ lines.push(cur); cur=''; curW=0; }

      tok.split('').forEach(function(c){

    }

  lines.forEach(function(l){ var w=mCtx.measureText(l).width; if(w>maxW) maxW=w; });

var autoFitScale = 1; // global shrink factor when a container overflows viewport
var containmentOverflow = false; // set by containWithinRadius() when a child's own size can't fit even at px=py=0

   is DISTINCT from autoFitScale (a single global factor for the whole tree,
   used only to converge overflow across retries) — crowdScale instead
   solves "these particular siblings are too big for their particular
   parent's available room" by shrinking exactly that sibling group, so
   dragging among them always has slack and can never get physically stuck
   against a wall, no matter how tightly they were packed or how low
   relaxStrength is set. Not persisted (never read/written by save/load) —

var crowdScaleMap = {};

}

   (rather than, say, the average) means a node stretched 4x wider and
   0.25x shorter reports the same "size" as an unstretched node of the

  // that node (and its whole sibling set, uniformly) rather than the entire
  // tree, so drag headroom can always be recovered locally.
  return Math.max(6, BASE_FONT * appParams.globalFontScale * scalarScaleFor(n) * autoFitScale * crowdScaleFor(n));

/* Layout for one node's own box (summary-only or summary|detail split).

            两个形状平均半径的三倍").
   Applied independently per parent (this function is only ever called
   with one parent's own `kids`), using each child's CURRENT real px/py —
   so a container being drilled/collapsed, which changes its own rendered
   size and therefore every sibling's effective radius, naturally
   recomputes this on the very next render with no separate hook needed. */
function computeCrowdScale(kids, avail){
  // measure each child's box at its UNSCALED (factor-1) size first — leaving

  // recomputation.

    var a = natural[i];

    // sibling" — it's a hard constraint independent of relaxStrength, same
    // as before: a node's rendered footprint must always fit inside its
    // mother, regardless of how much overlap-with-siblings the slider
    // currently allows.

      // function's own top comment for the exact mapping and its

function layoutChildrenPositions(parentId, avail){

  });

  var settledBoxes = boxes.filter(function(b){ return b.node.placed; });

  // INITIAL ring-placement math below (rough by design, same as boxRadius) —
  // for a rect avail this is the inscribed circle's radius, which under-uses
  // a wide/tall rect's corners but that's fine since relax + drag can always
  // spread things out into the extra room afterward.
  var availRoughR = avail.shape==='rect' ? Math.min(avail.halfW, avail.halfH) : avail.r;

        var d = Math.sqrt(b.node.px*b.node.px+b.node.py*b.node.py) + b.r;

        b.node.py = Math.sin(ang)*placeR;

        // its very FIRST frame whenever maxSettledR is already close to
        // avail's own limit — which flagIfOutOfBounds then flags as
        // containmentOverflow forever, since nothing else ever moves a
        // "fresh" node back inward. render()'s retry loop un-places it
        // again every single pass (see freshlyPlacedThisPass handling) and
        // NEVER re-clamps it, so the exact same too-large placeR gets
        // recomputed from scratch on every render — and since maxSettledR
        // is read from whatever the OTHER (actually-settled) sibling's
        // CURRENT position is, dragging that sibling closer to center
        // paradoxically didn't help (the fresh nodes' own math never even
        // looked at the container boundary to begin with). This one clamp
        // is what makes first-frame placement always converge instead of
        // needing 9 retry passes to maybe stumble into a valid position —
        // confirmed against a real saved file where two children sat at
        // exactly ±90° and a radius that had visibly grown past their
        // container on repeated saves ("这次能彻底修复吗").
        var t = maxReachInAvail(avail, b.node.px, b.node.py, b.w, b.h);

      // (read-only) settled ones — passing the full `boxes` array to
      // relaxBoxes here was the bug: its overlap push and centering pull
      // both move EVERY box they're given, so inserting one new sibling
      // was silently re-shuffling every already-settled sibling's position
      // too (previously reported as "新建节点会打乱所有兄弟节点排版" and
      // "所有节点变得不可拖动" once autoFitScale's overflow-retry loop then
      // reacted to the resulting churn). freshBoxes is a real subset of the
      // SAME box objects (not copies), so moving them here is exactly the
      // node.px/py mutation this function is meant to perform.
      relaxFreshAgainstSettled(freshBoxes, settledBoxes, 12);
      // re-clamp after relaxing against settled siblings — the relax pass
      // above can push a fresh box that was JUST clamped back outward
      // again while resolving a sibling collision, so the boundary must be
      // the LAST word, not the ring-placement's first guess.
      freshBoxes.forEach(function(b){
        var t2 = maxReachInAvail(avail, b.node.px, b.node.py, b.w, b.h);
        if(t2<1 && isFinite(t2)){ b.node.px *= t2; b.node.py *= t2; }
      });
    }
  }

  // real-time hard "wall": while a direct child of THIS container is being
  // actively dragged, its own position is clamped every frame to stay inside
  // the parent's boundary — this is what makes it physically impossible to
  // drag a child outside its mother node (previously this only got fixed on
  // release via a global font-shrink retry, which couldn't pull back a
  // position dragged far outside, so the node visually escaped). Crowding
  // against siblings is NEVER resolved by moving anything here anymore —
  // computeCrowdScale (called above, every render, including every frame of
  // a live drag) is the only response to two nodes getting too close, and it
  // shrinks the whole sibling group instead of moving any single node's
  // px/py. That is what makes the drag-around-two-crowded-siblings case
  // stop "jumping": there is no iterative, order-dependent push-resolution
  // step left that could snap between different stable arrangements.
  if(draggingNodeId && kids.some(function(k){ return k.id===draggingNodeId; })){
    clampDraggedNodeToParent(boxes, draggingNodeId, avail);
  }

  // never move a settled sibling's position outside of drag — that is
  // exactly the jitter this rewrite set out to eliminate (selecting a node,
  // pressing Esc, the glow timeout, etc. must never shift anything).
  // Instead, only DETECT whether the current layout has any overlap or
  // boundary overflow and flag it; render() responds by shrinking
  // autoFitScale (which shrinks every node a little, preserving all
  // relative positions/ratios, so it can never turn a non-overlap into an
  // overlap) and rebuilding from scratch. This is the ONLY mechanism that
  // corrects violations caused by something other than an active drag
  // (e.g. bumping a node's size level, or the window resizing).
  flagIfOutOfBounds(boxes, avail);
}
function clampDraggedNodeToParent(boxes, draggingId, avail){
  boxes.forEach(function(b){
    if(b.node.id!==draggingId) return;
    // the parent's boundary is either a circle (default drilled containers)
    // or a rect (fullscreen/locked containers, see availForContainer) —
    // maxReachInAvail handles both shapes uniformly, scaling the node's
    // OWN position vector down just enough to bring it back inside whichever
    // boundary actually applies, instead of assuming circular always.
    var t = maxReachInAvail(avail, b.node.px, b.node.py, b.w, b.h);

      containmentOverflow = true;
    }
    // sibling-vs-sibling overlap is NO LONGER flagged here: computeCrowdScale
    // now intentionally allows real overlap between siblings whenever
    // relaxStrength is low (down to half-radius overlap at relaxStrength=0,
    // per "最低时候,允许覆盖一半") — that overlap is the DESIGN, not a defect,
    // so treating it as a containmentOverflow violation here would fight
    // the crowd-scale system it's supposed to only detect boundary escapes
    // for. Only containment against the PARENT's own boundary (checked
    // above) remains a hard, relaxStrength-independent violation — a node's
    // rendered footprint must always fit inside its mother regardless of
    // how much sibling overlap the slider currently allows.

function relaxBoxes(boxes, iterations, allowCentering){
  var n = boxes.length;

  for(var iter=0; iter<iterations; iter++){
    for(var i=0;i<n;i++){
      for(var j=i+1;j<n;j++){
        var A=boxes[i].node, B=boxes[j].node;
        var dx=B.px-A.px, dy=B.py-A.py;

        var minGap = boxes[i].r + boxes[j].r + 34;
        if(d < minGap){

          B.px += ux*push; B.py += uy*push;
        }
      }
    }

      // for post-drag settling (that would drag untouched siblings toward
      // each other over repeated drags and make them feel "glued").

/* place freshBoxes clear of each other and of the (untouched) settledBoxes

   without perturbing anything the user already positioned. No centering
   pull here at all (unlike relaxBoxes' allowCentering) — pulling fresh
   boxes toward their own mean would still be a real position change on

        var d = Math.sqrt(dx*dx+dy*dy)||0.001;

      settledBoxes.forEach(function(S){
        var dx=Fi.node.px-S.node.px, dy=Fi.node.py-S.node.py;
        var d = Math.sqrt(dx*dx+dy*dy)||0.001;
        var minGap = Fi.r + S.r + 34;
        if(d < minGap){
          var push = minGap-d;
          var ux=dx/d, uy=dy/d;
          Fi.node.px += ux*push; Fi.node.py += uy*push;

  }
}

/* size of a node when it acts as a drilled container: must fit its own children ring.

   nested container used to render as a CIRCLE while expanded (only the
   fullscreen root, or one that had tripped a one-way corner-lock, got the
   rect treatment) — but availForContainer's circle branch measures usable
   room as a single radius (Math.min(w,h)/2), which is inherently smaller
   than a rect's two independent half-extents for the exact same outer
   footprint. That mismatch was the real cause of "二级时看起来更小" AND
   the "轻微拖动后突然变大" jump: dragging a child could accidentally cross
   the old corner-lock threshold mid-drag, silently swapping the container

var GROWTH_CAP_RATIO = 2.2; // a drilled container's outer footprint may grow at most this many times its own plain-leaf diameter before its interior starts shrinking to compensate — see containerSize

    var b = k.drilled ? containerSize(k) : computeNodeBox(k);
    return {node:k, r:boxRadius(b.w, b.h), w:b.w, h:b.h};
  });
  var sumD=0; boxes.forEach(function(b){ sumD+=b.r*2*1.14; });

  // see this function's own doc comment above for why the old
  // circle-vs-rect split (and its corner-triggered one-way lock) is gone.

  // idealR is folded in as a floor on both so a container with only fresh
  // (not-yet-settled) children still gets a sane minimum size.
  // n.centeredFit (set ONLY by the "中心化" button, on ONLY the one node
  // it was pressed for — see makeNode's own comment) skips the idealR
  // floor entirely: idealR is a single scalar shared across BOTH axes
  // (a rough "if these kids were arranged in a ring" estimate), so on a
  // kids arrangement that's wide-but-short or narrow-but-tall, folding it
  // in as a floor on the SHORT axis pads that axis with leftover space
  // the real children never asked for — exactly the "四个方向留白不均"
  // complaint. Every other node (centeredFit still false, the default)
